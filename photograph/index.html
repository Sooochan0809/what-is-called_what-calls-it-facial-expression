<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photograph</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --font-sans: "ヒラギノ明朝 ProN W6", "HiraMinProN-W6", "HG明朝E", "ＭＳ Ｐ明朝", "MS PMincho", "MS 明朝", serif;
            --color-page: #f7f8fa;
            --color-on-dark: #fff;
            --color-shutter: #000;
            --color-status: #1b2026e0;
            --color-status-text: #f4f7fb;
            --color-control: #343a40;
            --color-panel: #ffffff66;
            --color-timer: #ffffffe6;
            --color-overlay: #f7f8fa94;
            --color-overlay-card: #ffffffd1;
            --color-overlay-border: #d9dee5d1;
            --color-muted: #68727e;
            --color-backdrop: #1118217a;
            --color-dialog-shadow: #17202a3d;
            --color-note-border: #ead8bd;
            --color-note-background: #fffaf3;
            --color-note-text: #3f4650;
            --color-note-accent: #b85f16;
            --color-panel-text: #17202a;
            --color-score-track: #e7ecf1;
            --color-progress-track: #17202a1f;
            --color-positive: #27c28a;
            --color-warning: #ef8b39;
            --color-negative: #dd4d5d;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: var(--color-page);
            color: var(--color-panel-text);
            font-family: var(--font-sans);
        }

        .introScene {
            box-sizing: border-box;
            width: 100%;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .introScene[hidden] {
            display: none;
        }

        .introContent {
            width: min(480px, 100%);
            display: grid;
            gap: 20px;
            justify-items: start;
            text-align: start;
            transform: translateY(88px);
        }

        .introTitle {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2rem);
            line-height: 1.15;
        }

        .introText {
            margin: 0;
            color: var(--color-muted);
            font-size: clamp(0.95rem, 2vw, 1.08rem);
            line-height: 1.9;
            text-align: left;
        }

        .startButton {
            justify-self: end;
            min-height: 44px;
            border: 1px solid var(--color-overlay-border);
            border-radius: 6px;
            background: var(--color-panel-text);
            padding: 0 18px;
            color: var(--color-on-dark);
            font: inherit;
            font-size: 0.98rem;
            cursor: pointer;
        }

        .consentDialog {
            width: min(640px, calc(100% - 40px));
            border: 1px solid var(--color-overlay-border);
            border-radius: 16px;
            background: var(--color-on-dark);
            padding: 0;
            color: var(--color-panel-text);
            box-shadow: 0 24px 72px var(--color-dialog-shadow);
            transform: translateY(88px);
        }

        .consentDialog::backdrop {
            background: var(--color-backdrop);
            backdrop-filter: blur(3px);
        }

        .consentContent {
            display: grid;
            gap: 24px;
            padding: 32px 36px;
            text-align: center;
        }

        .consentText {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.7;
        }

        .consentQuestion {
            display: block;
            font-size: 1.4rem;
            line-height: 1.5;
            white-space: nowrap;
        }

        .consentNotes {
            display: grid;
            gap: 8px;
            margin-top: 24px;
            border: 1px solid var(--color-note-border);
            border-radius: 10px;
            background: var(--color-note-background);
            padding: 14px 16px;
            text-align: left;
        }

        .consentNote {
            display: grid;
            grid-template-columns: 1.2em minmax(0, 1fr);
            column-gap: 8px;
            align-items: start;
            color: var(--color-note-text);
            font-size: 0.7em;
            font-weight: 400;
            line-height: 1.6;
        }

        .consentNote::before {
            content: "※";
            color: var(--color-note-accent);
            font-weight: 700;
            text-align: center;
        }

        .consentActions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .consentButton {
            min-height: 54px;
            border: 1px solid var(--color-overlay-border);
            border-radius: 8px;
            background: var(--color-on-dark);
            color: var(--color-panel-text);
            font: inherit;
            font-size: 1rem;
            cursor: pointer;
        }

        .consentButton--accept {
            border-color: var(--color-panel-text);
            background: var(--color-panel-text);
            color: var(--color-on-dark);
        }

        main {
            position: relative;
            width: min(100vw, 75vh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        #video,
        #capturePreview {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100dvh;
            height: min(100vw, 75vh);
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1) rotate(90deg);
        }

        #capturePreview {
            z-index: 3;
            pointer-events: none;
        }

        .captureProgress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            height: 8px;
            background: var(--color-progress-track);
        }

        .captureProgress[hidden] {
            display: none;
        }

        .captureProgressFill {
            display: block;
            width: 0;
            height: 100%;
            background: var(--color-positive);
        }

        .frameGuide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            --length: 12%;
            --thickness: 8px;
            color: var(--color-positive);
            opacity: 0.88;
            width: min(80%, 800px);
            height: min(84%, 1140px);
            border-radius: 12px;
            background:
                linear-gradient(currentColor 0 0) top left / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) top left / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) top right / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) top right / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) bottom left / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) bottom left / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) bottom right / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) bottom right / var(--thickness) var(--length) no-repeat;
        }

        .blink {
            position: absolute;
            inset: 0;
            z-index: 4;
            background:
                linear-gradient(var(--color-shutter) 0 0) top / 100% 0 no-repeat,
                linear-gradient(var(--color-shutter) 0 0) bottom / 100% 0 no-repeat;
            pointer-events: none;
        }

        output {
            box-sizing: border-box;
            min-width: 0;
            max-width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            background: var(--color-status);
            color: var(--color-status-text);
            font-size: clamp(14px, 2vw, 20px);
            white-space: nowrap;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: baseline;
            gap: 8px;
        }

        output[hidden] {
            display: none;
        }

        #cameraMode {
            padding: 8px;
            border: 0;
            border-radius: 8px;
            background: var(--color-control);
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .emotionPanel {
            position: absolute;
            z-index: 4;
            top: 24px;
            left: 8px;
            right: 8px;
            display: grid;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            background: var(--color-panel);
            color: var(--color-panel-text);
            opacity: 0.88;
            pointer-events: none;
        }

        #scoreText {
            display: block;
            min-width: 0;
            overflow: hidden;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.4;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scoreBar {
            display: grid;
            grid-template-columns: repeat(var(--segment-count, 10), minmax(0, 1fr));
            gap: 3px;
        }

        .scoreSegment {
            height: 9px;
            border-radius: 999px;
            background: var(--color-score-track);
            transition: background-color 120ms linear;
        }

        .scoreSegment.is-filled {
            background: var(--accent);
        }

        .scoreBar.is-frozen .scoreSegment {
            transition: none;
        }

        .situationTimer {
            position: absolute;
            top: 104px;
            right: 12px;
            z-index: 4;
            min-width: 2.8em;
            padding: 8px 14px;
            border: 1px solid var(--color-score-track);
            border-radius: 999px;
            background: var(--color-timer);
            color: var(--color-panel-text);
            font-size: 1.1rem;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            line-height: 1;
            text-align: center;
            pointer-events: none;
        }

        .situationTimer.is-ending {
            border-color: var(--color-negative);
            color: var(--color-negative);
        }

        .partIntro {
            position: absolute;
            inset: 0;
            z-index: 6;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--color-overlay);
            backdrop-filter: blur(10px);
        }

        .partIntro[hidden] {
            display: none;
        }

        .partIntroCard {
            box-sizing: border-box;
            width: min(680px, 100%);
            display: grid;
            gap: 10px;
            padding: 32px 40px;
            border: 1px solid var(--color-overlay-border);
            border-radius: 6px;
            background: var(--color-overlay-card);
            text-align: center;
        }

        #partIntroLabel {
            margin: 0;
            color: var(--color-muted);
            font-size: clamp(0.72rem, 1.5vw, 0.88rem);
            font-weight: 600;
            letter-spacing: 0.12em;
            line-height: 1.6;
        }

        #partIntroText {
            margin: 0;
            color: var(--color-panel-text);
            font-size: clamp(1.6rem, 4vw, 3rem);
            line-height: 1.2;
        }

        .controlsFooter {
            position: absolute;
            inset: auto 16px 16px;
            z-index: 2;
            display: flex;
        }

        #statusText {
            overflow: hidden;
            padding-left: 12px;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            .consentQuestion {
                font-size: clamp(0.7rem, 3.6vw, 1.4rem);
            }
        }

        @media (max-width: 400px) {
            .consentContent {
                padding: 24px 12px;
            }

            .consentNotes {
                padding-inline: 12px;
            }
        }

        @media (max-width: 1120px) {
            .emotionPanel {
                top: 32px;
                left: 16px;
                right: 16px;
                gap: 12px;
                padding: 14px 16px;
            }

            #scoreText {
                font-size: 2.25rem;
            }

            .scoreSegment {
                height: 14px;
            }

            .situationTimer {
                top: 152px;
                right: 24px;
                padding: 12px 20px;
                font-size: 1.75rem;
            }
        }

        @media (min-width: 768px) and (min-height: 1200px) and (orientation: portrait) {
            .introScene {
                padding: 48px;
            }

            .introContent {
                width: min(820px, 100%);
            }

            .introTitle {
                font-size: clamp(2.4rem, 4.2vw, 3rem);
            }

            .introText {
                font-size: clamp(1.25rem, 2.25vw, 1.5rem);
                line-height: 1.85;
            }

            .startButton {
                min-height: 64px;
                padding: 0 32px;
                font-size: 1.25rem;
            }

            .consentDialog {
                width: min(720px, calc(100% - 96px));
            }

            .consentContent {
                gap: 36px;
                padding: 44px;
            }

            .consentText {
                font-size: 1.5rem;
            }

            .consentQuestion {
                font-size: 1.7rem;
            }

            .consentButton {
                min-height: 64px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <section id="introScene" class="introScene">
        <div class="introContent">
            <h1 id="introTitle" class="introTitle"></h1>
            <p id="introText" class="introText"></p>
            <button id="startButton" class="startButton" type="button" disabled>はじめる</button>
        </div>
    </section>

    <dialog id="consentDialog" class="consentDialog" aria-labelledby="consentText">
        <div class="consentContent">
            <p id="consentText" class="consentText">
                <span id="consentQuestion" class="consentQuestion"></span>
                <span id="consentNotes" class="consentNotes">
                    <span class="consentNote"></span>
                    <span class="consentNote"></span>
                </span>
            </p>
            <div class="consentActions">
                <button id="consentAcceptButton" class="consentButton consentButton--accept" type="button">はい</button>
                <button id="consentDeclineButton" class="consentButton" type="button">いいえ</button>
            </div>
        </div>
    </dialog>

    <main id="photographScene" hidden>
        <video id="video" autoplay muted playsinline></video>
        <img id="capturePreview" alt="撮影画像" hidden>
        <div id="captureProgress" class="captureProgress" aria-hidden="true" hidden>
            <span id="captureProgressFill" class="captureProgressFill"></span>
        </div>
        <div class="frameGuide" aria-hidden="true"></div>
        <div id="blink" class="blink" aria-hidden="true" hidden></div>
        <section id="partIntro" class="partIntro" aria-live="polite" hidden>
            <div class="partIntroCard">
                <p id="partIntroLabel">パート1</p>
                <h2 id="partIntroText">状況文</h2>
            </div>
        </section>
        <header class="emotionPanel" aria-label="感情推定">
            <strong id="scoreText">読込中</strong>
            <div id="scoreBar" class="scoreBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0"></div>
        </header>
        <div id="situationTimer" class="situationTimer" aria-label="残り時間">0:30</div>
        <footer class="controlsFooter">
            <output id="status" aria-live="polite" hidden>
                <label for="cameraMode">設定:</label>
                <select id="cameraMode" aria-label="Webcam画質" disabled>
                    <option>画質検出中...</option>
                </select>
                <span id="statusLabel">状態:</span>
                <span id="statusText">カメラ起動中...</span>
            </output>
        </footer>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const introScene = $("introScene");
        const photographScene = $("photographScene");
        const startButton = $("startButton");
        const consentDialog = $("consentDialog");
        const video = $("video");
        const capturePreview = $("capturePreview");
        const captureProgress = $("captureProgress");
        const captureProgressFill = $("captureProgressFill");
        const status = $("status");
        const statusLabel = $("statusLabel");
        const statusText = $("statusText");
        const cameraMode = $("cameraMode");
        const scoreText = $("scoreText");
        const scoreBar = $("scoreBar");
        const situationTimer = $("situationTimer");
        const partIntro = $("partIntro");
        const partIntroLabel = $("partIntroLabel");
        const partIntroText = $("partIntroText");
        const blink = $("blink");
        const guideAudio = new Audio("guide.mp3");
        const shutterAudio = new Audio("shutter.mp3");
        guideAudio.preload = "auto";
        const emotionCanvas = document.createElement("canvas");
        const emotionContext = emotionCanvas.getContext("2d");
        const MODEL_URL = "../modules/faceAPI/models";
        const COPY_FIELDS = ["introTitle", "introText", "consentQuestion"];
        const RECORDING_MIME_TYPES = ["video/webm;codecs=vp8", "video/webm;codecs=vp9", "video/webm"];
        const WEBM_CLUSTER_LOOKBACK_MS = 2000;
        const WEBM_KEYFRAME_INTERVAL_MS = 1000;
        const cameraModes = [
            [3840, 2160, 60], [3840, 2160, 30],
            [2560, 1440, 60], [2560, 1440, 30],
            [1920, 1080, 60], [1920, 1080, 30],
            [1280, 720, 90], [1280, 720, 60], [1280, 720, 30]
        ];
        let statusFrameCallback = 0;
        let situations = [];
        let situationIndex = 0;
        let rotationIntervalMs = 30000;
        let rotationTimer = 0;
        let rotationClockTimer = 0;
        let rotationStartedAt = 0;
        let partIntroTimer = 0;
        let partIntroDurationMs = 3000;
        let latestExpressions = {};
        let scoreSegments = [];
        let displayedSegmentCount = 0;
        let targetSegmentCount = 0;
        let scoreStepIntervalMs = 80;
        let scoreStepTimer = 0;
        let shutterScoreThreshold = 80;
        let shutterTransitionDurationMs = 270;
        let shutterHoldDurationMs = 60;
        let shutterPreviewDurationMs = 2000;
        let shutterEasing = "ease-in-out";
        let recordingBeforeMs = 2000;
        let recordingAfterMs = 3000;
        let recording = null;
        let captureInProgress = false;
        let recordingEnabled = false;
        let configurationReady;

        function stopSituationRotation() {
            clearTimeout(rotationTimer);
            clearInterval(rotationClockTimer);
        }

        function stopScoreAnimation() {
            clearTimeout(scoreStepTimer);
            scoreStepTimer = 0;
        }

        function stepScore() {
            scoreStepTimer = 0;
            if (!partIntro.hidden) return;
            if (displayedSegmentCount === targetSegmentCount) return;
            const direction = Math.sign(targetSegmentCount - displayedSegmentCount);
            displayedSegmentCount += direction;
            const segmentIndex = direction > 0 ? displayedSegmentCount - 1 : displayedSegmentCount;
            scoreSegments[segmentIndex].classList.toggle("is-filled", direction > 0);
            const displayedScore = Math.round(displayedSegmentCount / scoreSegments.length * 100);
            scoreBar.setAttribute("aria-valuenow", displayedScore);
            if (displayedScore >= shutterScoreThreshold) playShutter();
            if (!captureInProgress && displayedSegmentCount !== targetSegmentCount)
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
        }

        function renderScore() {
            if (photographScene.hidden || captureInProgress || !partIntro.hidden) return;
            const emotions = situations[situationIndex]?.emotions || [];
            const score = Math.min(1, Math.max(0, ...emotions.map((name) => Number(latestExpressions[name]) || 0)));
            const rounded = Math.round(score * 100);
            targetSegmentCount = Math.ceil(score * scoreSegments.length);
            const accent = rounded >= 72 ? "var(--color-positive)" : rounded >= 44 ? "var(--color-warning)" : "var(--color-negative)";
            scoreBar.style.setProperty("--accent", accent);
            if (!scoreStepTimer && displayedSegmentCount !== targetSegmentCount)
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
        }

        function showSituation(index) {
            clearTimeout(partIntroTimer);
            stopSituationRotation();
            stopScoreAnimation();
            situationIndex = (index + situations.length) % situations.length;
            scoreText.textContent = situations[situationIndex].text;
            partIntroLabel.textContent = `Scene${situationIndex + 1}`;
            partIntroText.textContent = situations[situationIndex].text;
            partIntro.hidden = false;
            guideAudio.pause();
            guideAudio.currentTime = 0;
            guideAudio.play().catch(() => { });
            rotationStartedAt = performance.now();
            updateSituationTimer();
            partIntroTimer = setTimeout(() => {
                guideAudio.pause();
                partIntro.hidden = true;
                renderScore();
                startSituationRotation();
            }, partIntroDurationMs);
        }

        function updateSituationTimer() {
            const remainingSeconds = Math.ceil(Math.max(0, rotationIntervalMs - (performance.now() - rotationStartedAt)) / 1000);
            situationTimer.textContent = `${Math.floor(remainingSeconds / 60)}:${String(remainingSeconds % 60).padStart(2, "0")}`;
            situationTimer.classList.toggle("is-ending", remainingSeconds <= 10);
        }

        function startSituationRotation() {
            stopSituationRotation();
            rotationStartedAt = performance.now();
            updateSituationTimer();
            rotationClockTimer = setInterval(updateSituationTimer, 250);
            rotationTimer = setTimeout(() => showSituation(situationIndex + 1), rotationIntervalMs);
        }

        function advanceAfterShutter() {
            stopScoreAnimation();
            displayedSegmentCount = 0;
            latestExpressions = {};
            scoreSegments.forEach((segment) => segment.classList.remove("is-filled"));
            scoreBar.classList.remove("is-frozen");
            scoreBar.setAttribute("aria-valuenow", 0);
            showSituation(situationIndex + 1);
        }

        async function loadConfig() {
            const response = await fetch("config.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const config = await response.json();
            if (!Array.isArray(config.situations) || !config.situations.length || config.situations.some(
                ({ text, emotions }) => typeof text !== "string" || !Array.isArray(emotions) || !emotions.length
            )) throw new Error("状況文の設定が不正です");
            const copy = config.copy;
            if (!copy || COPY_FIELDS.some((field) => typeof copy[field] !== "string")
                || !Array.isArray(copy.consentNotes) || !copy.consentNotes.length
                || copy.consentNotes.some((text) => typeof text !== "string")) throw new Error("表示文言の設定が不正です");

            COPY_FIELDS.forEach((field) => $(field).textContent = copy[field]);
            $("consentNotes").replaceChildren(...copy.consentNotes.map((text) => {
                const note = document.createElement("span");
                note.className = "consentNote";
                note.textContent = text;
                return note;
            }));

            situations = config.situations;
            rotationIntervalMs = Math.max(1000, Number(config.rotationIntervalMs) || 30000);
            partIntroDurationMs = Math.max(0, Number(config.partIntroDurationMs) || 3000);
            scoreStepIntervalMs = Math.max(1, Number(config.scoreStepIntervalMs) || 80);
            const shutter = config.shutter || {};
            shutterScoreThreshold = Math.min(100, Math.max(0, Number(shutter.scoreThreshold ?? 80)));
            shutterTransitionDurationMs = Math.max(1, Number(shutter.transitionDurationMs ?? 270));
            shutterHoldDurationMs = Math.max(0, Number(shutter.holdDurationMs ?? 60));
            shutterPreviewDurationMs = Math.max(0, Number(shutter.previewDurationMs ?? 2000) || 0);
            shutterEasing = shutter.easing || "ease-in-out";
            const recording = config.recording || {};
            recordingBeforeMs = Math.max(0, Number(recording.secondsBefore ?? 2) || 0) * 1000;
            recordingAfterMs = Math.max(0, Number(recording.secondsAfter ?? 3) || 0) * 1000;
            const segmentCount = Math.max(1, Math.round(Number(config.scoreSegmentCount) || 10));
            scoreBar.style.setProperty("--segment-count", segmentCount);
            scoreBar.innerHTML = '<span class="scoreSegment"></span>'.repeat(segmentCount);
            scoreSegments = [...scoreBar.children];
        }

        const findWebmCluster = (bytes) => {
            for (let index = 0; index <= bytes.length - 4; index += 1) {
                if (bytes[index] === 0x1f && bytes[index + 1] === 0x43 && bytes[index + 2] === 0xb6 && bytes[index + 3] === 0x75) return index;
            }
            return -1;
        };

        const findWebmHeader = (bytes) => {
            for (let index = 0; index <= bytes.length - 4; index += 1) {
                if (bytes[index] === 0x1a && bytes[index + 1] === 0x45 && bytes[index + 2] === 0xdf && bytes[index + 3] === 0xa3) return index;
            }
            return -1;
        };

        const webmVintLength = (byte) => {
            for (let length = 1, mask = 0x80; length <= 8; length += 1, mask >>= 1) {
                if (byte & mask) return length;
            }
            return 0;
        };

        function normalizeWebmTimecodes(bytes) {
            let firstTimecode;
            for (let cluster = findWebmCluster(bytes); cluster >= 0;) {
                const nextOffset = findWebmCluster(bytes.subarray(cluster + 4));
                const nextCluster = nextOffset < 0 ? bytes.length : cluster + 4 + nextOffset;
                const sizeLength = webmVintLength(bytes[cluster + 4]);
                const limit = Math.min(nextCluster, cluster + 4 + sizeLength + 64);
                for (let index = cluster + 4 + sizeLength; index < limit - 2; index += 1) {
                    if (bytes[index] !== 0xe7) continue;
                    const valueLength = bytes[index + 1] & 0x7f;
                    const valueAt = index + 2;
                    if (!valueLength || valueLength > 4 || valueAt + valueLength > limit) break;
                    let value = 0;
                    for (let offset = 0; offset < valueLength; offset += 1) value = value * 256 + bytes[valueAt + offset];
                    firstTimecode ??= value;
                    value -= firstTimecode;
                    for (let offset = valueLength - 1; offset >= 0; offset -= 1) {
                        bytes[valueAt + offset] = value & 0xff;
                        value = Math.floor(value / 256);
                    }
                    break;
                }
                if (nextOffset < 0) break;
                cluster = nextCluster;
            }
            return bytes;
        }

        const webmTimecodeCheck = normalizeWebmTimecodes(Uint8Array.of(
            0x1f, 0x43, 0xb6, 0x75, 0x84, 0xe7, 0x82, 0x03, 0xe8,
            0x1f, 0x43, 0xb6, 0x75, 0x84, 0xe7, 0x82, 0x04, 0x4c
        ));
        console.assert(
            findWebmHeader(Uint8Array.of(0, 0x1a, 0x45, 0xdf, 0xa3)) === 1
            && webmTimecodeCheck[7] === 0 && webmTimecodeCheck[8] === 0 && webmTimecodeCheck[17] === 100,
            "WebMデータを正規化できません"
        );

        async function createWebmClip(blobs, header, type) {
            const bytes = new Uint8Array(await new Blob(blobs).arrayBuffer());
            const clusterAt = findWebmCluster(bytes);
            if (!header || clusterAt < 0) throw new Error("WebMデータを作成できませんでした");
            const clip = new Blob([header, normalizeWebmTimecodes(bytes.slice(clusterAt))], { type });
            if (findWebmHeader(new Uint8Array(await clip.slice(0, 4).arrayBuffer())) !== 0) {
                throw new Error("WebMヘッダーを作成できませんでした");
            }
            return clip;
        }

        const overlapsCaptureWindow = ({ startAt, endAt }, capture) =>
            startAt <= capture.endAt && endAt >= capture.startAt - WEBM_CLUSTER_LOOKBACK_MS;

        console.assert(
            overlapsCaptureWindow({ startAt: 1500, endAt: 2500 }, { startAt: 4000, endAt: 9000 })
            && !overlapsCaptureWindow({ startAt: 1000, endAt: 1999 }, { startAt: 4000, endAt: 9000 }),
            "WebMの先行映像を保持できません"
        );

        function stopRecordingBuffer() {
            const session = recording;
            recording = null;
            if (!session) return;
            session.recorder.ondataavailable = null;
            if (session.recorder.state !== "inactive") session.recorder.stop();
            session.track.stop();
            session.pending?.reject(new Error("録画設定が変更されました"));
        }

        function startRecordingBuffer() {
            const sourceTrack = video.srcObject?.getVideoTracks()[0];
            if (!sourceTrack || typeof MediaRecorder === "undefined") return;
            stopRecordingBuffer();
            const track = sourceTrack.clone();
            const mimeType = RECORDING_MIME_TYPES.find((type) => MediaRecorder.isTypeSupported(type)) || "";
            let recorder;
            try {
                recorder = new MediaRecorder(new MediaStream([track]), {
                    ...(mimeType && { mimeType }),
                    videoKeyFrameIntervalDuration: WEBM_KEYFRAME_INTERVAL_MS
                });
            } catch (error) {
                track.stop();
                console.error("WebM録画を開始できませんでした。", error);
                return;
            }
            const session = recording = { recorder, track, header: null, chunks: [], pending: null };
            const startedAt = performance.now();
            let lastChunkAt = startedAt;
            let queue = Promise.resolve();
            const initialBlobs = [];
            recorder.ondataavailable = ({ data, timeStamp: endAt }) => {
                queue = queue.then(async () => {
                    if (recording !== session || !data?.size) return;
                    let chunk = data;
                    if (!session.header) {
                        initialBlobs.push(data);
                        const initialBlob = new Blob(initialBlobs, { type: data.type });
                        const bytes = new Uint8Array(await initialBlob.arrayBuffer());
                        const headerAt = findWebmHeader(bytes);
                        if (headerAt < 0) {
                            if (initialBlob.size > 16 * 1024 * 1024) throw new Error(`WebMヘッダーを取得できませんでした（${data.type || "形式不明"}）`);
                            return;
                        }
                        const clusterOffset = findWebmCluster(bytes.subarray(headerAt));
                        if (clusterOffset < 0) return;
                        const clusterAt = headerAt + clusterOffset;
                        session.header = new Blob([bytes.slice(headerAt, clusterAt)], { type: data.type });
                        initialBlobs.length = 0;
                        lastChunkAt = startedAt;
                        chunk = new Blob([bytes.slice(clusterAt)], { type: data.type });
                    }
                    session.chunks.push({ startAt: lastChunkAt, endAt, blob: chunk });
                    lastChunkAt = endAt;
                    const cutoff = (session.pending?.startAt ?? endAt - recordingBeforeMs) - WEBM_CLUSTER_LOOKBACK_MS;
                    session.chunks = session.chunks.filter(({ endAt: chunkEnd }) => chunkEnd >= cutoff);
                    if (session.pending && endAt >= session.pending.endAt) {
                        const capture = session.pending;
                        session.pending = null;
                        const blobs = session.chunks.filter((chunk) => overlapsCaptureWindow(chunk, capture)).map(({ blob }) => blob);
                        capture.resolve(await createWebmClip(blobs, session.header, recorder.mimeType || "video/webm"));
                    }
                }).catch((error) => {
                    session.pending?.reject(error);
                    session.pending = null;
                    console.error("WebMデータを処理できませんでした。", error);
                });
            };
            recorder.onerror = ({ error }) => {
                session.pending?.reject(error);
                session.pending = null;
                console.error("WebM録画に失敗しました。", error);
            };
            recorder.start(250);
        }

        function recordClip(triggerAt) {
            return new Promise((resolve, reject) => {
                const session = recording;
                if (!session?.header || session.recorder.state !== "recording" || session.pending) {
                    reject(new Error("WebM録画の準備ができていません"));
                    return;
                }
                session.pending = {
                    startAt: triggerAt - recordingBeforeMs,
                    endAt: triggerAt + recordingAfterMs,
                    resolve,
                    reject
                };
                session.recorder.requestData();
                setTimeout(() => session.recorder.state === "recording" && session.recorder.requestData(), recordingAfterMs);
            });
        }

        function captureImage() {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d", { alpha: false }).drawImage(video, 0, 0);
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNGを作成できませんでした")), "image/png");
            });
        }

        const crc32Table = Uint32Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            return value >>> 0;
        });

        async function blobCrc32(blob) {
            let crc = 0xffffffff;
            for await (const bytes of blob.stream()) {
                for (const byte of bytes) crc = crc32Table[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function zipStamp(date) {
            return {
                date: ((Math.max(1980, date.getFullYear()) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
                time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2)
            };
        }

        async function createZip(files) {
            const encoder = new TextEncoder();
            const localParts = [];
            const entries = [];
            let offset = 0;
            for (const file of files) {
                const name = encoder.encode(file.name);
                const crc = await blobCrc32(file.blob);
                const stamp = zipStamp(file.createdAt);
                const header = new Uint8Array(30 + name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x04034b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 0x0800, true);
                view.setUint16(10, stamp.time, true);
                view.setUint16(12, stamp.date, true);
                view.setUint32(14, crc, true);
                view.setUint32(18, file.blob.size, true);
                view.setUint32(22, file.blob.size, true);
                view.setUint16(26, name.length, true);
                header.set(name, 30);
                localParts.push(header, file.blob);
                entries.push({ name, crc, stamp, size: file.blob.size, offset });
                offset += header.length + file.blob.size;
            }
            const centralParts = entries.map((entry) => {
                const header = new Uint8Array(46 + entry.name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x02014b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 20, true);
                view.setUint16(8, 0x0800, true);
                view.setUint16(12, entry.stamp.time, true);
                view.setUint16(14, entry.stamp.date, true);
                view.setUint32(16, entry.crc, true);
                view.setUint32(20, entry.size, true);
                view.setUint32(24, entry.size, true);
                view.setUint16(28, entry.name.length, true);
                view.setUint32(42, entry.offset, true);
                header.set(entry.name, 46);
                return header;
            });
            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new Uint8Array(22);
            const endView = new DataView(end.buffer);
            endView.setUint32(0, 0x06054b50, true);
            endView.setUint16(8, entries.length, true);
            endView.setUint16(10, entries.length, true);
            endView.setUint32(12, centralSize, true);
            endView.setUint32(16, offset, true);
            return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = filename;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function captureNames(createdAt) {
            const emotion = situations[situationIndex].emotions.reduce((best, key) => {
                const score = Number(latestExpressions[key]) || 0;
                return score > best.score ? { key, score } : best;
            }, { key: situations[situationIndex].emotions[0], score: 0 });
            const two = (value) => String(value).padStart(2, "0");
            const archive = `called_${two(createdAt.getMonth() + 1)}${two(createdAt.getDate())}_${two(createdAt.getHours())}${two(createdAt.getMinutes())}${two(createdAt.getSeconds())}`;
            return { archive, file: `${emotion.key}_${Math.round(emotion.score * 100)}` };
        }

        async function saveCapture(triggerAt, createdAt, names, imagePromise) {
            const [image, clip] = await Promise.all([imagePromise, recordClip(triggerAt)]);
            const zip = await createZip([
                { name: `${names.file}.png`, blob: image, createdAt },
                { name: `${names.file}.webm`, blob: clip, createdAt }
            ]);
            downloadBlob(zip, `${names.archive}.zip`);
        }

        function videoFrameSize() {
            return {
                width: Math.round(video.videoHeight / 2) * 2,
                height: Math.round(video.videoWidth / 2) * 2
            };
        }

        function measureStatus() {
            const size = videoFrameSize();
            statusLabel.textContent = "実測:";
            statusText.textContent = `${size.width}x${size.height} / 計測中`;
            let startedAt;
            let frames = 0;

            const measure = (now) => {
                if (statusLabel.textContent !== "実測:") return;
                if (startedAt !== undefined) frames += 1;
                else startedAt = now;

                const elapsed = now - startedAt;
                if (elapsed >= 1000) {
                    const current = videoFrameSize();
                    statusText.textContent = `${current.width}x${current.height} / ${Math.round(frames * 1000 / elapsed)}fps`;
                    startedAt = now;
                    frames = 0;
                }
                statusFrameCallback = video.requestVideoFrameCallback(measure);
            };

            statusFrameCallback = video.requestVideoFrameCallback(measure);
        }

        function updateEmotionCanvas() {
            const scale = 224 / video.videoHeight;
            emotionCanvas.width = 224;
            emotionCanvas.height = Math.round(video.videoWidth * scale);
            emotionContext.setTransform(0, scale, scale, 0, 0, 0);
        }

        function modeConstraints(mode, nativeOnly) {
            const [width, height, frameRate] = mode;
            return {
                width: { exact: width },
                height: { exact: height },
                frameRate: { exact: frameRate },
                ...(nativeOnly && { resizeMode: { exact: "none" } })
            };
        }

        function currentMode(track) {
            const { width, height, frameRate } = track.getSettings();
            return [width, height, Math.round(frameRate)];
        }

        async function detectCameraModes(track) {
            const capabilities = track.getCapabilities?.() || {};
            const nativeOnly = capabilities.resizeMode?.includes("none");
            const initialMode = currentMode(track);
            const supported = new Map();

            for (const mode of cameraModes) {
                const [width, height, frameRate] = mode;
                if (capabilities.width && (width < capabilities.width.min || width > capabilities.width.max)) continue;
                if (capabilities.height && (height < capabilities.height.min || height > capabilities.height.max)) continue;
                if (capabilities.frameRate && (frameRate < capabilities.frameRate.min || frameRate > capabilities.frameRate.max)) continue;
                try {
                    await track.applyConstraints(modeConstraints(mode, nativeOnly));
                    const actual = track.getSettings();
                    if (actual.width === width && actual.height === height && Math.abs(actual.frameRate - frameRate) < 1) {
                        supported.set(mode.join(), mode);
                    }
                } catch { }
            }

            try {
                await track.applyConstraints(modeConstraints(initialMode, nativeOnly));
            } catch { }

            const selectedMode = currentMode(track);
            supported.set(selectedMode.join(), selectedMode);
            const modes = [...supported.values()].sort((a, b) => b[0] * b[1] - a[0] * a[1] || b[2] - a[2]);
            cameraMode.replaceChildren(...modes.map((mode) => new Option(`${mode[0]}x${mode[1]} / ${mode[2]}fps`, mode.join())));
            cameraMode.value = selectedMode.join();
            cameraMode.disabled = false;
        }

        async function startCamera() {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    }
                });
                await video.play();
                updateEmotionCanvas();
                const track = video.srcObject.getVideoTracks()[0];
                await detectCameraModes(track);
                updateEmotionCanvas();
                measureStatus();
                if (recordingEnabled) startRecordingBuffer();
            } catch (error) {
                cameraMode.innerHTML = "<option>画質を検出できません</option>";
                cameraMode.disabled = true;
                statusLabel.textContent = "エラー:";
                statusText.textContent = `カメラを開始できません: ${error.message}`;
            }
        }

        async function detectEmotion(detectOptions) {
            try {
                emotionContext.drawImage(video, 0, 0);
                latestExpressions = (await faceapi.detectSingleFace(emotionCanvas, detectOptions).withFaceExpressions())?.expressions || {};
            } catch {
                latestExpressions = {};
            }
            renderScore();
            setTimeout(() => detectEmotion(detectOptions), 200);
        }

        async function startEmotionDetection() {
            try {
                await configurationReady;
            } catch (error) {
                scoreText.textContent = "設定を読み込めません";
                console.error("photograph/config.json を読み込めませんでした。", error);
                return;
            }

            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                detectEmotion(new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 }));
            } catch (error) {
                scoreText.textContent = "モデルを読み込めません";
                console.error("FaceAPIモデルを読み込めませんでした。", error);
            }
        }

        async function playShutter() {
            if (!blink.hidden || captureInProgress || !partIntro.hidden) return;
            captureInProgress = true;
            updateSituationTimer();
            stopSituationRotation();
            stopScoreAnimation();
            scoreBar.classList.add("is-frozen");
            const triggerAt = performance.now();
            const createdAt = new Date();
            const imagePromise = captureImage();
            const savePromise = recordingEnabled
                ? saveCapture(triggerAt, createdAt, captureNames(createdAt), imagePromise).catch((error) => {
                    console.error("画像と映像を保存できませんでした。", error);
                })
                : Promise.resolve();
            blink.hidden = false;
            shutterAudio.currentTime = 0;
            shutterAudio.play().catch(() => { });
            const closeAnimation = blink.animate([
                { backgroundSize: "100% 0, 100% 0" },
                { backgroundSize: "100% 50%, 100% 50%" }
            ], { duration: shutterTransitionDurationMs, easing: shutterEasing, fill: "forwards" });
            let previewUrl;
            try {
                const [, image] = await Promise.all([closeAnimation.finished, imagePromise]);
                previewUrl = URL.createObjectURL(image);
                capturePreview.src = previewUrl;
                capturePreview.hidden = false;
                await capturePreview.decode();
                blink.style.backgroundSize = "100% 50%, 100% 50%";
                closeAnimation.cancel();
                await new Promise((resolve) => setTimeout(resolve, shutterHoldDurationMs));
                await blink.animate([
                    { backgroundSize: "100% 50%, 100% 50%" },
                    { backgroundSize: "100% 0, 100% 0" }
                ], { duration: shutterTransitionDurationMs, easing: shutterEasing }).finished;
                blink.hidden = true;
                captureProgress.hidden = false;
                await captureProgressFill.animate([
                    { width: "0%" },
                    { width: "100%" }
                ], { duration: shutterPreviewDurationMs, easing: "linear" }).finished;
            } catch (error) {
                console.error("撮影画像を表示できませんでした。", error);
            } finally {
                blink.hidden = true;
                blink.style.removeProperty("background-size");
                captureProgress.hidden = true;
                capturePreview.hidden = true;
                capturePreview.removeAttribute("src");
                if (previewUrl) URL.revokeObjectURL(previewUrl);
                captureInProgress = false;
                advanceAfterShutter();
                await savePromise;
            }
        }

        cameraMode.addEventListener("change", async () => {
            const track = video.srcObject?.getVideoTracks()[0];
            if (!track) return;
            cameraMode.disabled = true;
            try {
                const nativeOnly = track.getCapabilities?.().resizeMode?.includes("none");
                await track.applyConstraints(modeConstraints(cameraMode.value.split(",").map(Number), nativeOnly));
                updateEmotionCanvas();
                if (recordingEnabled) startRecordingBuffer();
                if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
                measureStatus();
            } catch (error) {
                cameraMode.value = currentMode(track).join();
                statusLabel.textContent = "エラー:";
                statusText.textContent = `画質を変更できません: ${error.message}`;
            } finally {
                cameraMode.disabled = false;
            }
        });
        function startExperience(enableRecording) {
            if (!photographScene.hidden) return;
            recordingEnabled = enableRecording;
            if (consentDialog.open) consentDialog.close();
            introScene.hidden = true;
            photographScene.hidden = false;
            if (recordingEnabled) startRecordingBuffer();
            configurationReady.then(() => showSituation(0)).catch(() => { });
        }

        startButton.addEventListener("click", () => consentDialog.showModal());
        consentDialog.addEventListener("cancel", (event) => event.preventDefault());
        $("consentAcceptButton").addEventListener("click", () => startExperience(true));
        $("consentDeclineButton").addEventListener("click", () => startExperience(false));
        document.addEventListener("keydown", (event) => {
            if (!introScene.hidden) {
                if (event.code === "Space" && !startButton.disabled) {
                    event.preventDefault();
                    startExperience(true);
                }
                return;
            }
            if (event.code === "Space") {
                event.preventDefault();
                status.hidden = !status.hidden;
                return;
            }
            if (!situations.length || captureInProgress || event.target.matches("input, select, textarea, button")) return;
            const step = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
            if (!step) return;
            event.preventDefault();
            showSituation(situationIndex + step);
        });
        window.addEventListener("pagehide", () => {
            guideAudio.pause();
            clearTimeout(partIntroTimer);
            stopSituationRotation();
            stopRecordingBuffer();
            stopScoreAnimation();
            if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
            video.srcObject?.getTracks().forEach((track) => track.stop());
        });
        window.addEventListener("load", () => {
            startCamera();
            configurationReady = loadConfig();
            startEmotionDetection();
            startButton.disabled = false;
        });
    </script>
</body>
