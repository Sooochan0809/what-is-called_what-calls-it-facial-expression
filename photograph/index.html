<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photograph</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            --font-sans: "ヒラギノ明朝 ProN W6", "HiraMinProN-W6", "HG明朝E", "ＭＳ Ｐ明朝", "MS PMincho", "MS 明朝", serif;
            --color-page: #f0f0f0;
            --color-shutter: #000;
            --color-status: #1b2026e0;
            --color-status-text: #f4f7fb;
            --color-control: #343a40;
            --color-panel: #ffffff66;
            --color-panel-text: #17202a;
            --color-score-track: #e7ecf1;
            --color-positive: #27c28a;
            --color-warning: #ef8b39;
            --color-negative: #dd4d5d;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: var(--color-page);
            font-family: var(--font-sans);
        }

        main {
            position: relative;
            width: min(100vw, 75vh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        #video {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100dvh;
            height: min(100vw, 75vh);
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1) rotate(90deg);
        }

        .frameGuide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            --length: 12%;
            --thickness: 8px;
            color: var(--color-positive);
            opacity: 0.88;
            width: min(80%, 800px);
            height: min(84%, 1140px);
            border-radius: 12px;
            background:
                linear-gradient(currentColor 0 0) top left / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) top left / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) top right / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) top right / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) bottom left / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) bottom left / var(--thickness) var(--length) no-repeat,
                linear-gradient(currentColor 0 0) bottom right / var(--length) var(--thickness) no-repeat,
                linear-gradient(currentColor 0 0) bottom right / var(--thickness) var(--length) no-repeat;
        }

        .blink {
            position: absolute;
            inset: 0;
            z-index: 4;
            background:
                linear-gradient(var(--color-shutter) 0 0) top / 100% 0 no-repeat,
                linear-gradient(var(--color-shutter) 0 0) bottom / 100% 0 no-repeat;
            pointer-events: none;
        }

        output {
            box-sizing: border-box;
            min-width: 0;
            max-width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            background: var(--color-status);
            color: var(--color-status-text);
            font-size: clamp(14px, 2vw, 20px);
            white-space: nowrap;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: baseline;
            gap: 8px;
        }

        #cameraMode {
            padding: 8px;
            border: 0;
            border-radius: 8px;
            background: var(--color-control);
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .emotionPanel {
            position: absolute;
            z-index: 4;
            top: 24px;
            left: 8px;
            right: 8px;
            display: grid;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            background: var(--color-panel);
            color: var(--color-panel-text);
            opacity: 0.88;
            pointer-events: none;
        }

        #scoreText {
            display: block;
            min-width: 0;
            overflow: hidden;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.4;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scoreBar {
            display: grid;
            grid-template-columns: repeat(var(--segment-count, 10), minmax(0, 1fr));
            gap: 3px;
        }

        .scoreSegment {
            height: 9px;
            border-radius: 999px;
            background: var(--color-score-track);
            transition: background-color 120ms linear;
        }

        .scoreSegment.is-filled {
            background: var(--accent);
        }

        .controlsFooter {
            position: absolute;
            inset: auto 16px 16px;
            z-index: 2;
            display: flex;
        }

        #statusText {
            overflow: hidden;
            padding-left: 12px;
            text-overflow: ellipsis;
        }

        @media (max-width: 1120px) {
            .emotionPanel {
                top: 32px;
                left: 16px;
                right: 16px;
                gap: 12px;
                padding: 14px 16px;
            }

            #scoreText {
                font-size: 2.25rem;
            }

            .scoreSegment {
                height: 14px;
            }
        }
    </style>
</head>

<body>
    <main>
        <video id="video" autoplay muted playsinline></video>
        <div class="frameGuide" aria-hidden="true"></div>
        <div id="blink" class="blink" aria-hidden="true" hidden></div>
        <header class="emotionPanel" aria-label="感情推定">
            <strong id="scoreText">読込中</strong>
            <div id="scoreBar" class="scoreBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0"></div>
        </header>
        <footer class="controlsFooter">
            <output id="status" aria-live="polite">
                <label for="cameraMode">設定:</label>
                <select id="cameraMode" aria-label="Webcam画質" disabled>
                    <option>画質検出中...</option>
                </select>
                <span id="statusLabel">状態:</span>
                <span id="statusText">カメラ起動中...</span>
            </output>
        </footer>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const video = $("video");
        const statusLabel = $("statusLabel");
        const statusText = $("statusText");
        const cameraMode = $("cameraMode");
        const scoreText = $("scoreText");
        const scoreBar = $("scoreBar");
        const blink = $("blink");
        const shutterAudio = new Audio("shutter.mp3");
        const emotionCanvas = document.createElement("canvas");
        const emotionContext = emotionCanvas.getContext("2d");
        const MODEL_URL = "../modules/faceAPI/models";
        const RECORDING_MIME_TYPES = ["video/webm;codecs=vp8", "video/webm;codecs=vp9", "video/webm"];
        const cameraModes = [
            [3840, 2160, 60], [3840, 2160, 30],
            [2560, 1440, 60], [2560, 1440, 30],
            [1920, 1080, 60], [1920, 1080, 30],
            [1280, 720, 90], [1280, 720, 60], [1280, 720, 30]
        ];
        let statusFrameCallback = 0;
        let situations = [];
        let situationIndex = 0;
        let rotationIntervalMs = 30000;
        let rotationTimer = 0;
        let latestExpressions = {};
        let scoreSegments = [];
        let displayedSegmentCount = 0;
        let targetSegmentCount = 0;
        let scoreStepIntervalMs = 80;
        let scoreStepTimer = 0;
        let shutterScoreThreshold = 80;
        let shutterTransitionDurationMs = 270;
        let shutterHoldDurationMs = 60;
        let shutterEasing = "ease-in-out";
        let shutterWasAboveThreshold = false;
        let recordingBeforeMs = 2000;
        let recordingAfterMs = 3000;
        let mediaRecorder = null;
        let recordingTrack = null;
        let recordingHeader = null;
        let recordingChunks = [];
        let recordingStartedAt = 0;
        let lastChunkAt = 0;
        let recordingQueue = Promise.resolve();
        let pendingClip = null;
        let captureInProgress = false;

        function stepScore() {
            scoreStepTimer = 0;
            if (displayedSegmentCount === targetSegmentCount) return;
            const direction = Math.sign(targetSegmentCount - displayedSegmentCount);
            displayedSegmentCount += direction;
            const segmentIndex = direction > 0 ? displayedSegmentCount - 1 : displayedSegmentCount;
            scoreSegments[segmentIndex].classList.toggle("is-filled", direction > 0);
            const displayedScore = Math.round(displayedSegmentCount / scoreSegments.length * 100);
            scoreBar.setAttribute("aria-valuenow", displayedScore);
            const shutterIsAboveThreshold = displayedScore >= shutterScoreThreshold;
            if (shutterIsAboveThreshold && !shutterWasAboveThreshold) playShutter();
            shutterWasAboveThreshold = shutterIsAboveThreshold;
            if (displayedSegmentCount !== targetSegmentCount)
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
        }

        function renderScore() {
            const emotions = situations[situationIndex]?.emotions || [];
            const score = Math.min(1, Math.max(0, ...emotions.map((name) => Number(latestExpressions[name]) || 0)));
            const rounded = Math.round(score * 100);
            targetSegmentCount = Math.ceil(score * scoreSegments.length);
            const accent = rounded >= 72 ? "var(--color-positive)" : rounded >= 44 ? "var(--color-warning)" : "var(--color-negative)";
            scoreBar.style.setProperty("--accent", accent);
            if (!scoreStepTimer && displayedSegmentCount !== targetSegmentCount)
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
        }

        function showSituation(index) {
            situationIndex = (index + situations.length) % situations.length;
            scoreText.textContent = situations[situationIndex].text;
            renderScore();
        }

        function startSituationRotation() {
            clearInterval(rotationTimer);
            rotationTimer = setInterval(() => showSituation(situationIndex + 1), rotationIntervalMs);
        }

        function advanceAfterShutter() {
            clearTimeout(scoreStepTimer);
            scoreStepTimer = 0;
            displayedSegmentCount = 0;
            shutterWasAboveThreshold = false;
            latestExpressions = {};
            scoreSegments.forEach((segment) => segment.classList.remove("is-filled"));
            scoreBar.setAttribute("aria-valuenow", 0);
            showSituation(situationIndex + 1);
            startSituationRotation();
        }

        async function loadConfig() {
            const response = await fetch("config.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const config = await response.json();
            if (!Array.isArray(config.situations) || !config.situations.length || config.situations.some(
                ({ text, emotions }) => typeof text !== "string" || !Array.isArray(emotions) || !emotions.length
            )) throw new Error("状況文の設定が不正です");

            situations = config.situations;
            rotationIntervalMs = Math.max(1000, Number(config.rotationIntervalMs) || 30000);
            scoreStepIntervalMs = Math.max(1, Number(config.scoreStepIntervalMs) || 80);
            const shutter = config.shutter || {};
            shutterScoreThreshold = Math.min(100, Math.max(0, Number(shutter.scoreThreshold ?? 80)));
            shutterTransitionDurationMs = Math.max(1, Number(shutter.transitionDurationMs ?? 270));
            shutterHoldDurationMs = Math.max(0, Number(shutter.holdDurationMs ?? 60));
            shutterEasing = shutter.easing || "ease-in-out";
            const recording = config.recording || {};
            recordingBeforeMs = Math.max(0, Number(recording.secondsBefore ?? 2) || 0) * 1000;
            recordingAfterMs = Math.max(0, Number(recording.secondsAfter ?? 3) || 0) * 1000;
            const segmentCount = Math.max(1, Math.round(Number(config.scoreSegmentCount) || 10));
            scoreBar.style.setProperty("--segment-count", segmentCount);
            scoreBar.innerHTML = '<span class="scoreSegment"></span>'.repeat(segmentCount);
            scoreSegments = [...scoreBar.children];
            showSituation(0);
            startSituationRotation();
        }

        const findWebmCluster = (bytes) => {
            for (let index = 0; index <= bytes.length - 4; index += 1) {
                if (bytes[index] === 0x1f && bytes[index + 1] === 0x43 && bytes[index + 2] === 0xb6 && bytes[index + 3] === 0x75) return index;
            }
            return -1;
        };

        const findWebmHeader = (bytes) => {
            for (let index = 0; index <= bytes.length - 4; index += 1) {
                if (bytes[index] === 0x1a && bytes[index + 1] === 0x45 && bytes[index + 2] === 0xdf && bytes[index + 3] === 0xa3) return index;
            }
            return -1;
        };

        const hasWebmHeader = (bytes) => findWebmHeader(bytes) === 0;

        const webmVintLength = (byte) => {
            for (let length = 1, mask = 0x80; length <= 8; length += 1, mask >>= 1) {
                if (byte & mask) return length;
            }
            return 0;
        };

        function normalizeWebmTimecodes(bytes) {
            let firstTimecode;
            for (let cluster = findWebmCluster(bytes); cluster >= 0;) {
                const nextOffset = findWebmCluster(bytes.subarray(cluster + 4));
                const nextCluster = nextOffset < 0 ? bytes.length : cluster + 4 + nextOffset;
                const sizeLength = webmVintLength(bytes[cluster + 4]);
                const limit = Math.min(nextCluster, cluster + 4 + sizeLength + 64);
                for (let index = cluster + 4 + sizeLength; index < limit - 2; index += 1) {
                    if (bytes[index] !== 0xe7) continue;
                    const valueLength = bytes[index + 1] & 0x7f;
                    const valueAt = index + 2;
                    if (!valueLength || valueLength > 4 || valueAt + valueLength > limit) break;
                    let value = 0;
                    for (let offset = 0; offset < valueLength; offset += 1) value = value * 256 + bytes[valueAt + offset];
                    firstTimecode ??= value;
                    value -= firstTimecode;
                    for (let offset = valueLength - 1; offset >= 0; offset -= 1) {
                        bytes[valueAt + offset] = value & 0xff;
                        value = Math.floor(value / 256);
                    }
                    break;
                }
                if (nextOffset < 0) break;
                cluster = nextCluster;
            }
            return bytes;
        }

        const webmTimecodeCheck = normalizeWebmTimecodes(Uint8Array.of(
            0x1f, 0x43, 0xb6, 0x75, 0x84, 0xe7, 0x82, 0x03, 0xe8,
            0x1f, 0x43, 0xb6, 0x75, 0x84, 0xe7, 0x82, 0x04, 0x4c
        ));
        console.assert(
            findWebmHeader(Uint8Array.of(0, 0x1a, 0x45, 0xdf, 0xa3)) === 1
            && webmTimecodeCheck[7] === 0 && webmTimecodeCheck[8] === 0 && webmTimecodeCheck[17] === 100,
            "WebMデータを正規化できません"
        );

        async function createWebmClip(blobs, type) {
            const bytes = new Uint8Array(await new Blob(blobs).arrayBuffer());
            const clusterAt = findWebmCluster(bytes);
            if (!recordingHeader || clusterAt < 0) throw new Error("WebMデータを作成できませんでした");
            const clip = new Blob([recordingHeader, normalizeWebmTimecodes(bytes.slice(clusterAt))], { type });
            if (!hasWebmHeader(new Uint8Array(await clip.slice(0, 4).arrayBuffer()))) {
                throw new Error("WebMヘッダーを作成できませんでした");
            }
            return clip;
        }

        function stopRecordingBuffer() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.ondataavailable = null;
                mediaRecorder.stop();
            }
            recordingTrack?.stop();
            pendingClip?.reject(new Error("録画設定が変更されました"));
            mediaRecorder = recordingTrack = recordingHeader = pendingClip = null;
            recordingChunks = [];
        }

        function startRecordingBuffer() {
            const sourceTrack = video.srcObject?.getVideoTracks()[0];
            if (!sourceTrack || typeof MediaRecorder === "undefined") return;
            stopRecordingBuffer();
            recordingTrack = sourceTrack.clone();
            const mimeType = RECORDING_MIME_TYPES.find((type) => MediaRecorder.isTypeSupported(type)) || "";
            try {
                mediaRecorder = new MediaRecorder(new MediaStream([recordingTrack]), mimeType ? { mimeType } : undefined);
            } catch (error) {
                recordingTrack.stop();
                recordingTrack = null;
                console.error("WebM録画を開始できませんでした。", error);
                return;
            }
            recordingStartedAt = performance.now();
            lastChunkAt = recordingStartedAt;
            recordingQueue = Promise.resolve();
            const recorder = mediaRecorder;
            const initialBlobs = [];
            recorder.ondataavailable = ({ data }) => {
                const endAt = performance.now();
                recordingQueue = recordingQueue.then(async () => {
                    if (mediaRecorder !== recorder || !data?.size) return;
                    let chunk = data;
                    if (!recordingHeader) {
                        initialBlobs.push(data);
                        const initialBlob = new Blob(initialBlobs, { type: data.type });
                        const bytes = new Uint8Array(await initialBlob.arrayBuffer());
                        const headerAt = findWebmHeader(bytes);
                        if (headerAt < 0) {
                            if (initialBlob.size > 16 * 1024 * 1024) throw new Error(`WebMヘッダーを取得できませんでした（${data.type || "形式不明"}）`);
                            return;
                        }
                        const clusterOffset = findWebmCluster(bytes.subarray(headerAt));
                        if (clusterOffset < 0) return;
                        const clusterAt = headerAt + clusterOffset;
                        recordingHeader = new Blob([bytes.slice(headerAt, clusterAt)], { type: data.type });
                        initialBlobs.length = 0;
                        lastChunkAt = recordingStartedAt;
                        chunk = new Blob([bytes.slice(clusterAt)], { type: data.type });
                    }
                    recordingChunks.push({ startAt: lastChunkAt, endAt, blob: chunk });
                    lastChunkAt = endAt;
                    const cutoff = pendingClip?.startAt ?? endAt - recordingBeforeMs - 1500;
                    recordingChunks = recordingChunks.filter(({ endAt: chunkEnd }) => chunkEnd >= cutoff);
                    if (pendingClip && endAt >= pendingClip.endAt) {
                        const capture = pendingClip;
                        pendingClip = null;
                        const blobs = recordingChunks
                            .filter(({ startAt, endAt: chunkEnd }) => startAt <= capture.endAt && chunkEnd >= capture.startAt)
                            .map(({ blob }) => blob);
                        capture.resolve(await createWebmClip(blobs, recorder.mimeType || "video/webm"));
                    }
                }).catch((error) => {
                    pendingClip?.reject(error);
                    pendingClip = null;
                    console.error("WebMデータを処理できませんでした。", error);
                });
            };
            mediaRecorder.onerror = ({ error }) => {
                pendingClip?.reject(error);
                pendingClip = null;
                console.error("WebM録画に失敗しました。", error);
            };
            mediaRecorder.start(250);
        }

        function recordClip(triggerAt) {
            return new Promise((resolve, reject) => {
                if (!recordingHeader || mediaRecorder?.state !== "recording" || pendingClip) {
                    reject(new Error("WebM録画の準備ができていません"));
                    return;
                }
                pendingClip = {
                    startAt: triggerAt - recordingBeforeMs,
                    endAt: triggerAt + recordingAfterMs,
                    resolve,
                    reject
                };
                setTimeout(() => mediaRecorder?.state === "recording" && mediaRecorder.requestData(), recordingAfterMs);
            });
        }

        const canvasBlob = (canvas) => new Promise((resolve, reject) => {
            canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNGを作成できませんでした")), "image/png");
        });

        function captureImage() {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d", { alpha: false }).drawImage(video, 0, 0);
            return canvasBlob(canvas);
        }

        const crc32Table = Uint32Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            return value >>> 0;
        });

        async function blobCrc32(blob) {
            let crc = 0xffffffff;
            for await (const bytes of blob.stream()) {
                for (const byte of bytes) crc = crc32Table[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function zipStamp(date) {
            return {
                date: ((Math.max(1980, date.getFullYear()) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
                time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2)
            };
        }

        async function createZip(files) {
            const encoder = new TextEncoder();
            const localParts = [];
            const entries = [];
            let offset = 0;
            for (const file of files) {
                const name = encoder.encode(file.name);
                const crc = await blobCrc32(file.blob);
                const stamp = zipStamp(file.createdAt);
                const header = new Uint8Array(30 + name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x04034b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 0x0800, true);
                view.setUint16(10, stamp.time, true);
                view.setUint16(12, stamp.date, true);
                view.setUint32(14, crc, true);
                view.setUint32(18, file.blob.size, true);
                view.setUint32(22, file.blob.size, true);
                view.setUint16(26, name.length, true);
                header.set(name, 30);
                localParts.push(header, file.blob);
                entries.push({ name, crc, stamp, size: file.blob.size, offset });
                offset += header.length + file.blob.size;
            }
            const centralParts = entries.map((entry) => {
                const header = new Uint8Array(46 + entry.name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x02014b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 20, true);
                view.setUint16(8, 0x0800, true);
                view.setUint16(12, entry.stamp.time, true);
                view.setUint16(14, entry.stamp.date, true);
                view.setUint32(16, entry.crc, true);
                view.setUint32(20, entry.size, true);
                view.setUint32(24, entry.size, true);
                view.setUint16(28, entry.name.length, true);
                view.setUint32(42, entry.offset, true);
                header.set(entry.name, 46);
                return header;
            });
            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new Uint8Array(22);
            const endView = new DataView(end.buffer);
            endView.setUint32(0, 0x06054b50, true);
            endView.setUint16(8, entries.length, true);
            endView.setUint16(10, entries.length, true);
            endView.setUint32(12, centralSize, true);
            endView.setUint32(16, offset, true);
            return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = filename;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function captureNames(createdAt) {
            const emotion = situations[situationIndex].emotions.reduce((best, key) => {
                const score = Number(latestExpressions[key]) || 0;
                return score > best.score ? { key, score } : best;
            }, { key: situations[situationIndex].emotions[0], score: 0 });
            const two = (value) => String(value).padStart(2, "0");
            const archive = `called_${two(createdAt.getMonth() + 1)}${two(createdAt.getDate())}_${two(createdAt.getHours())}${two(createdAt.getMinutes())}${two(createdAt.getSeconds())}`;
            return { archive, file: `${emotion.key}_${Math.round(emotion.score * 100)}` };
        }

        async function saveCapture(triggerAt, createdAt, names, imagePromise) {
            const [image, clip] = await Promise.all([imagePromise, recordClip(triggerAt)]);
            const zip = await createZip([
                { name: `${names.file}.png`, blob: image, createdAt },
                { name: `${names.file}.webm`, blob: clip, createdAt }
            ]);
            downloadBlob(zip, `${names.archive}.zip`);
        }

        function videoFrameSize() {
            return {
                width: Math.round(video.videoHeight / 2) * 2,
                height: Math.round(video.videoWidth / 2) * 2
            };
        }

        function measureStatus() {
            const size = videoFrameSize();
            statusLabel.textContent = "実測:";
            statusText.textContent = `${size.width}x${size.height} / 計測中`;
            let startedAt;
            let frames = 0;

            const measure = (now) => {
                if (statusLabel.textContent !== "実測:") return;
                if (startedAt !== undefined) frames += 1;
                else startedAt = now;

                const elapsed = now - startedAt;
                if (elapsed >= 1000) {
                    const current = videoFrameSize();
                    statusText.textContent = `${current.width}x${current.height} / ${Math.round(frames * 1000 / elapsed)}fps`;
                    startedAt = now;
                    frames = 0;
                }
                statusFrameCallback = video.requestVideoFrameCallback(measure);
            };

            statusFrameCallback = video.requestVideoFrameCallback(measure);
        }

        function updateEmotionCanvas() {
            const scale = 224 / video.videoHeight;
            emotionCanvas.width = 224;
            emotionCanvas.height = Math.round(video.videoWidth * scale);
            emotionContext.setTransform(0, scale, scale, 0, 0, 0);
        }

        function modeConstraints(mode, nativeOnly) {
            const [width, height, frameRate] = mode;
            return {
                width: { exact: width },
                height: { exact: height },
                frameRate: { exact: frameRate },
                ...(nativeOnly && { resizeMode: { exact: "none" } })
            };
        }

        function currentMode(track) {
            const { width, height, frameRate } = track.getSettings();
            return [width, height, Math.round(frameRate)];
        }

        async function detectCameraModes(track) {
            const capabilities = track.getCapabilities?.() || {};
            const nativeOnly = capabilities.resizeMode?.includes("none");
            const initialMode = currentMode(track);
            const supported = new Map();

            for (const mode of cameraModes) {
                const [width, height, frameRate] = mode;
                if (capabilities.width && (width < capabilities.width.min || width > capabilities.width.max)) continue;
                if (capabilities.height && (height < capabilities.height.min || height > capabilities.height.max)) continue;
                if (capabilities.frameRate && (frameRate < capabilities.frameRate.min || frameRate > capabilities.frameRate.max)) continue;
                try {
                    await track.applyConstraints(modeConstraints(mode, nativeOnly));
                    const actual = track.getSettings();
                    if (actual.width === width && actual.height === height && Math.abs(actual.frameRate - frameRate) < 1) {
                        supported.set(mode.join(), mode);
                    }
                } catch { }
            }

            try {
                await track.applyConstraints(modeConstraints(initialMode, nativeOnly));
            } catch { }

            const selectedMode = currentMode(track);
            supported.set(selectedMode.join(), selectedMode);
            const modes = [...supported.values()].sort((a, b) => b[0] * b[1] - a[0] * a[1] || b[2] - a[2]);
            cameraMode.replaceChildren(...modes.map((mode) => new Option(`${mode[0]}x${mode[1]} / ${mode[2]}fps`, mode.join())));
            cameraMode.value = selectedMode.join();
            cameraMode.disabled = false;
        }

        async function startCamera() {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    }
                });
                await video.play();
                updateEmotionCanvas();
                const track = video.srcObject.getVideoTracks()[0];
                await detectCameraModes(track);
                updateEmotionCanvas();
                measureStatus();
                startRecordingBuffer();
            } catch (error) {
                cameraMode.innerHTML = "<option>画質を検出できません</option>";
                cameraMode.disabled = true;
                statusLabel.textContent = "エラー:";
                statusText.textContent = `カメラを開始できません: ${error.message}`;
            }
        }

        async function detectEmotion(detectOptions) {
            try {
                emotionContext.drawImage(video, 0, 0);
                latestExpressions = (await faceapi.detectSingleFace(emotionCanvas, detectOptions).withFaceExpressions())?.expressions || {};
            } catch {
                latestExpressions = {};
            }
            renderScore();
            setTimeout(() => detectEmotion(detectOptions), 200);
        }

        async function startEmotionDetection() {
            try {
                await loadConfig();
            } catch (error) {
                scoreText.textContent = "設定を読み込めません";
                console.error("photograph/config.json を読み込めませんでした。", error);
                return;
            }

            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                detectEmotion(new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 }));
            } catch {
                scoreText.textContent = "モデルを読み込めません";
            }
        }

        function playShutter() {
            if (!blink.hidden || captureInProgress) return;
            captureInProgress = true;
            clearInterval(rotationTimer);
            const triggerAt = performance.now();
            const createdAt = new Date();
            const names = captureNames(createdAt);
            const imagePromise = captureImage();
            void saveCapture(triggerAt, createdAt, names, imagePromise).catch((error) => {
                console.error("画像と映像を保存できませんでした。", error);
            }).finally(() => {
                captureInProgress = false;
            });
            blink.hidden = false;
            shutterAudio.currentTime = 0;
            shutterAudio.play().catch(() => { });
            const totalDuration = shutterTransitionDurationMs * 2 + shutterHoldDurationMs;
            const animation = blink.animate([
                { backgroundSize: "100% 0, 100% 0" },
                { backgroundSize: "100% 50%, 100% 50%", offset: shutterTransitionDurationMs / totalDuration },
                { backgroundSize: "100% 50%, 100% 50%", offset: (shutterTransitionDurationMs + shutterHoldDurationMs) / totalDuration },
                { backgroundSize: "100% 0, 100% 0" }
            ], { duration: totalDuration, easing: shutterEasing });
            animation.addEventListener("finish", () => {
                blink.hidden = true;
                advanceAfterShutter();
            }, { once: true });
        }

        cameraMode.addEventListener("change", async () => {
            const track = video.srcObject?.getVideoTracks()[0];
            if (!track) return;
            cameraMode.disabled = true;
            try {
                const nativeOnly = track.getCapabilities?.().resizeMode?.includes("none");
                await track.applyConstraints(modeConstraints(cameraMode.value.split(",").map(Number), nativeOnly));
                updateEmotionCanvas();
                startRecordingBuffer();
                if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
                measureStatus();
            } catch (error) {
                cameraMode.value = currentMode(track).join();
                statusLabel.textContent = "エラー:";
                statusText.textContent = `画質を変更できません: ${error.message}`;
            } finally {
                cameraMode.disabled = false;
            }
        });
        document.addEventListener("keydown", (event) => {
            if (!situations.length || event.target.matches("input, select, textarea, button")) return;
            const step = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
            if (!step) return;
            event.preventDefault();
            showSituation(situationIndex + step);
            startSituationRotation();
        });
        window.addEventListener("pagehide", () => {
            clearInterval(rotationTimer);
            stopRecordingBuffer();
            clearTimeout(scoreStepTimer);
            if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
            video.srcObject?.getTracks().forEach((track) => track.stop());
        });
        window.addEventListener("load", startEmotionDetection);
        startCamera();
    </script>
</body>

</html>
