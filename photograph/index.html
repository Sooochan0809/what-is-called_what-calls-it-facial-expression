<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photograph</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #f0f0f0;
            font-family: "Yu Gothic Medium", "Yu Gothic", sans-serif;
        }

        main {
            position: relative;
            width: min(100vw, 75vh);
            min-height: 100dvh;
            aspect-ratio: 3 / 4;
            overflow: hidden;
        }

        #video {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100dvh;
            height: min(100vw, 75vh);
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1) rotate(90deg);
            display: block;
        }

        .frameGuide,
        .countdown {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .frameGuide {
            --color: rgba(39, 194, 138, 0.88);
            --length: 12%;
            --thickness: 8px;
            width: min(80%, 800px);
            height: min(84%, 1140px);
            border-radius: 12px;
            background:
                linear-gradient(var(--color) 0 0) top left / var(--length) var(--thickness) no-repeat,
                linear-gradient(var(--color) 0 0) top left / var(--thickness) var(--length) no-repeat,
                linear-gradient(var(--color) 0 0) top right / var(--length) var(--thickness) no-repeat,
                linear-gradient(var(--color) 0 0) top right / var(--thickness) var(--length) no-repeat,
                linear-gradient(var(--color) 0 0) bottom left / var(--length) var(--thickness) no-repeat,
                linear-gradient(var(--color) 0 0) bottom left / var(--thickness) var(--length) no-repeat,
                linear-gradient(var(--color) 0 0) bottom right / var(--length) var(--thickness) no-repeat,
                linear-gradient(var(--color) 0 0) bottom right / var(--thickness) var(--length) no-repeat;
        }

        .blink {
            position: absolute;
            inset: 0;
            z-index: 4;
            background:
                linear-gradient(#000 0 0) top / 100% 0 no-repeat,
                linear-gradient(#000 0 0) bottom / 100% 0 no-repeat;
            animation: blink 600ms ease-in-out both;
            pointer-events: none;
        }

        @keyframes blink {

            45%,
            55% {
                background-size: 100% 50%;
            }
        }

        output {
            padding: 16px 20px;
            border: 0;
            border-radius: 12px;
            background: #1b2026e0;
            color: #f4f7fb;
            font: inherit;
            font-size: clamp(14px, 2vw, 20px);
            display: grid;
            gap: 8px;
        }

        #cameraMode {
            padding: 8px 10px;
            border: 0;
            border-radius: 8px;
            background: #343a40;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        .emotionPanel {
            position: absolute;
            z-index: 4;
            top: 24px;
            left: 8px;
            right: 8px;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.7);
            color: #17202a;
            opacity: 0.88;
            pointer-events: none;
        }

        .scoreText {
            grid-column: 1 / -1;
            min-width: 0;
        }

        .scoreText strong {
            display: block;
            overflow: hidden;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.4;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .scoreBar {
            grid-column: 1 / -1;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(var(--segment-count, 10), minmax(0, 1fr));
            gap: 3px;
        }

        .scoreSegment {
            display: block;
            height: 9px;
            border-radius: 999px;
            background: #e7ecf1;
            transition: background-color 120ms linear;
        }

        .scoreSegment.is-filled {
            background: var(--accent);
        }

        .recordButton {
            width: 112px;
            aspect-ratio: 1;
            border: 0;
            border-radius: 999px;
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            font: inherit;
            font-size: 18px;
            cursor: pointer;
        }

        .controlsFooter {
            position: absolute;
            inset: auto 16px 16px;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
        }

        .recordButton:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .countdown {
            z-index: 3;
            color: #fff;
            font-size: clamp(72px, 10vw, 112px);
            font-weight: 700;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
        }

        output label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 1120px) {
            .emotionPanel {
                top: 32px;
                left: 16px;
                right: 16px;
                gap: 12px;
                padding: 14px 16px;
            }

            .scoreText strong {
                font-size: 2.25rem;
            }

            .scoreSegment {
                height: 14px;
            }
        }
    </style>
</head>

<body>
    <main>
        <video id="video" autoplay muted playsinline></video>
        <div class="frameGuide" aria-hidden="true"></div>
        <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
        <div id="blink" class="blink" aria-hidden="true" hidden></div>
        <header class="emotionPanel" aria-label="感情推定">
            <div class="scoreText">
                <strong id="scoreText">読込中</strong>
            </div>
            <div id="scoreBar" class="scoreBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0"></div>
        </header>
        <footer class="controlsFooter">
            <output id="status" aria-live="polite">
                <label>設定:
                    <select id="cameraMode" aria-label="Webcam画質" disabled>
                        <option>画質検出中...</option>
                    </select>
                </label>
                <span id="statusText">カメラ起動中...</span>
            </output>
            <button id="recordButton" class="recordButton" type="button">録画</button>
        </footer>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const video = $("video");
        const statusText = $("statusText");
        const cameraMode = $("cameraMode");
        const scoreText = $("scoreText");
        const scoreBar = $("scoreBar");
        const recordButton = $("recordButton");
        const countdown = $("countdown");
        const blink = $("blink");
        const shutterAudio = new Audio("shutter.mp3");
        const emotionCanvas = document.createElement("canvas");
        const emotionContext = emotionCanvas.getContext("2d");
        const MODEL_URL = "../modules/faceAPI/models";
        const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
        const stopStream = (stream) => stream?.getTracks().forEach((track) => track.stop());
        const cameraModes = [
            [3840, 2160, 60], [3840, 2160, 30],
            [2560, 1440, 60], [2560, 1440, 30],
            [1920, 1080, 60], [1920, 1080, 30],
            [1280, 720, 90], [1280, 720, 60], [1280, 720, 30]
        ];
        let statusFrameCallback = 0;
        let situations = [];
        let situationIndex = 0;
        let rotationIntervalMs = 30000;
        let rotationTimer = 0;
        let latestExpressions = {};
        let scoreSegments = [];
        let displayedSegmentCount = 0;
        let targetSegmentCount = 0;
        let scoreStepIntervalMs = 80;
        let scoreStepTimer = 0;

        function stepScore() {
            scoreStepTimer = 0;
            if (displayedSegmentCount === targetSegmentCount) return;
            const direction = Math.sign(targetSegmentCount - displayedSegmentCount);
            displayedSegmentCount += direction;
            const segmentIndex = direction > 0 ? displayedSegmentCount - 1 : displayedSegmentCount;
            scoreSegments[segmentIndex].classList.toggle("is-filled", direction > 0);
            if (displayedSegmentCount !== targetSegmentCount) {
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
            }
        }

        function renderScore() {
            const emotions = situations[situationIndex]?.emotions || [];
            const score = Math.min(1, Math.max(0, ...emotions.map((name) => Number(latestExpressions[name]) || 0)));
            const rounded = Math.round(score * 100);
            targetSegmentCount = Math.ceil(score * scoreSegments.length);
            const accent = rounded >= 72 ? "#27c28a" : rounded >= 44 ? "#ef8b39" : "#dd4d5d";
            scoreBar.style.setProperty("--accent", accent);
            scoreBar.setAttribute("aria-valuenow", rounded);
            if (!scoreStepTimer && displayedSegmentCount !== targetSegmentCount) {
                scoreStepTimer = setTimeout(stepScore, scoreStepIntervalMs);
            }
        }

        function showSituation(index) {
            situationIndex = (index + situations.length) % situations.length;
            scoreText.textContent = situations[situationIndex].text;
            renderScore();
        }

        function startSituationRotation() {
            clearInterval(rotationTimer);
            rotationTimer = setInterval(() => showSituation(situationIndex + 1), rotationIntervalMs);
        }

        async function loadSituations() {
            const response = await fetch("config.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const config = await response.json();
            if (!Array.isArray(config.situations) || !config.situations.length || config.situations.some(
                ({ text, emotions }) => typeof text !== "string" || !Array.isArray(emotions) || !emotions.length
            )) throw new Error("状況文の設定が不正です");

            situations = config.situations;
            rotationIntervalMs = Math.max(1000, Number(config.rotationIntervalMs) || 30000);
            scoreStepIntervalMs = Math.max(1, Number(config.scoreStepIntervalMs) || 80);
            const segmentCount = Math.max(1, Math.round(Number(config.scoreSegmentCount) || 10));
            scoreBar.style.setProperty("--segment-count", segmentCount);
            scoreBar.innerHTML = Array.from({ length: segmentCount }, () => '<span class="scoreSegment"></span>').join("");
            scoreSegments = [...scoreBar.children];
            showSituation(0);
            startSituationRotation();
        }

        function downloadRecording(blob) {
            const extension = blob.type.includes("mp4") ? "mp4" : "webm";
            const now = new Date();
            const pad = (number) => String(number).padStart(2, "0");
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            const emotionNames = situations[situationIndex]?.emotions.join("-") || "recording";
            link.download = `${emotionNames}_${pad(now.getMonth() + 1)}${pad(now.getDate())}.${extension}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function getRecordingSize() {
            return {
                width: Math.round(video.videoHeight / 2) * 2,
                height: Math.round(video.videoWidth / 2) * 2
            };
        }

        function measureStatus() {
            const size = getRecordingSize();
            statusText.textContent = `実測: ${size.width}x${size.height} / 計測中`;
            let startedAt;
            let frames = 0;

            const measure = (now) => {
                if (!statusText.textContent.startsWith("実測:")) return;
                if (startedAt !== undefined) frames += 1;
                else startedAt = now;

                const elapsed = now - startedAt;
                if (elapsed >= 1000) {
                    const current = getRecordingSize();
                    statusText.textContent = `実測: ${current.width}x${current.height} / ${Math.round(frames * 1000 / elapsed)}fps`;
                    startedAt = now;
                    frames = 0;
                }
                statusFrameCallback = video.requestVideoFrameCallback(measure);
            };

            statusFrameCallback = video.requestVideoFrameCallback(measure);
        }

        function updateEmotionCanvas() {
            const scale = 224 / video.videoHeight;
            emotionCanvas.width = 224;
            emotionCanvas.height = Math.round(video.videoWidth * scale);
            emotionContext.setTransform(0, scale, scale, 0, 0, 0);
        }

        function modeConstraints(mode, nativeOnly) {
            const [width, height, frameRate] = mode;
            return {
                width: { exact: width },
                height: { exact: height },
                frameRate: { exact: frameRate },
                ...(nativeOnly && { resizeMode: { exact: "none" } })
            };
        }

        function currentMode(track) {
            const { width, height, frameRate } = track.getSettings();
            return [width, height, Math.round(frameRate)];
        }

        async function detectCameraModes(track) {
            const capabilities = track.getCapabilities?.() || {};
            const nativeOnly = capabilities.resizeMode?.includes("none");
            const initialMode = currentMode(track);
            const supported = new Map();

            for (const mode of cameraModes) {
                const [width, height, frameRate] = mode;
                if (capabilities.width && (width < capabilities.width.min || width > capabilities.width.max)) continue;
                if (capabilities.height && (height < capabilities.height.min || height > capabilities.height.max)) continue;
                if (capabilities.frameRate && (frameRate < capabilities.frameRate.min || frameRate > capabilities.frameRate.max)) continue;
                try {
                    await track.applyConstraints(modeConstraints(mode, nativeOnly));
                    const actual = track.getSettings();
                    if (actual.width === width && actual.height === height && Math.abs(actual.frameRate - frameRate) < 1) {
                        supported.set(mode.join(), mode);
                    }
                } catch { }
            }

            try {
                await track.applyConstraints(modeConstraints(initialMode, nativeOnly));
            } catch { }

            const selectedMode = currentMode(track);
            supported.set(selectedMode.join(), selectedMode);
            const modes = [...supported.values()].sort((a, b) => b[0] * b[1] - a[0] * a[1] || b[2] - a[2]);
            cameraMode.replaceChildren(...modes.map((mode) => new Option(`${mode[0]}x${mode[1]} / ${mode[2]}fps`, mode.join())));
            cameraMode.value = selectedMode.join();
            cameraMode.disabled = false;
        }

        function createRecordingStream() {
            const canvas = document.createElement("canvas");
            Object.assign(canvas, getRecordingSize());
            const context = canvas.getContext("2d", { alpha: false });
            context.setTransform(0, 1, 1, 0, 0, 0);

            if (typeof MediaStreamTrackProcessor === "function" && typeof MediaStreamTrackGenerator === "function") {
                const sourceTrack = video.srcObject.getVideoTracks()[0].clone();
                const processor = new MediaStreamTrackProcessor({ track: sourceTrack });
                const generator = new MediaStreamTrackGenerator({ kind: "video" });

                processor.readable.pipeThrough(new TransformStream({
                    transform(frame, controller) {
                        try {
                            context.drawImage(frame, 0, 0);
                            const options = { timestamp: frame.timestamp };
                            if (frame.duration !== null) options.duration = frame.duration;
                            controller.enqueue(new VideoFrame(canvas, options));
                        } finally {
                            frame.close();
                        }
                    }
                })).pipeTo(generator.writable).catch(() => { });

                return {
                    stream: new MediaStream([generator]),
                    stop: () => {
                        sourceTrack.stop();
                        generator.stop();
                    }
                };
            }

            if (typeof video.requestVideoFrameCallback !== "function") {
                throw new Error("このブラウザは実フレーム同期録画に対応していません");
            }
            const stream = canvas.captureStream();
            let frameCallback;

            const drawFrame = () => {
                context.drawImage(video, 0, 0);
                frameCallback = video.requestVideoFrameCallback(drawFrame);
            };

            frameCallback = video.requestVideoFrameCallback(drawFrame);
            return {
                stream,
                stop: () => {
                    video.cancelVideoFrameCallback(frameCallback);
                    stopStream(stream);
                }
            };
        }

        async function startCamera() {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 3840 },
                        height: { ideal: 2160 },
                        frameRate: { ideal: 60 }
                    },
                    audio: false
                });
                await video.play();
                updateEmotionCanvas();
                const track = video.srcObject.getVideoTracks()[0];
                await detectCameraModes(track);
                updateEmotionCanvas();
                measureStatus();
            } catch (error) {
                cameraMode.innerHTML = "<option>画質を検出できません</option>";
                cameraMode.disabled = true;
                statusText.textContent = `カメラを開始できません: ${error.message}`;
            }
        }

        async function detectEmotion(detectOptions) {
            try {
                emotionContext.drawImage(video, 0, 0);
                const result = await faceapi.detectSingleFace(emotionCanvas, detectOptions).withFaceExpressions();
                latestExpressions = result?.expressions || {};
            } catch {
                latestExpressions = {};
            }
            renderScore();
            setTimeout(() => detectEmotion(detectOptions), 200);
        }

        async function startEmotionDetection() {
            try {
                await loadSituations();
            } catch (error) {
                scoreText.textContent = "設定を読み込めません";
                console.error("photograph/config.json を読み込めませんでした。", error);
                return;
            }

            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
                ]);
                detectEmotion(new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 }));
            } catch {
                scoreText.textContent = "モデルを読み込めません";
            }
        }

        async function recordVideo() {
            if (!(video.srcObject instanceof MediaStream)) {
                statusText.textContent = "先にWebcamを起動してください";
                return;
            }

            recordButton.disabled = cameraMode.disabled = true;
            try {
                const chunks = [];
                const recording = createRecordingStream();
                const recorder = new MediaRecorder(recording.stream, {
                    videoBitsPerSecond: 60_000_000
                });
                recorder.addEventListener("dataavailable", (event) => {
                    if (event.data.size) chunks.push(event.data);
                });
                const stopped = new Promise((resolve) => recorder.addEventListener("stop", resolve, { once: true }));
                recorder.start();
                recordButton.textContent = "録画中";

                countdown.hidden = false;
                for (let count = 3; count >= 1; count -= 1) {
                    countdown.textContent = count;
                    await wait(1000);
                }
                countdown.hidden = true;
                await wait(2000);
                blink.hidden = false;
                shutterAudio.play().catch(() => { });
                await wait(3000);
                if (recorder.state === "recording") recorder.stop();
                await stopped;
                recording.stop();
                downloadRecording(new Blob(chunks, { type: recorder.mimeType }));
                recordButton.textContent = "録画";
            } catch (error) {
                statusText.textContent = `録画を開始できません: ${error.message}`;
            } finally {
                countdown.hidden = true;
                blink.hidden = true;
                recordButton.disabled = false;
                cameraMode.disabled = !cameraMode.value.includes(",");
            }
        }

        cameraMode.addEventListener("change", async () => {
            const track = video.srcObject?.getVideoTracks()[0];
            if (!track) return;
            cameraMode.disabled = true;
            try {
                const nativeOnly = track.getCapabilities?.().resizeMode?.includes("none");
                await track.applyConstraints(modeConstraints(cameraMode.value.split(",").map(Number), nativeOnly));
                updateEmotionCanvas();
                if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
                measureStatus();
            } catch (error) {
                cameraMode.value = currentMode(track).join();
                statusText.textContent = `画質を変更できません: ${error.message}`;
            } finally {
                cameraMode.disabled = false;
            }
        });
        recordButton.addEventListener("click", recordVideo);
        document.addEventListener("keydown", (event) => {
            if (!situations.length || event.target.matches("input, select, textarea, button")) return;
            const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
            if (!step) return;
            event.preventDefault();
            showSituation(situationIndex + step);
            startSituationRotation();
        });
        window.addEventListener("pagehide", () => {
            clearInterval(rotationTimer);
            clearTimeout(scoreStepTimer);
            if (statusFrameCallback) video.cancelVideoFrameCallback(statusFrameCallback);
            stopStream(video.srcObject);
        });
        window.addEventListener("load", startEmotionDetection);
        startCamera();
    </script>
</body>

</html>
