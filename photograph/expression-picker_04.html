<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>感情フレームランキング</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            --accent: #4f8cff;
        }

        * { box-sizing: border-box; }
        body { margin: 0; }

        main {
            width: min(1100px, 100%);
            margin: auto;
            padding: 28px 20px 48px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
        }

        p {
            margin: 0 0 20px;
            opacity: .72;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        label {
            display: grid;
            flex: 1 1 180px;
            gap: 6px;
        }

        input,
        select,
        button {
            min-height: 42px;
            padding: 9px 13px;
            border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
            border-radius: 7px;
            font: inherit;
        }

        button {
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
            opacity: .45;
        }

        output {
            display: block;
            min-height: 1.5em;
            margin: 18px 0 8px;
        }

        progress {
            width: 100%;
            height: 9px;
            accent-color: var(--accent);
        }

        progress[hidden] { display: none; }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        figure {
            margin: 0;
            overflow: hidden;
            border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
            border-radius: 9px;
            background: color-mix(in srgb, Canvas 94%, CanvasText);
        }

        figure img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #000;
        }

        figcaption {
            display: grid;
            gap: 4px;
            padding: 10px 12px;
        }

        figcaption a { color: var(--accent); }
    </style>
</head>

<body>
    <main>
        <h1>感情フレームランキング</h1>
        <p>選択した感情の推定値が高いフレームを、上位から画像で並べます。</p>
        <div class="controls">
            <label>動画
                <input id="file" type="file" accept="video/webm,video/*">
            </label>
            <label>感情カテゴリ
                <select id="emotion">
                    <option value="neutral" selected>neutral</option>
                    <option value="happy">happy</option>
                    <option value="sad">sad</option>
                    <option value="angry">angry</option>
                    <option value="fearful">fearful</option>
                    <option value="disgusted">disgusted</option>
                    <option value="surprised">surprised</option>
                </select>
            </label>
            <label>上位何位まで
                <input id="limit" type="number" min="1" max="100" step="1" value="10">
            </label>
            <button id="run" type="button" disabled>上位フレームを抽出</button>
        </div>
        <output id="status">モデルを読み込んでいます…</output>
        <progress id="progress" value="0" max="1" hidden></progress>
        <section id="results" aria-label="抽出結果"></section>
    </main>

    <script type="module">
        import { ALL_FORMATS, BlobSource, CanvasSink, Input }
            from "https://cdn.jsdelivr.net/npm/mediabunny@1.61.0/dist/bundles/mediabunny.min.mjs";

        window.addEventListener("load", async () => {
            const $ = (id) => document.getElementById(id);
            const fileInput = $("file");
            const emotionInput = $("emotion");
            const limitInput = $("limit");
            const runButton = $("run");
            const status = $("status");
            const progress = $("progress");
            const results = $("results");
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: .35 });
            const resultUrls = [];
            let modelsReady = false;
            let busy = false;

            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${(seconds % 60).toFixed(2).padStart(5, "0")}`;
            const rankFrames = (frames, limit) => frames
                .sort((a, b) => b.score - a.score || a.index - b.index)
                .slice(0, limit);
            console.assert(rankFrames([{ index: 0, score: .2 }, { index: 1, score: .8 }], 1)[0].index === 1,
                "frame ranking is invalid");

            function setBusy(value) {
                busy = value;
                fileInput.disabled = value;
                emotionInput.disabled = value;
                limitInput.disabled = value;
                runButton.disabled = value || !modelsReady || !fileInput.files.length;
            }

            function clearResults() {
                resultUrls.splice(0).forEach(URL.revokeObjectURL);
                results.replaceChildren();
            }

            const canvasToBlob = (canvas) => new Promise((resolve, reject) => {
                canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("画像を作成できませんでした")), "image/png");
            });

            function showResults(file, emotion, picks, images) {
                const baseName = file.name.replace(/\.[^.]+$/, "");
                picks.forEach((pick, index) => {
                    const url = URL.createObjectURL(images.get(pick.index));
                    resultUrls.push(url);
                    const image = new Image();
                    image.src = url;
                    image.alt = `${emotion} 第${index + 1}位`;
                    const details = document.createElement("span");
                    details.textContent = `${index + 1}位 · ${emotion} ${pick.score.toFixed(4)} · ${formatTime(pick.timestamp)}`;
                    const download = document.createElement("a");
                    download.href = url;
                    download.download = `${baseName}_${emotion}_${String(index + 1).padStart(2, "0")}_${pick.score.toFixed(4)}.png`;
                    download.textContent = "画像を保存";
                    const caption = document.createElement("figcaption");
                    caption.append(details, download);
                    const figure = document.createElement("figure");
                    figure.append(image, caption);
                    results.append(figure);
                });
            }

            async function extractImages(file, picks, totalFrames) {
                const selected = new Set(picks.map(({ index }) => index));
                const lastIndex = Math.max(...selected);
                const images = new Map();
                const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
                const track = await input.getPrimaryVideoTrack();
                if (!track || !await track.canDecode()) throw new Error("この動画をデコードできません");
                const sourceWidth = await track.getDisplayWidth();
                const sourceHeight = await track.getDisplayHeight();
                const scale = Math.min(1, 1920 / Math.max(sourceWidth, sourceHeight));
                const width = Math.round(sourceWidth * scale);
                const height = Math.round(sourceHeight * scale);
                let frameIndex = 0;
                progress.max = totalFrames;
                progress.value = 0;
                try {
                    const sink = new CanvasSink(track, { width, height, fit: "fill", poolSize: 1 });
                    for await (const frame of sink.canvases()) {
                        if (selected.has(frameIndex)) images.set(frameIndex, await canvasToBlob(frame.canvas));
                        progress.value = ++frameIndex;
                        status.textContent = `画像を抽出中: ${images.size} / ${picks.length}`;
                        if (frameIndex > lastIndex) break;
                    }
                    return images;
                } finally {
                    input.dispose();
                }
            }

            async function analyze(file, emotion, limit) {
                const frames = [];
                const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
                const duration = await input.computeDuration();
                const track = await input.getPrimaryVideoTrack();
                if (!track || !await track.canDecode()) throw new Error("この動画をデコードできません");
                progress.hidden = false;
                progress.max = duration || 1;
                try {
                    const sink = new CanvasSink(track, { width: 320, poolSize: 1 });
                    let index = 0;
                    for await (const frame of sink.canvases()) {
                        const detection = await faceapi.detectSingleFace(frame.canvas, detectorOptions).withFaceExpressions();
                        if (detection) frames.push({ index, timestamp: frame.timestamp, score: detection.expressions[emotion] || 0 });
                        index += 1;
                        progress.value = frame.timestamp;
                        status.textContent = `解析中: ${index} frames / ${formatTime(frame.timestamp)} · 顔検出 ${frames.length}`;
                    }

                    if (!index) throw new Error("解析できるフレームがありませんでした");
                    if (!frames.length) throw new Error("顔を検出できませんでした");
                    const picks = rankFrames(frames, limit);
                    status.textContent = `${index} frames 解析完了。上位 ${picks.length} 枚を抽出中…`;
                    const images = await extractImages(file, picks, index);
                    showResults(file, emotion, picks, images);
                    status.textContent = `${emotion} の推定値が高い順に ${picks.length} 枚を抽出しました。`;
                } finally {
                    input.dispose();
                    progress.hidden = true;
                }
            }

            fileInput.addEventListener("change", () => {
                clearResults();
                status.textContent = fileInput.files.length ? `${fileInput.files[0].name} を解析できます。` : "動画を選択してください。";
                setBusy(false);
            });

            runButton.addEventListener("click", async () => {
                if (busy || !fileInput.files.length) return;
                clearResults();
                setBusy(true);
                try {
                    const limit = clamp(Math.trunc(Number(limitInput.value)) || 1, 1, 100);
                    limitInput.value = limit;
                    await analyze(fileInput.files[0], emotionInput.value, limit);
                } catch (error) {
                    console.error(error);
                    status.textContent = `処理できませんでした: ${error?.message || String(error)}`;
                } finally {
                    setBusy(false);
                }
            });

            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri("../modules/faceAPI/models"),
                    faceapi.nets.faceExpressionNet.loadFromUri("../modules/faceAPI/models")
                ]);
                modelsReady = true;
                status.textContent = "動画を選択してください。";
            } catch (error) {
                console.error(error);
                status.textContent = `準備できませんでした: ${error.message}`;
            }
            setBusy(false);
        });
    </script>
</body>

</html>
