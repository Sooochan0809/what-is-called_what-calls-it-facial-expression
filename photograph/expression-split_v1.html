<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>表情フレーム解析</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            --accent: #4f8cff;
            --after: #f29b52;
            --panel: color-mix(in srgb, Canvas 92%, CanvasText);
            --border: color-mix(in srgb, CanvasText 22%, transparent);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: Canvas;
            color: CanvasText;
        }

        main {
            width: min(1100px, 100%);
            margin: auto;
            padding: 28px 20px 48px;
        }

        h1,
        p,
        figure {
            margin: 0;
        }

        h1 {
            margin-bottom: 8px;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
        }

        .lead {
            margin-bottom: 22px;
            opacity: .7;
        }

        .toolbar,
        .pairInputs,
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
        }

        input,
        button,
        a {
            min-height: 42px;
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font: inherit;
        }

        button,
        a {
            background: var(--accent);
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            cursor: default;
            opacity: .45;
        }

        .secondary {
            background: transparent;
            color: CanvasText;
        }

        output {
            display: block;
            min-height: 1.5em;
            margin: 16px 0;
        }

        .pair {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
        }

        .pairInputs .removePair {
            margin-left: auto;
        }

        .media {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr);
            gap: 14px;
            margin-top: 16px;
        }

        figcaption {
            margin-bottom: 8px;
            font-weight: 700;
        }

        video,
        img {
            display: block;
            width: 100%;
            height: min(45dvh, 480px);
            background: #000;
            object-fit: contain;
        }

        .result {
            margin-top: 16px;
        }

        .result[hidden],
        a[hidden] {
            display: none;
        }

        .summary {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .summary strong {
            padding: 10px;
            border-radius: 7px;
            background: color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .summary strong:last-child {
            background: color-mix(in srgb, var(--after) 20%, transparent);
        }

        .summary span {
            padding: 10px;
            border-radius: 7px;
            background: color-mix(in srgb, #64c28a 20%, transparent);
        }

        .timeline {
            display: block;
            width: 100%;
            height: 210px;
            border: 1px solid var(--border);
            border-radius: 7px;
        }

        .seekBar {
            width: 100%;
            min-height: 30px;
            margin-top: 8px;
            padding: 0;
        }

        .actions {
            margin-top: 22px;
        }

        #analysisCanvas {
            display: none;
        }

        @media (max-width: 680px) {

            .media,
            .summary {
                grid-template-columns: 1fr;
            }

            video,
            img {
                height: 40dvh;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>表情フレーム一括解析</h1>
        <p class="lead">基準PNGからシャッター開始を特定し、Before／暗転中／Afterの3区間に分けます。</p>
        <div class="toolbar">
            <button id="addPair" class="secondary" type="button">ペアを追加</button>
            <button id="analyzeAll" type="button" disabled>すべて解析</button>
        </div>
        <output id="status">WebMとPNGを設定してください。</output>
        <div id="pairList"></div>
        <div class="actions">
            <button id="splitAll" type="button" disabled>すべて切り分ける</button>
            <a id="downloadZip" hidden>ZIPをダウンロード</a>
        </div>
        <canvas id="analysisCanvas" width="48" height="64"></canvas>
    </main>

    <template id="pairTemplate">
        <section class="pair">
            <div class="pairInputs">
                <label>WebM映像<input class="videoFile" type="file" accept="video/webm,.webm"></label>
                <label>基準PNG画像<input class="imageFile" type="file" accept="image/png,.png"></label>
                <button class="removePair secondary" type="button">削除</button>
            </div>
            <div class="media">
                <figure>
                    <figcaption>映像</figcaption><video controls muted playsinline></video>
                </figure>
                <figure>
                    <figcaption>基準画像</figcaption><img alt="基準となる表情">
                </figure>
            </div>
            <div class="result" hidden>
                <div class="summary"><strong class="beforeLabel"></strong><span class="splitLabel"></span><strong
                        class="afterLabel"></strong></div>
                <canvas class="timeline" aria-label="フレーム類似度の推移"></canvas>
                <input class="seekBar" type="range" min="0" step="0.001" value="0" aria-label="映像の再生位置">
            </div>
        </section>
    </template>

    <script type="module">
        import { ALL_FORMATS, BlobSource, BufferTarget, Conversion, Input, Output, Quality, WebMOutputFormat } from "https://cdn.jsdelivr.net/npm/mediabunny@1.61.0/dist/bundles/mediabunny.min.mjs";
        const pairList = document.getElementById("pairList");
        const pairTemplate = document.getElementById("pairTemplate");
        const addPairButton = document.getElementById("addPair");
        const analyzeAllButton = document.getElementById("analyzeAll");
        const splitAllButton = document.getElementById("splitAll");
        const downloadZip = document.getElementById("downloadZip");
        const status = document.getElementById("status");
        const analysisCanvas = document.getElementById("analysisCanvas");
        const analysisContext = analysisCanvas.getContext("2d", { willReadFrequently: true });
        const pairs = [];
        let zipUrl;
        let busy = false;
        let shutterTransitionSeconds;
        let shutterHoldSeconds;

        const formatTime = (seconds) => `${Math.floor(seconds / 60)}:${(seconds % 60).toFixed(2).padStart(5, "0")}`;
        const shutterRange = (trigger, duration, transition, hold) => ({
            start: Math.min(duration, trigger + transition),
            end: Math.min(duration, trigger + transition + hold)
        });
        const similarity = (left, right) => {
            let difference = 0;
            for (let index = 0; index < left.length; index += 4) {
                const leftGray = left[index] * .299 + left[index + 1] * .587 + left[index + 2] * .114;
                const rightGray = right[index] * .299 + right[index + 1] * .587 + right[index + 2] * .114;
                difference += Math.abs(leftGray - rightGray);
            }
            return 1 - difference / (left.length / 4 * 255);
        };
        console.assert(similarity(Uint8ClampedArray.of(0, 0, 0, 255), Uint8ClampedArray.of(0, 0, 0, 255)) === 1, "類似度計算が不正です");
        console.assert(JSON.stringify(shutterRange(5, 10, .1, 1.5)) === '{"start":5.1,"end":6.6}', "暗転区間の計算が不正です");

        fetch("config.json").then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }).then(({ shutter }) => {
            shutterTransitionSeconds = Math.max(1, Number(shutter?.transitionDurationMs ?? 270)) / 1000;
            shutterHoldSeconds = Math.max(0, Number(shutter?.holdDurationMs ?? 60)) / 1000;
            updateControls();
        }).catch((error) => {
            status.textContent = `config.jsonを読み込めませんでした: ${error.message}`;
        });

        const pairShutterRange = (pair) => shutterRange(
            pair.splitTime,
            pair.video.duration,
            shutterTransitionSeconds,
            shutterHoldSeconds
        );

        function clearZip() {
            if (zipUrl) URL.revokeObjectURL(zipUrl);
            zipUrl = "";
            downloadZip.hidden = true;
        }

        function updateControls() {
            const ready = pairs.length && pairs.every(({ video, image }) =>
                video.readyState >= HTMLMediaElement.HAVE_METADATA && image.complete && image.naturalWidth)
                && Number.isFinite(shutterTransitionSeconds)
                && Number.isFinite(shutterHoldSeconds);
            addPairButton.disabled = busy;
            analyzeAllButton.disabled = busy || !ready;
            if (!pairs.every(({ splitTime }) => Number.isFinite(splitTime))) splitAllButton.disabled = true;
            pairs.forEach((pair) => {
                pair.videoFile.disabled = pair.imageFile.disabled = pair.removeButton.disabled = pair.seekBar.disabled = busy;
            });
        }

        function setFile(pair, type, file) {
            const element = type === "video" ? pair.video : pair.image;
            const urlKey = `${type}Url`;
            if (pair[urlKey]) URL.revokeObjectURL(pair[urlKey]);
            pair[urlKey] = URL.createObjectURL(file);
            element.src = pair[urlKey];
            pair.splitTime = NaN;
            pair.result.hidden = true;
            splitAllButton.disabled = true;
            clearZip();
            updateControls();
        }

        function addPair() {
            const element = pairTemplate.content.firstElementChild.cloneNode(true);
            const pair = {
                element,
                videoFile: element.querySelector(".videoFile"),
                imageFile: element.querySelector(".imageFile"),
                video: element.querySelector("video"),
                image: element.querySelector("img"),
                result: element.querySelector(".result"),
                beforeLabel: element.querySelector(".beforeLabel"),
                splitLabel: element.querySelector(".splitLabel"),
                afterLabel: element.querySelector(".afterLabel"),
                timeline: element.querySelector(".timeline"),
                seekBar: element.querySelector(".seekBar"),
                removeButton: element.querySelector(".removePair"),
                samples: [],
                splitTime: NaN
            };
            pair.videoFile.addEventListener("change", () => pair.videoFile.files[0] && setFile(pair, "video", pair.videoFile.files[0]));
            pair.imageFile.addEventListener("change", () => pair.imageFile.files[0] && setFile(pair, "image", pair.imageFile.files[0]));
            pair.video.addEventListener("loadedmetadata", () => {
                pair.seekBar.max = pair.video.duration;
                updateControls();
            });
            pair.video.addEventListener("timeupdate", () => pair.seekBar.value = pair.video.currentTime);
            pair.image.addEventListener("load", updateControls);
            pair.seekBar.addEventListener("input", () => {
                pair.video.pause();
                pair.video.currentTime = Number(pair.seekBar.value);
            });
            pair.removeButton.addEventListener("click", () => {
                if (pair.videoUrl) URL.revokeObjectURL(pair.videoUrl);
                if (pair.imageUrl) URL.revokeObjectURL(pair.imageUrl);
                pairs.splice(pairs.indexOf(pair), 1);
                element.remove();
                if (!pairs.length) addPair();
                splitAllButton.disabled = true;
                clearZip();
                updateControls();
            });
            pairs.push(pair);
            pairList.append(element);
            updateControls();
        }

        function framePixels(source) {
            analysisContext.setTransform(1, 0, 0, 1, 0, 0);
            analysisContext.drawImage(source, 0, 0, analysisCanvas.width, analysisCanvas.height);
            return analysisContext.getImageData(0, 0, analysisCanvas.width, analysisCanvas.height).data;
        }

        function seek(video, time) {
            video.pause();
            if (Math.abs(video.currentTime - time) < .001) return Promise.resolve();
            return new Promise((resolve) => {
                video.addEventListener("seeked", resolve, { once: true });
                video.currentTime = time;
            });
        }

        function drawTimeline(pair) {
            const context = pair.timeline.getContext("2d");
            const ratio = devicePixelRatio || 1;
            const width = pair.timeline.clientWidth;
            const height = pair.timeline.clientHeight;
            pair.timeline.width = Math.round(width * ratio);
            pair.timeline.height = Math.round(height * ratio);
            context.setTransform(ratio, 0, 0, ratio, 0, 0);
            context.clearRect(0, 0, width, height);
            const shutter = pairShutterRange(pair);
            const centerStartX = shutter.start / pair.video.duration * width;
            const centerEndX = shutter.end / pair.video.duration * width;
            const markerX = pair.splitTime / pair.video.duration * width;
            context.fillStyle = "rgba(79,140,255,.16)";
            context.fillRect(0, 0, centerStartX, height);
            context.fillStyle = "rgba(100,194,138,.2)";
            context.fillRect(centerStartX, 0, centerEndX - centerStartX, height);
            context.fillStyle = "rgba(242,155,82,.18)";
            context.fillRect(centerEndX, 0, width - centerEndX, height);
            const minimum = Math.min(...pair.samples.map(({ score }) => score));
            const maximum = Math.max(...pair.samples.map(({ score }) => score));
            const range = maximum - minimum || 1;
            context.beginPath();
            pair.samples.forEach(({ time, score }, index) => {
                const x = time / pair.video.duration * width;
                const y = height - 18 - (score - minimum) / range * (height - 36);
                index ? context.lineTo(x, y) : context.moveTo(x, y);
            });
            context.strokeStyle = "#4f8cff";
            context.lineWidth = 2;
            context.stroke();
            context.beginPath();
            context.moveTo(markerX, 0);
            context.lineTo(markerX, height);
            context.strokeStyle = "#fff";
            context.stroke();
        }

        function renderPairResult(pair) {
            const shutter = pairShutterRange(pair);
            pair.beforeLabel.textContent = `Before  0:00.00〜${formatTime(shutter.start)}`;
            pair.afterLabel.textContent = `After  ${formatTime(shutter.end)}〜${formatTime(pair.video.duration)}`;
            pair.splitLabel.textContent = `シャッター暗転  ${formatTime(shutter.start)}〜${formatTime(shutter.end)}\n基準画像  ${formatTime(pair.splitTime)} / ${(pair.closestScore * 100).toFixed(2)}%`;
            pair.splitLabel.style.whiteSpace = "pre-line";
            drawTimeline(pair);
        }

        async function analyzePair(pair, index) {
            pair.samples = [];
            const referencePixels = framePixels(pair.image);
            await seek(pair.video, 0);
            pair.video.playbackRate = .5;
            let previousPresentedFrame;
            let skippedFrames = 0;
            await new Promise((resolve, reject) => {
                let done = false;
                const finish = () => { done = true; resolve(); };
                const inspect = (_now, metadata) => {
                    if (done) return;
                    if (previousPresentedFrame !== undefined) skippedFrames += Math.max(0, metadata.presentedFrames - previousPresentedFrame - 1);
                    previousPresentedFrame = metadata.presentedFrames;
                    pair.samples.push({ time: metadata.mediaTime, score: similarity(referencePixels, framePixels(pair.video)) });
                    status.textContent = `ペア ${index + 1}/${pairs.length} を解析中… ${Math.round(metadata.mediaTime / pair.video.duration * 100)}%`;
                    if (pair.video.ended) finish();
                    else pair.video.requestVideoFrameCallback(inspect);
                };
                pair.video.addEventListener("ended", finish, { once: true });
                pair.video.requestVideoFrameCallback(inspect);
                pair.video.play().catch(reject);
            });
            pair.video.playbackRate = 1;
            const closest = pair.samples.reduce((best, sample) => sample.score > best.score ? sample : best);
            pair.splitTime = closest.time;
            pair.closestScore = closest.score;
            pair.result.hidden = false;
            renderPairResult(pair);
            await seek(pair.video, pair.splitTime);
            return skippedFrames;
        }

        analyzeAllButton.addEventListener("click", async () => {
            if (busy) return;
            busy = true;
            updateControls();
            splitAllButton.disabled = true;
            clearZip();
            let skipped = 0;
            try {
                for (let index = 0; index < pairs.length; index += 1) skipped += await analyzePair(pairs[index], index);
                status.textContent = `${pairs.length}ペアの解析が完了しました${skipped ? `（未取得 ${skipped}フレーム）` : ""}。`;
                splitAllButton.disabled = false;
            } catch (error) {
                status.textContent = `解析できませんでした: ${error.message}`;
            } finally {
                busy = false;
                updateControls();
            }
        });

        async function cutSegment(pair, start, end) {
            const target = new BufferTarget();
            const output = new Output({ format: new WebMOutputFormat(), target });
            const conversion = await Conversion.init({
                input: new Input({ source: new BlobSource(pair.videoFile.files[0]), formats: ALL_FORMATS }),
                output,
                trim: { start, end },
                video: {
                    quality: new Quality("very-high"),
                    keyFrameInterval: 1
                }
            });
            if (!conversion.isValid) throw new Error("このWebMを変換できません");
            await conversion.execute();
            return new Blob([target.buffer], { type: "video/webm" });
        }

        const crc32Table = Uint32Array.from({ length: 256 }, (_, index) => {
            let value = index;
            for (let bit = 0; bit < 8; bit += 1) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            return value >>> 0;
        });
        async function blobCrc32(blob) {
            let crc = 0xffffffff;
            for await (const bytes of blob.stream()) for (const byte of bytes) crc = crc32Table[(crc ^ byte) & 0xff] ^ (crc >>> 8);
            return (crc ^ 0xffffffff) >>> 0;
        }
        function zipStamp(date) {
            return {
                date: ((Math.max(1980, date.getFullYear()) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
                time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2)
            };
        }
        async function createZip(files) {
            const encoder = new TextEncoder();
            const localParts = [];
            const entries = [];
            let offset = 0;
            for (const file of files) {
                const name = encoder.encode(file.name);
                const crc = await blobCrc32(file.blob);
                const stamp = zipStamp(file.createdAt);
                const header = new Uint8Array(30 + name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x04034b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 0x0800, true);
                view.setUint16(10, stamp.time, true);
                view.setUint16(12, stamp.date, true);
                view.setUint32(14, crc, true);
                view.setUint32(18, file.blob.size, true);
                view.setUint32(22, file.blob.size, true);
                view.setUint16(26, name.length, true);
                header.set(name, 30);
                localParts.push(header, file.blob);
                entries.push({ name, crc, stamp, size: file.blob.size, offset });
                offset += header.length + file.blob.size;
            }
            const centralParts = entries.map((entry) => {
                const header = new Uint8Array(46 + entry.name.length);
                const view = new DataView(header.buffer);
                view.setUint32(0, 0x02014b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 20, true);
                view.setUint16(8, 0x0800, true);
                view.setUint16(12, entry.stamp.time, true);
                view.setUint16(14, entry.stamp.date, true);
                view.setUint32(16, entry.crc, true);
                view.setUint32(20, entry.size, true);
                view.setUint32(24, entry.size, true);
                view.setUint16(28, entry.name.length, true);
                view.setUint32(42, entry.offset, true);
                header.set(entry.name, 46);
                return header;
            });
            const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
            const end = new Uint8Array(22);
            const view = new DataView(end.buffer);
            view.setUint32(0, 0x06054b50, true);
            view.setUint16(8, entries.length, true);
            view.setUint16(10, entries.length, true);
            view.setUint32(12, centralSize, true);
            view.setUint32(16, offset, true);
            return new Blob([...localParts, ...centralParts, end], { type: "application/zip" });
        }

        splitAllButton.addEventListener("click", async () => {
            if (busy) return;
            busy = true;
            analyzeAllButton.disabled = splitAllButton.disabled = true;
            clearZip();
            const files = [];
            const createdAt = new Date();
            try {
                for (let index = 0; index < pairs.length; index += 1) {
                    const pair = pairs[index];
                    const base = pair.videoFile.files[0].name.replace(/\.webm$/i, "");
                    const shutter = pairShutterRange(pair);
                    status.textContent = `ペア ${index + 1}/${pairs.length} のBeforeを切り分けています…`;
                    const prefix = String(index + 1).padStart(2, "0");
                    if (shutter.start > .02) files.push({ name: `${prefix}_${base}_before.webm`, blob: await cutSegment(pair, 0, shutter.start), createdAt });
                    status.textContent = `ペア ${index + 1}/${pairs.length} のシャッター暗転中を切り分けています…`;
                    if (shutter.end - shutter.start > .02) files.push({ name: `${prefix}_${base}_shutter.webm`, blob: await cutSegment(pair, shutter.start, shutter.end), createdAt });
                    status.textContent = `ペア ${index + 1}/${pairs.length} のAfterを切り分けています…`;
                    if (pair.video.duration - shutter.end > .02) files.push({ name: `${prefix}_${base}_after.webm`, blob: await cutSegment(pair, shutter.end, pair.video.duration), createdAt });
                }
                if (!files.length) throw new Error("切り分け可能な区間がありません");
                status.textContent = "ZIPを作成しています…";
                zipUrl = URL.createObjectURL(await createZip(files));
                const two = (value) => String(value).padStart(2, "0");
                downloadZip.href = zipUrl;
                downloadZip.download = `expression_split_${createdAt.getFullYear()}${two(createdAt.getMonth() + 1)}${two(createdAt.getDate())}_${two(createdAt.getHours())}${two(createdAt.getMinutes())}${two(createdAt.getSeconds())}.zip`;
                downloadZip.hidden = false;
                status.textContent = `${files.length}本の映像に切り分けました。`;
            } catch (error) {
                status.textContent = `切り分けできませんでした: ${error.message}`;
            } finally {
                busy = false;
                updateControls();
                splitAllButton.disabled = !pairs.every(({ splitTime }) => Number.isFinite(splitTime));
            }
        });

        addPairButton.addEventListener("click", addPair);
        window.addEventListener("resize", () => pairs.forEach((pair) => !pair.result.hidden && drawTimeline(pair)));
        window.addEventListener("pagehide", () => {
            clearZip();
            pairs.forEach((pair) => {
                if (pair.videoUrl) URL.revokeObjectURL(pair.videoUrl);
                if (pair.imageUrl) URL.revokeObjectURL(pair.imageUrl);
            });
        });
        addPair();
    </script>
</body>

</html>
