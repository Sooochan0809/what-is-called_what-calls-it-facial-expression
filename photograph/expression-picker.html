<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Picker</title>
    <script defer src="../modules/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
            --accent: #4f8cff;
            --panel: color-mix(in srgb, Canvas 92%, CanvasText);
            --border: color-mix(in srgb, CanvasText 22%, transparent);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: Canvas;
            color: CanvasText;
        }

        main {
            width: min(1100px, 100%);
            margin: auto;
            padding: 28px 20px 48px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
        }

        .lead {
            margin: 0 0 22px;
            opacity: .7;
        }

        .toolbar,
        .controls,
        .status {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
        }

        .panel {
            display: grid;
            gap: 16px;
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
        }

        .controls label:first-child {
            flex: 1 1 300px;
        }

        .controls .removePanel {
            margin-left: auto;
        }

        label {
            display: grid;
            gap: 6px;
        }

        input,
        select,
        button {
            min-height: 42px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font: inherit;
        }

        input,
        select {
            width: 100%;
            padding: 9px 13px;
        }

        button {
            padding: 9px 13px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            color: CanvasText;
        }

        button:disabled {
            cursor: default;
            opacity: .45;
        }

        output {
            display: block;
            min-height: 1.5em;
            margin: 16px 0;
        }

        .status {
            min-height: 22px;
            font-variant-numeric: tabular-nums;
        }

        .analysisVideo {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        progress {
            width: 160px;
            height: 8px;
            accent-color: var(--accent);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .results:empty {
            display: none;
        }

        .card {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--panel);
        }

        .rank {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            border-radius: 7px;
            background: var(--accent);
            color: white;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            background: Canvas;
        }

        .meta {
            display: grid;
            gap: 5px;
            padding: 10px;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .meta strong {
            color: CanvasText;
            font-size: 16px;
        }

        .meta button {
            margin-top: 4px;
            min-height: 32px;
        }

        .empty {
            padding: 18px;
            border: 1px dashed var(--border);
            border-radius: 10px;
            background: var(--panel);
            text-align: center;
        }

        @media (max-width: 680px) {
            .controls label,
            .controls button {
                width: 100%;
            }

            .controls .removePanel {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Expression Picker</h1>
        <p class="lead">複数の動画から、指定した表情が安定しているフレームを一括抽出します。</p>
        <div class="toolbar">
            <button id="addPanel" class="secondary" type="button">追加</button>
            <button id="analyzeAll" type="button" disabled>すべて解析</button>
        </div>
        <output id="status">モデルを読み込んでいます。</output>
        <div id="panelList"></div>
        <video id="analysisVideo" class="analysisVideo" muted playsinline aria-hidden="true"></video>
    </main>

    <template id="panelTemplate">
        <section class="panel">
            <div class="controls">
                <label>
                    video
                    <input class="file" type="file" accept="video/webm,video/*">
                </label>
                <label>
                    emotion
                    <select class="emotion">
                        <option value="neutral">neutral</option>
                        <option value="happy">happy</option>
                        <option value="sad">sad</option>
                        <option value="angry">angry</option>
                        <option value="fearful">fearful</option>
                        <option value="disgusted">disgusted</option>
                        <option value="surprised">surprised</option>
                    </select>
                </label>
                <label>
                    images
                    <input class="count" type="number" min="1" max="24" step="1" value="5">
                </label>
                <label>
                    min score
                    <input class="minScore" type="number" min="0" max="1" step="0.01" value="0.7">
                </label>
                <button class="removePanel secondary" type="button">削除</button>
            </div>
            <div class="status">
                <span class="message">動画を選択してください。</span>
                <progress value="0" max="1" hidden></progress>
                <button class="downloadAll" type="button" disabled>download all</button>
            </div>
            <div class="results"></div>
            <div class="empty">解析結果はここに表示されます。</div>
        </section>
    </template>

    <script>
        window.addEventListener("load", async () => {
            const $ = (id) => document.getElementById(id);
            const MODEL_URL = "../modules/faceAPI/models";
            const EMOTIONS = ["neutral", "happy", "sad", "angry", "fearful", "disgusted", "surprised"];
            const [video, panelList, panelTemplate, addPanelButton, analyzeAllButton, status] =
                ["analysisVideo", "panelList", "panelTemplate", "addPanel", "analyzeAll", "status"].map($);
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.35 });
            const frameCanvas = document.createElement("canvas");
            const frameCtx = frameCanvas.getContext("2d");
            const supportsVideoFrameCallback = typeof video.requestVideoFrameCallback === "function";

            const panels = [];
            let busy = false;
            let modelsReady = false;
            let cancelFrameWait;

            const models = Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
            ]);

            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const mean = (values) => values.reduce((sum, value) => sum + value, 0) / Math.max(1, values.length);
            const variance = (values) => {
                const avg = mean(values);
                return mean(values.map((value) => (value - avg) ** 2));
            };
            const formatTime = (seconds) => {
                const min = Math.floor(seconds / 60);
                const sec = (seconds - min * 60).toFixed(1).padStart(4, "0");
                return `${min}:${sec}`;
            };

            const setPanelStatus = (panel, text, current = 0, total = 0) => {
                panel.message.textContent = text;
                panel.progress.hidden = !total;
                panel.progress.max = Math.max(1, total);
                panel.progress.value = current;
            };

            const seek = (time) => new Promise((resolve) => {
                const duration = Number.isFinite(video.duration) ? video.duration : 0;
                const target = clamp(time, 0, Math.max(0, duration - 0.04));
                if (Math.abs(video.currentTime - target) < 0.002 && video.readyState >= 2) {
                    requestAnimationFrame(resolve);
                    return;
                }
                video.addEventListener("seeked", () => requestAnimationFrame(resolve), { once: true });
                video.currentTime = target;
            });

            const nextVideoFrame = () => new Promise((resolve, reject) => {
                const finish = (metadata, error) => {
                    video.cancelVideoFrameCallback(callbackId);
                    cancelFrameWait = null;
                    error ? reject(error) : resolve(metadata);
                };
                cancelFrameWait = () => finish(null);
                const callbackId = video.requestVideoFrameCallback((_now, metadata) => {
                    video.pause();
                    finish(metadata);
                });
                video.play().catch((error) => finish(null, error));
            });
            video.addEventListener("ended", () => cancelFrameWait?.());

            const loadVideo = (file) => {
                const url = URL.createObjectURL(file);
                return new Promise((resolve, reject) => {
                    const cleanup = () => {
                        video.removeEventListener("loadedmetadata", loaded);
                        video.removeEventListener("error", failed);
                    };
                    const loaded = () => {
                        cleanup();
                        resolve(url);
                    };
                    const failed = () => {
                        cleanup();
                        video.removeAttribute("src");
                        video.load();
                        URL.revokeObjectURL(url);
                        reject(new Error(`${file.name}を読み込めませんでした`));
                    };
                    video.addEventListener("loadedmetadata", loaded);
                    video.addEventListener("error", failed);
                    video.src = url;
                    video.load();
                });
            };

            const unloadVideo = (url) => {
                video.pause();
                cancelFrameWait?.();
                video.removeAttribute("src");
                video.load();
                URL.revokeObjectURL(url);
            };

            const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const centerOf = (points) => ({
                x: mean(points.map((point) => point.x)),
                y: mean(points.map((point) => point.y))
            });

            const qualityFrom = (detection) => {
                const box = detection.detection.box;
                const positions = detection.landmarks.positions;
                const leftEye = centerOf(positions.slice(36, 42));
                const rightEye = centerOf(positions.slice(42, 48));
                const nose = positions[30];
                const mouth = centerOf(positions.slice(48, 68));
                const eyeDistance = Math.max(1, distance(leftEye, rightEye));
                const faceCenterX = box.x + box.width / 2;
                const faceCenterY = box.y + box.height / 2;
                const videoArea = Math.max(1, video.videoWidth * video.videoHeight);
                const faceArea = box.width * box.height / videoArea;
                const sizeScore = clamp((faceArea - 0.035) / 0.18, 0, 1);
                const centerOffset = Math.hypot(
                    (faceCenterX - video.videoWidth / 2) / video.videoWidth,
                    (faceCenterY - video.videoHeight / 2) / video.videoHeight
                );
                const centerScore = clamp(1 - centerOffset * 2.4, 0, 1);
                const yawScore = clamp(1 - Math.abs(distance(nose, leftEye) - distance(nose, rightEye)) / eyeDistance * 1.8, 0, 1);
                const rollScore = clamp(1 - Math.abs(leftEye.y - rightEye.y) / eyeDistance * 2.2, 0, 1);
                const pitchScore = clamp(1 - Math.abs((mouth.y - nose.y) / eyeDistance - 0.55), 0, 1);
                const frontalScore = (yawScore + rollScore + pitchScore) / 3;
                const detectionScore = clamp(detection.detection.score, 0, 1);
                const quality = detectionScore * 0.22 + sizeScore * 0.22 + centerScore * 0.18 + frontalScore * 0.38;

                return { quality, frontalScore, detectionScore };
            };

            const captureFrame = async (time) => {
                await seek(time);
                frameCanvas.width = video.videoWidth;
                frameCanvas.height = video.videoHeight;
                frameCtx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
                return frameCanvas.toDataURL("image/png");
            };

            const pickFrames = async (panel, frames) => {
                const selectedEmotion = panel.resultEmotion;
                const targetCount = clamp(Math.round(Number(panel.count.value) || 8), 1, 24);
                const minEmotionScore = clamp(Number(panel.minScore.value) || 0, 0, 1);
                const candidates = frames
                    .map((frame, index) => {
                        const from = Math.max(0, index - 2);
                        const to = Math.min(frames.length, index + 3);
                        const neighbors = frames.slice(from, to);
                        const values = neighbors.map((item) => item.expressions[selectedEmotion] || 0);
                        const expressionScore = frame.expressions[selectedEmotion] || 0;
                        const stabilityScore = clamp(1 - Math.sqrt(variance(values)) * 4, 0, 1);
                        const totalScore = expressionScore * 0.48 + stabilityScore * 0.24 + frame.quality.quality * 0.28;
                        return { ...frame, expressionScore, stabilityScore, totalScore };
                    })
                    .filter((frame) => frame.expressionScore >= minEmotionScore)
                    .sort((a, b) => b.totalScore - a.totalScore);

                const minGap = 0.8;
                const selected = [];
                for (const frame of candidates) {
                    if (selected.length >= targetCount) break;
                    if (selected.every((item) => Math.abs(item.time - frame.time) >= minGap)) selected.push(frame);
                }
                for (const frame of candidates) {
                    if (selected.length >= targetCount) break;
                    if (!selected.includes(frame)) selected.push(frame);
                }

                const captured = [];
                for (let i = 0; i < selected.length; i++) {
                    setPanelStatus(panel, `画像を書き出しています ${i + 1}/${selected.length}`, i + 1, selected.length);
                    captured.push({
                        ...selected[i],
                        imageUrl: await captureFrame(selected[i].time)
                    });
                }
                return captured;
            };

            const downloadDataUrl = (url, name) => {
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = name;
                anchor.click();
            };

            const filenameFor = (panel, pick, index) => {
                const videoName = panel.file.files[0].name.replace(/\.[^.]+$/, "");
                return `${videoName}_${panel.resultEmotion}_${String(index + 1).padStart(2, "0")}_${pick.time.toFixed(1)}s.png`;
            };

            const renderResults = (panel) => {
                panel.results.innerHTML = "";
                panel.empty.hidden = panel.picks.length > 0;
                panel.picks.forEach((pick, index) => {
                    const card = document.createElement("article");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="rank">${index + 1}位</div>
                        <img src="${pick.imageUrl}" alt="${panel.resultEmotion} frame ${index + 1}">
                        <div class="meta">
                            <strong>total ${pick.totalScore.toFixed(3)} / ${formatTime(pick.time)}</strong>
                            <span>${panel.resultEmotion} ${pick.expressionScore.toFixed(3)} · stable ${pick.stabilityScore.toFixed(3)}</span>
                            <span>front ${pick.quality.frontalScore.toFixed(3)} · detect ${pick.quality.detectionScore.toFixed(3)}</span>
                            <button type="button">download</button>
                        </div>
                    `;
                    card.querySelector("button").addEventListener("click", () =>
                        downloadDataUrl(pick.imageUrl, filenameFor(panel, pick, index)));
                    panel.results.appendChild(card);
                });
            };

            const clearPanel = (panel, text = "解析結果はここに表示されます。") => {
                panel.picks = [];
                panel.results.innerHTML = "";
                panel.empty.hidden = false;
                panel.empty.textContent = text;
            };

            const updateControls = () => {
                addPanelButton.disabled = busy;
                analyzeAllButton.disabled = busy || !modelsReady || !supportsVideoFrameCallback
                    || panels.some((panel) => !panel.file.files[0]);
                panels.forEach((panel) => {
                    [panel.file, panel.emotion, panel.count, panel.minScore, panel.remove].forEach((control) => control.disabled = busy);
                    panel.download.disabled = busy || !panel.picks.length;
                });
            };

            const downloadPanel = (panel) => {
                panel.download.disabled = true;
                panel.picks.forEach((pick, index) => {
                    setTimeout(() => downloadDataUrl(pick.imageUrl, filenameFor(panel, pick, index)), index * 180);
                });
                setTimeout(updateControls, Math.max(300, panel.picks.length * 180));
            };

            const addPanel = () => {
                const element = panelTemplate.content.firstElementChild.cloneNode(true);
                const panel = {
                    element,
                    file: element.querySelector(".file"),
                    emotion: element.querySelector(".emotion"),
                    count: element.querySelector(".count"),
                    minScore: element.querySelector(".minScore"),
                    remove: element.querySelector(".removePanel"),
                    message: element.querySelector(".message"),
                    progress: element.querySelector("progress"),
                    download: element.querySelector(".downloadAll"),
                    results: element.querySelector(".results"),
                    empty: element.querySelector(".empty"),
                    picks: []
                };
                panel.file.addEventListener("change", () => {
                    clearPanel(panel);
                    setPanelStatus(panel, panel.file.files[0]?.name || "動画を選択してください。");
                    updateControls();
                });
                panel.remove.addEventListener("click", () => {
                    panels.splice(panels.indexOf(panel), 1);
                    element.remove();
                    if (!panels.length) addPanel();
                    updateControls();
                });
                panel.download.addEventListener("click", () => downloadPanel(panel));
                panels.push(panel);
                panelList.append(element);
                updateControls();
            };

            const analyzePanel = async (panel, panelIndex) => {
                clearPanel(panel, "解析中です。");
                panel.resultEmotion = panel.emotion.value;
                const frames = [];
                let analyzedFrames = 0;
                const url = await loadVideo(panel.file.files[0]);

                try {
                    await seek(0);
                    while (true) {
                        const metadata = await nextVideoFrame();
                        if (!metadata) break;
                        const time = metadata.mediaTime;
                        analyzedFrames += 1;
                        status.textContent = `パネル ${panelIndex + 1}/${panels.length} を解析中… ${formatTime(time)}`;
                        setPanelStatus(panel, `解析中 ${analyzedFrames} frames / ${formatTime(time)}`, time, video.duration);
                        const detection = await faceapi
                            .detectSingleFace(video, detectorOptions)
                            .withFaceLandmarks(true)
                            .withFaceExpressions();
                        if (detection) {
                            frames.push({
                                time,
                                expressions: Object.fromEntries(EMOTIONS.map((key) => [key, detection.expressions[key] || 0])),
                                quality: qualityFrom(detection)
                            });
                        }
                        if (video.ended) break;
                    }

                    panel.picks = await pickFrames(panel, frames);
                    renderResults(panel);
                    panel.empty.textContent = panel.picks.length
                        ? ""
                        : "条件に合うフレームがありませんでした。min scoreを下げるか、別の表情を選んでください。";
                    setPanelStatus(panel, `${analyzedFrames} frames analyzed / ${panel.picks.length} images`);
                } finally {
                    unloadVideo(url);
                }
            };

            addPanelButton.addEventListener("click", addPanel);
            analyzeAllButton.addEventListener("click", async () => {
                if (busy) return;
                busy = true;
                updateControls();
                try {
                    for (let index = 0; index < panels.length; index++) {
                        try {
                            await analyzePanel(panels[index], index);
                        } catch (error) {
                            setPanelStatus(panels[index], `解析できませんでした: ${error.message}`);
                            throw error;
                        }
                    }
                    status.textContent = `${panels.length}パネルの解析が完了しました。`;
                } catch (error) {
                    console.error(error);
                    status.textContent = `解析できませんでした: ${error.message}`;
                } finally {
                    busy = false;
                    updateControls();
                }
            });

            addPanel();

            try {
                await models;
                modelsReady = true;
                status.textContent = supportsVideoFrameCallback
                    ? "すべてのパネルに動画を設定してください。"
                    : "このブラウザはフレーム単位の解析に対応していません。";
            } catch (error) {
                console.error(error);
                status.textContent = "モデルの読み込みに失敗しました。";
            }
            updateControls();
        });
    </script>
</body>

</html>
