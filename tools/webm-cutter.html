<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>トリミング（webm）</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: grid;
            background: #111;
            color: #eee;
        }

        main {
            width: min(1100px, 100%);
            margin: auto;
            padding: 28px 20px 48px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
        }

        #status {
            color: #aaa;
        }

        .drop {
            margin: 32px 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            gap: 10px;
            border: 2px dashed #555;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
        }

        .drop:hover,
        .drop.drag {
            border-color: #8b7dff;
            background: #1b1830;
        }

        input[type=file] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        button,
        .download {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            background: #7967ff;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            opacity: .45;
            cursor: wait;
        }

        #editor[hidden] {
            display: none;
        }

        video {
            width: 100%;
            max-height: 420px;
            border-radius: 12px;
            background: #000;
        }

        .timeline {
            margin: 24px 0;
        }

        .ranges {
            height: 34px;
            position: relative;
        }

        input[type=range] {
            position: absolute;
            inset: 0;
            width: 100%;
            accent-color: #8b7dff;
            pointer-events: none;
        }

        input[type=range]::-webkit-slider-thumb {
            pointer-events: auto;
        }

        input[type=range]::-moz-range-thumb {
            pointer-events: auto;
        }

        .times,
        .actions {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .times label {
            flex: 1;
            color: #bbb;
            font-size: 14px;
        }

        input[type=number] {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1d1d1d;
            color: white;
            font: inherit;
        }

        .actions {
            margin-top: 20px;
            flex-wrap: wrap;
        }

        progress {
            width: 100%;
            margin-top: 16px;
            accent-color: #7967ff;
        }

        .note {
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 520px) {
            .times {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>トリミング（webm）</h1>
        <label class="drop" id="drop">
            <strong>WebMファイルを選択</strong>
            <span>または、ここにドラッグ＆ドロップ</span>
            <input id="file" type="file" accept="video/webm,.webm">
        </label>

        <section id="editor" hidden>
            <video id="video" controls playsinline></video>
            <div class="timeline">
                <div class="ranges">
                    <input id="startRange" type="range" min="0" step="0.01" value="0" aria-label="開始位置">
                    <input id="endRange" type="range" min="0" step="0.01" value="0" aria-label="終了位置">
                </div>
                <div class="times">
                    <label>開始（秒）<input id="start" type="number" min="0" step="0.01" value="0"></label>
                    <button id="setStart" type="button">現在位置</button>
                    <label>終了（秒）<input id="end" type="number" min="0" step="0.01" value="0"></label>
                    <button id="setEnd" type="button">現在位置</button>
                </div>
                <div class="actions">
                    <button id="cut" type="button">無劣化で切り出す</button>
                    <a id="download" class="download" hidden>ダウンロード</a>
                    <span id="status" role="status" aria-live="polite"></span>
                </div>
                <progress id="progress" max="1" value="0" hidden></progress>
                <p class="note">映像・音声を再エンコードせずコピーします。切り始めは最寄りのキーフレームに揃うため、指定時刻と少しずれる場合があります。</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const [fileInput, drop, editor, video, startRange, endRange, start, end, cut, status, progress, download] =
            ['file', 'drop', 'editor', 'video', 'startRange', 'endRange', 'start', 'end', 'cut', 'status', 'progress', 'download'].map($);
        let file, sourceUrl, outputUrl, ffmpeg;

        const toBlobURL = async (url, type) => URL.createObjectURL(new Blob([await (await fetch(url)).blob()], { type }));

        const clampTimes = changed => {
            const duration = video.duration || 0;
            let from = Math.max(0, Math.min(Number(start.value) || 0, duration));
            let to = Math.max(0, Math.min(Number(end.value) || 0, duration));
            if (changed === 'start' && from >= to) from = Math.max(0, to - .01);
            if (changed === 'end' && to <= from) to = Math.min(duration, from + .01);
            start.value = startRange.value = from.toFixed(2);
            end.value = endRange.value = to.toFixed(2);
            download.hidden = true;
        };

        const openFile = selected => {
            if (!selected || !(selected.type === 'video/webm' || selected.name.toLowerCase().endsWith('.webm'))) {
                status.textContent = 'WebMファイルを選択してください。';
                return;
            }
            file = selected;
            if (sourceUrl) URL.revokeObjectURL(sourceUrl);
            if (outputUrl) URL.revokeObjectURL(outputUrl);
            sourceUrl = URL.createObjectURL(file);
            video.src = sourceUrl;
            editor.hidden = false;
            download.hidden = true;
            status.textContent = file.name;
        };

        fileInput.addEventListener('change', () => openFile(fileInput.files[0]));
        for (const event of ['dragenter', 'dragover']) drop.addEventListener(event, e => { e.preventDefault(); drop.classList.add('drag'); });
        for (const event of ['dragleave', 'drop']) drop.addEventListener(event, e => { e.preventDefault(); drop.classList.remove('drag'); });
        drop.addEventListener('drop', e => openFile(e.dataTransfer.files[0]));

        video.addEventListener('loadedmetadata', () => {
            const duration = video.duration;
            for (const input of [startRange, endRange, start, end]) input.max = duration;
            start.value = startRange.value = '0.00';
            end.value = endRange.value = duration.toFixed(2);
        });
        startRange.addEventListener('input', () => { start.value = startRange.value; clampTimes('start'); video.currentTime = Number(start.value); });
        endRange.addEventListener('input', () => { end.value = endRange.value; clampTimes('end'); video.currentTime = Number(end.value); });
        start.addEventListener('change', () => clampTimes('start'));
        end.addEventListener('change', () => clampTimes('end'));
        $('setStart').addEventListener('click', () => { start.value = video.currentTime; clampTimes('start'); });
        $('setEnd').addEventListener('click', () => { end.value = video.currentTime; clampTimes('end'); });

        cut.addEventListener('click', async () => {
            clampTimes();
            const from = Number(start.value), length = Number(end.value) - from;
            if (!file || length <= 0) return;
            cut.disabled = true;
            progress.hidden = false;
            progress.value = 0;
            download.hidden = true;
            try {
                if (!ffmpeg) {
                    status.textContent = '処理エンジンを読み込み中…';
                    ffmpeg = new FFmpegWASM.FFmpeg();
                    ffmpeg.on('progress', ({ progress: ratio }) => progress.value = Math.max(0, Math.min(ratio, 1)));
                    const core = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
                    const worker = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/worker.js';
                    await ffmpeg.load({
                        classWorkerURL: URL.createObjectURL(new Blob([`import '${worker}'`], { type: 'text/javascript' })),
                        coreURL: await toBlobURL(`${core}/ffmpeg-core.js`, 'text/javascript'),
                        wasmURL: await toBlobURL(`${core}/ffmpeg-core.wasm`, 'application/wasm')
                    });
                }
                status.textContent = '切り出し中…';
                await ffmpeg.writeFile('input.webm', new Uint8Array(await file.arrayBuffer()));
                const exitCode = await ffmpeg.exec(['-ss', String(from), '-i', 'input.webm', '-t', String(length), '-map', '0', '-c', 'copy', '-avoid_negative_ts', 'make_zero', 'output.webm']);
                if (exitCode) throw new Error(`FFmpeg exited with ${exitCode}`);
                const data = await ffmpeg.readFile('output.webm');
                if (outputUrl) URL.revokeObjectURL(outputUrl);
                outputUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/webm' }));
                download.href = outputUrl;
                download.download = file.name.replace(/\.webm$/i, '') + '-cut.webm';
                download.hidden = false;
                progress.value = 1;
                status.textContent = '完了しました。';
            } catch (error) {
                console.error(error);
                status.textContent = '切り出しに失敗しました。別のWebMでお試しください。';
            } finally {
                if (ffmpeg) for (const name of ['input.webm', 'output.webm']) try { await ffmpeg.deleteFile(name); } catch { }
                cut.disabled = false;
            }
        });
    </script>
</body>

</html>
