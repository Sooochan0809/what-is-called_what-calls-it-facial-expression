<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>モノクロ変換</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: Canvas;
            color: CanvasText;
        }

        main {
            width: min(960px, 100%);
            margin: auto;
            padding: 32px 20px 48px;
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            margin: 0 0 24px;
            opacity: .7;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
        }

        input,
        button,
        a {
            min-height: 42px;
            padding: 9px 13px;
            border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
            border-radius: 7px;
            font: inherit;
        }

        button,
        a {
            background: #1473e6;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        button:disabled {
            cursor: default;
            opacity: .45;
        }

        output {
            display: block;
            min-height: 1.5em;
            margin: 20px 0 12px;
        }

        progress,
        video {
            width: 100%;
        }

        progress {
            margin-bottom: 16px;
            accent-color: #1473e6;
        }

        ul {
            display: grid;
            gap: 10px;
            margin: 0 0 20px;
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .error {
            color: #d33;
        }

        video {
            display: block;
            max-height: 65dvh;
            background: #111;
            filter: grayscale(1);
        }
    </style>
</head>

<body>
    <main>
        <h1>モノクロ変換</h1>
        <p>WebM・MP4・MOVをモノクロのWebMに変換します。音声と解像度は維持され、処理はブラウザ内だけで行われます。</p>
        <div class="controls">
            <label>動画ファイル
                <input id="file" type="file" accept="video/webm,video/mp4,video/quicktime,.webm,.mp4,.mov" multiple>
            </label>
            <button id="convert" type="button" disabled>すべてモノクロに変換</button>
        </div>
        <output id="status" role="status" aria-live="polite">動画ファイルを選択してください。</output>
        <progress id="progress" max="1" value="0" hidden></progress>
        <ul id="results"></ul>
        <video id="preview" controls playsinline hidden></video>
    </main>

    <script src="../modules/ffmpeg/ffmpeg.js"></script>
    <script>
        const fileInput = document.getElementById("file");
        const convertButton = document.getElementById("convert");
        const status = document.getElementById("status");
        const progress = document.getElementById("progress");
        const results = document.getElementById("results");
        const preview = document.getElementById("preview");
        let ffmpeg;
        let sourceUrl;
        const resultUrls = [];

        function clearResults() {
            resultUrls.splice(0).forEach(URL.revokeObjectURL);
            results.replaceChildren();
            progress.hidden = true;
            progress.value = 0;
        }

        fileInput.addEventListener("change", () => {
            clearResults();
            if (sourceUrl) URL.revokeObjectURL(sourceUrl);
            const files = [...fileInput.files].filter(file => /\.(webm|mp4|mov)$/i.test(file.name));
            convertButton.disabled = !files.length;
            preview.hidden = !files.length;
            if (!files.length) {
                preview.removeAttribute("src");
                status.textContent = fileInput.files.length ? "WebM・MP4・MOVファイルを選択してください。" : "動画ファイルを選択してください。";
                return;
            }
            sourceUrl = URL.createObjectURL(files[0]);
            preview.src = sourceUrl;
            status.textContent = `${files.length}件の動画を選択しました。`;
        });

        convertButton.addEventListener("click", async () => {
            const files = [...fileInput.files].filter(file => /\.(webm|mp4|mov)$/i.test(file.name));
            if (!files.length) return;
            clearResults();
            convertButton.disabled = fileInput.disabled = true;
            progress.hidden = false;
            let completed = 0;
            try {
                if (!ffmpeg) {
                    status.textContent = "処理エンジンを読み込み中…";
                    ffmpeg = new FFmpegWASM.FFmpeg();
                    ffmpeg.on("progress", ({ progress: ratio }) => progress.value = Math.max(0, Math.min(ratio, 1)));
                    await ffmpeg.load({
                        coreURL: new URL("../modules/ffmpeg/ffmpeg-core.js", location.href).href,
                        wasmURL: new URL("../modules/ffmpeg/ffmpeg-core.wasm", location.href).href
                    });
                }
                for (const [index, file] of files.entries()) {
                    const extension = file.name.match(/\.(webm|mp4|mov)$/i)[1].toLowerCase();
                    const inputName = `input.${extension}`;
                    const outputName = "output.webm";
                    const item = document.createElement("li");
                    progress.value = 0;
                    status.textContent = `${index + 1}/${files.length} ${file.name} を変換中…`;
                    try {
                        await ffmpeg.writeFile(inputName, new Uint8Array(await file.arrayBuffer()));
                        const monochrome = "colorchannelmixer=.299:.587:.114:0:.299:.587:.114:0:.299:.587:.114";
                        const exitCode = await ffmpeg.exec([
                            "-i", inputName,
                            "-map", "0:v:0", "-map", "0:a?",
                            "-vf", monochrome,
                            "-c:v", "libvpx", "-b:v", "30M",
                            "-c:a", "libopus",
                            outputName
                        ]);
                        if (exitCode) throw new Error(`FFmpeg exited with ${exitCode}`);
                        const data = await ffmpeg.readFile(outputName);
                        const url = URL.createObjectURL(new Blob([data], { type: "video/webm" }));
                        resultUrls.push(url);
                        const download = document.createElement("a");
                        download.href = url;
                        download.download = `${file.name.replace(/\.(webm|mp4|mov)$/i, "")}-monochrome.webm`;
                        download.textContent = "ダウンロード";
                        item.append(file.name, download);
                        completed += 1;
                    } catch (error) {
                        console.error(error);
                        item.className = "error";
                        item.textContent = `${file.name}: 変換に失敗しました。`;
                    } finally {
                        for (const name of [inputName, outputName]) try { await ffmpeg.deleteFile(name); } catch { }
                    }
                    results.append(item);
                }
                progress.value = 1;
                status.textContent = `${completed}/${files.length}件の変換が完了しました。`;
            } catch (error) {
                console.error(error);
                status.textContent = "処理エンジンを読み込めませんでした。";
            } finally {
                convertButton.disabled = fileInput.disabled = false;
            }
        });

        window.addEventListener("pagehide", () => {
            if (sourceUrl) URL.revokeObjectURL(sourceUrl);
            clearResults();
        });
    </script>
</body>

</html>
