<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebM Expression Picker</title>
    <script defer src="../module/faceAPI/face-api.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --line: #d8d8d8;
            --muted: #666;
            --text: #171717;
            --bg: #fff;
            --soft: #f6f6f6;
            --accent: #111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: clamp(320px, calc(100vw - 32px), 1040px);
            margin: 24px auto 40px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 22px;
            font-weight: 650;
        }

        .panel {
            display: grid;
            gap: 14px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 160px)) minmax(140px, 1fr);
            gap: 10px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        input,
        select {
            padding: 6px 8px;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
        }

        button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .video-slots {
            display: grid;
            gap: 12px;
        }

        .emotion-group {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
        }

        .emotion-group h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 650;
        }

        .slot-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .video-slot {
            display: grid;
            gap: 6px;
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--soft);
        }

        .video-slot strong,
        .slot-status {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-slot strong {
            font-size: 12px;
        }

        .slot-status {
            color: var(--muted);
            font-size: 11px;
        }

        .status {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            min-height: 22px;
            color: var(--muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        progress {
            width: 160px;
            height: 8px;
            accent-color: #111;
        }

        .results {
            display: grid;
            gap: 18px;
            margin-top: 16px;
        }

        .result-group h2 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .card {
            position: relative;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .rank {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            background: var(--soft);
        }

        .meta {
            display: grid;
            gap: 5px;
            padding: 10px;
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .meta strong {
            color: var(--text);
            font-size: 13px;
            font-weight: 650;
        }

        .meta button {
            margin-top: 4px;
            min-height: 32px;
        }

        .empty {
            margin-top: 16px;
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 820px) {
            main {
                width: clamp(320px, calc(100vw - 20px), 1040px);
                margin-top: 12px;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .controls button {
                grid-column: 1 / -1;
            }

            .emotion-group {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .slot-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>WebM Expression Picker</h1>
        <section class="panel">
            <div class="controls">
                <label>
                    interval sec
                    <input id="interval" type="number" min="0.1" max="10" step="0.1" value="0.1">
                </label>
                <label>
                    min score
                    <input id="minScore" type="number" min="0" max="1" step="0.01" value="0.6">
                </label>
                <button id="analyze" class="primary" type="button" disabled>analyze all</button>
            </div>
            <div id="videoSlots" class="video-slots"></div>
            <video id="video" playsinline muted hidden></video>
            <div class="status">
                <span id="message">モデルを読み込んでいます</span>
                <progress id="progress" value="0" max="1" hidden></progress>
                <button id="downloadAll" type="button" disabled>download zip</button>
            </div>
        </section>
        <div id="results" class="results"></div>
        <div id="empty" class="empty">各感情に3本ずつ、最大21本の動画をまとめて分析できます。</div>
    </main>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "../module/mediapipe/vision_bundle.mjs";

        window.addEventListener("load", async () => {
            const $ = (id) => document.getElementById(id);
            const MODEL_URL = "../module/faceAPI/models";
            const MEDIAPIPE_WASM_URL = new URL("../module/mediapipe/wasm", window.location.href).href.replace(/\/$/, "");
            const FACE_LANDMARKER_URL = new URL("../module/mediapipe/models/face_landmarker.task", window.location.href).href;
            const EMOTIONS = ["neutral", "happy", "surprised", "angry", "sad", "fearful", "disgusted"];
            const BLINK_MAX_DURATION = 0.5;
            const BLINK_GUARD_SECONDS = 0.35;
            const BLINK_SCORE_THRESHOLD = 0.5;
            const GAZE_SCORE_THRESHOLD = 0.6;
            const GAZE_DEVIATION_MULTIPLIER = 1.5;
            const FEARFUL_FALLBACK_MIN_SCORE = 0.5;
            const IRIS_HORIZONTAL_TOLERANCE = 0.08;
            const IRIS_HORIZONTAL_RANGE = 0.22;
            const IRIS_VERTICAL_CENTER = -0.05;
            const IRIS_DOWN_TOLERANCE = 0.008;
            const IRIS_DOWN_RANGE = 0.05;
            const IRIS_UP_TOLERANCE = 0.015;
            const IRIS_UP_RANGE = 0.06;
            const ANALYSIS_CONCURRENCY = 6;
            const QUALITY_PLAYBACK_RATE = 2.5;
            const DETERMINISTIC_RETRY_STEP = 0.1;
            const DETERMINISTIC_RETRY_COARSE_STEP = 0.2;
            const DETERMINISTIC_RETRY_RADIUS = 0.1;
            const DETERMINISTIC_RETRY_ANCHORS = 5;
            const DETERMINISTIC_RETRY_CANDIDATES = 30;
            const MEDIAPIPE_INPUT_WIDTH = 320;
            const FACE_API_INPUT_WIDTH = 320;
            const AUTO_JOBS_URL = "/api/uploads/jobs";
            const AUTO_COMPLETE_URL = "/api/uploads/complete";
            const [video, interval, minScore, analyze, progress, message, results, empty, downloadAll, videoSlots] =
                ["video", "interval", "minScore", "analyze", "progress", "message", "results", "empty", "downloadAll", "videoSlots"].map($);
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.35 });
            let token = 0;
            let modelsReady = false;
            let analyzing = false;
            let analysisContexts = [];
            let autoPollBusy = false;
            let autoRunnerActive = false;
            const autoJobQueue = [];
            const queuedAutoJobIds = new Set();
            const slots = [];

            const models = Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
                (async () => {
                    const vision = await FilesetResolver.forVisionTasks(MEDIAPIPE_WASM_URL);
                    for (let index = 0; index < ANALYSIS_CONCURRENCY; index++) {
                        const contextVideo = index === 0 ? video : document.createElement("video");
                        contextVideo.muted = true;
                        contextVideo.playsInline = true;
                        contextVideo.hidden = true;
                        if (index > 0) document.body.appendChild(contextVideo);
                        const contextCanvas = document.createElement("canvas");
                        const inferenceCanvas = document.createElement("canvas");
                        const context = {
                            video: contextVideo,
                            canvas: contextCanvas,
                            canvasContext: contextCanvas.getContext("2d"),
                            inferenceCanvas,
                            inferenceContext: inferenceCanvas.getContext("2d", { alpha: false }),
                            mediaPipeTimestamp: 0,
                            faceLandmarker: await FaceLandmarker.createFromOptions(vision, {
                                baseOptions: { modelAssetPath: FACE_LANDMARKER_URL },
                                runningMode: "VIDEO",
                                numFaces: 1,
                                minFaceDetectionConfidence: 0.35,
                                minFacePresenceConfidence: 0.35,
                                minTrackingConfidence: 0.35,
                                outputFaceBlendshapes: true
                            })
                        };
                        analysisContexts.push(context);
                    }
                })()
            ]);

            const updateAnalyzeState = () => {
                analyze.disabled = analyzing || !modelsReady || !slots.some((slot) => slot.objectUrl);
            };

            for (const emotionName of EMOTIONS) {
                const group = document.createElement("section");
                group.className = "emotion-group";
                group.innerHTML = `<h2>${emotionName}</h2><div class="slot-row"></div>`;
                const row = group.querySelector(".slot-row");

                for (let slotNumber = 1; slotNumber <= 3; slotNumber++) {
                    const slotElement = document.createElement("label");
                    slotElement.className = "video-slot";
                    slotElement.innerHTML = `
                        <strong>${emotionName} ${slotNumber}</strong>
                        <input type="file" accept="video/webm,video/*">
                        <span class="slot-status">未選択</span>
                    `;
                    const slot = {
                        emotion: emotionName,
                        number: slotNumber,
                        input: slotElement.querySelector("input"),
                        status: slotElement.querySelector(".slot-status"),
                        objectUrl: "",
                        fileName: "",
                        picks: [],
                        frameCount: 0,
                        blinkCount: 0,
                        analysisState: null
                    };
                    slot.input.addEventListener("change", () => {
                        token += 1;
                        if (slot.objectUrl.startsWith("blob:")) URL.revokeObjectURL(slot.objectUrl);
                        const selectedFile = slot.input.files[0];
                        slot.objectUrl = selectedFile ? URL.createObjectURL(selectedFile) : "";
                        slot.fileName = selectedFile?.name || "";
                        slot.picks = [];
                        slot.frameCount = 0;
                        slot.blinkCount = 0;
                        slot.analysisState = null;
                        slot.status.textContent = selectedFile ? selectedFile.name : "未選択";
                        renderResults();
                        setStatus(`${slots.filter((item) => item.objectUrl).length} / 21 videos selected`, 0, 0);
                        updateAnalyzeState();
                    });
                    slots.push(slot);
                    row.appendChild(slotElement);
                }
                videoSlots.appendChild(group);
            }

            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const mean = (values) => values.reduce((sum, value) => sum + value, 0) / Math.max(1, values.length);
            const formatTime = (seconds) => {
                const min = Math.floor(seconds / 60);
                const sec = (seconds - min * 60).toFixed(1).padStart(4, "0");
                return `${min}:${sec}`;
            };

            const setStatus = (text, current = 0, total = 0) => {
                message.textContent = text;
                progress.hidden = !total;
                progress.max = Math.max(1, total);
                progress.value = current;
            };

            const seek = (context, time) => new Promise((resolve) => {
                const { video: contextVideo } = context;
                const duration = Number.isFinite(contextVideo.duration) ? contextVideo.duration : 0;
                const target = clamp(time, 0, Math.max(0, duration - 0.04));
                if (Math.abs(contextVideo.currentTime - target) < 0.002 && contextVideo.readyState >= 2) {
                    requestAnimationFrame(resolve);
                    return;
                }
                contextVideo.addEventListener("seeked", () => requestAnimationFrame(resolve), { once: true });
                contextVideo.currentTime = target;
            });

            const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const centerOf = (points) => ({
                x: mean(points.map((point) => point.x)),
                y: mean(points.map((point) => point.y))
            });
            const blendshapeMapFrom = (result) => {
                const categories = result.faceBlendshapes[0]?.categories || [];
                return categories.reduce((memo, category) => ({
                    ...memo,
                    [category.categoryName]: category.score
                }), {});
            };
            const irisHorizontalRatio = (positions, cornerA, cornerB, irisCenter) => {
                const start = positions[cornerA];
                const end = positions[cornerB];
                const iris = positions[irisCenter];
                const eyeX = end.x - start.x;
                const eyeY = end.y - start.y;
                const eyeLengthSquared = eyeX * eyeX + eyeY * eyeY;
                if (!eyeLengthSquared) return 0.5;
                return ((iris.x - start.x) * eyeX + (iris.y - start.y) * eyeY) / eyeLengthSquared;
            };
            const irisVerticalRatio = (positions, cornerA, cornerB, irisCenter) => {
                const start = positions[cornerA];
                const end = positions[cornerB];
                const iris = positions[irisCenter];
                const eyeX = end.x - start.x;
                const eyeY = end.y - start.y;
                const eyeLengthSquared = eyeX * eyeX + eyeY * eyeY;
                if (!eyeLengthSquared) return IRIS_VERTICAL_CENTER;
                const eyeCenterX = (start.x + end.x) / 2;
                const eyeCenterY = (start.y + end.y) / 2;
                return ((iris.x - eyeCenterX) * -eyeY + (iris.y - eyeCenterY) * eyeX) / eyeLengthSquared;
            };
            const gazeScoreFrom = (positions) => {
                // 横方向は表情係数ではなく、目頭・目尻間における虹彩中心の実位置を見る。
                const rightIrisRatio = irisHorizontalRatio(positions, 33, 133, 468);
                const leftIrisRatio = irisHorizontalRatio(positions, 362, 263, 473);
                const horizontalOffset = Math.max(
                    Math.abs(rightIrisRatio - 0.5),
                    Math.abs(leftIrisRatio - 0.5)
                );
                const horizontalDeviation = clamp(
                    (horizontalOffset - IRIS_HORIZONTAL_TOLERANCE) / IRIS_HORIZONTAL_RANGE,
                    0,
                    1
                );

                // 縦方向も虹彩中心を使う。笑顔では上側へ寄りやすいため、上下で許容幅を分ける。
                const irisVerticalPosition = mean([
                    irisVerticalRatio(positions, 33, 133, 468),
                    irisVerticalRatio(positions, 362, 263, 473)
                ]);
                const verticalOffset = irisVerticalPosition - IRIS_VERTICAL_CENTER;
                const verticalDeviation = verticalOffset >= 0
                    ? clamp((verticalOffset - IRIS_DOWN_TOLERANCE) / IRIS_DOWN_RANGE, 0, 1)
                    : clamp((-verticalOffset - IRIS_UP_TOLERANCE) / IRIS_UP_RANGE, 0, 1);
                const strongestDeviation = Math.max(horizontalDeviation, verticalDeviation);
                return clamp(1 - strongestDeviation * GAZE_DEVIATION_MULTIPLIER, 0, 1);
            };

            const blendshapeAverage = (blendshapes, names) =>
                mean(names.map((name) => blendshapes[name] || 0));

            // MediaPipeは全サンプルの粗い候補選定にだけ使う。最終的な感情スコアはface-apiで判定する。
            const expressionProxyFrom = (blendshapes) => {
                const happy = blendshapeAverage(blendshapes, ["mouthSmileLeft", "mouthSmileRight", "cheekSquintLeft", "cheekSquintRight"]);
                const sad = blendshapeAverage(blendshapes, ["mouthFrownLeft", "mouthFrownRight", "browInnerUp"]);
                const angry = blendshapeAverage(blendshapes, ["browDownLeft", "browDownRight", "eyeSquintLeft", "eyeSquintRight"]);
                const fearful = blendshapeAverage(blendshapes, ["eyeWideLeft", "eyeWideRight", "browInnerUp", "browOuterUpLeft", "browOuterUpRight", "mouthStretchLeft", "mouthStretchRight"]);
                const disgusted = blendshapeAverage(blendshapes, ["noseSneerLeft", "noseSneerRight", "mouthUpperUpLeft", "mouthUpperUpRight"]);
                const surprised = blendshapeAverage(blendshapes, ["jawOpen", "eyeWideLeft", "eyeWideRight", "browInnerUp", "browOuterUpLeft", "browOuterUpRight"]);
                const strongestExpression = Math.max(happy, sad, angry, fearful, disgusted, surprised);
                return {
                    neutral: clamp(1 - strongestExpression * 1.5, 0, 1),
                    happy,
                    sad,
                    angry,
                    fearful,
                    disgusted,
                    surprised
                };
            };

            const markBlinkFrames = (analyzedSamples, detectedFrames, sampleStep) => {
                if (!detectedFrames.length) return 0;

                const isClosed = (frame) =>
                    !frame.missing && frame.blinkScore >= BLINK_SCORE_THRESHOLD;
                const unstableRuns = [];
                let run = [];

                // 短い顔検出失敗も、完全閉眼でランドマークが取れなかった可能性があるため同じ区間として扱う。
                for (const sample of analyzedSamples) {
                    if (run.length && sample.time - run[run.length - 1].time > sampleStep * 1.5) {
                        unstableRuns.push(run);
                        run = [];
                    }
                    if (sample.missing || isClosed(sample)) {
                        run.push(sample);
                    } else {
                        if (run.length) unstableRuns.push(run);
                        run = [];
                    }
                }
                if (run.length) unstableRuns.push(run);

                detectedFrames.forEach((frame) => {
                    frame.blinkExcluded = false;
                });

                let blinkCount = 0;
                for (const unstableRun of unstableRuns) {
                    const first = unstableRun[0];
                    const last = unstableRun[unstableRun.length - 1];
                    const unstableDuration = unstableRun.length * sampleStep;
                    // 長く続く閉眼・検出欠落は意図的な状態とみなし、周辺を除外しない。
                    if (unstableDuration > BLINK_MAX_DURATION) continue;

                    blinkCount += 1;
                    const excludedFrom = first.time - sampleStep / 2 - BLINK_GUARD_SECONDS;
                    const excludedTo = last.time + sampleStep / 2 + BLINK_GUARD_SECONDS;
                    detectedFrames.forEach((frame) => {
                        if (frame.time >= excludedFrom && frame.time <= excludedTo) frame.blinkExcluded = true;
                    });
                }

                return blinkCount;
            };

            const qualityFrom = (detection, source) => {
                const box = detection.detection.box;
                const positions = detection.landmarks.positions;
                const leftEye = centerOf(positions.slice(36, 42));
                const rightEye = centerOf(positions.slice(42, 48));
                const nose = positions[30];
                const mouth = centerOf(positions.slice(48, 68));
                const eyeDistance = Math.max(1, distance(leftEye, rightEye));
                const faceCenterX = box.x + box.width / 2;
                const faceCenterY = box.y + box.height / 2;
                const sourceWidth = source.videoWidth || source.width;
                const sourceHeight = source.videoHeight || source.height;
                const centerOffset = Math.hypot(
                    (faceCenterX - sourceWidth / 2) / sourceWidth,
                    (faceCenterY - sourceHeight / 2) / sourceHeight
                );
                const centerScore = clamp(1 - centerOffset * 2.4, 0, 1);
                const yawScore = clamp(1 - Math.abs(distance(nose, leftEye) - distance(nose, rightEye)) / eyeDistance * 1.8, 0, 1);
                const rollScore = clamp(1 - Math.abs(leftEye.y - rightEye.y) / eyeDistance * 2.2, 0, 1);
                const pitchScore = clamp(1 - Math.abs((mouth.y - nose.y) / eyeDistance - 0.55), 0, 1);
                const frontalScore = (yawScore + rollScore + pitchScore) / 3;
                const quality = centerScore * 0.3 + frontalScore * 0.7;
                return { quality, centerScore, frontalScore, box };
            };

            const qualityFromMediaPipe = (positions) => {
                const leftEye = centerOf([positions[33], positions[133]]);
                const rightEye = centerOf([positions[362], positions[263]]);
                const nose = positions[1];
                const mouth = centerOf([positions[13], positions[14]]);
                const eyeDistance = Math.max(0.001, distance(leftEye, rightEye));
                const xs = positions.map((point) => point.x);
                const ys = positions.map((point) => point.y);
                const minX = Math.min(...xs);
                const maxX = Math.max(...xs);
                const minY = Math.min(...ys);
                const maxY = Math.max(...ys);
                const centerScore = clamp(1 - Math.hypot((minX + maxX) / 2 - 0.5, (minY + maxY) / 2 - 0.5) * 2.4, 0, 1);
                const yawScore = clamp(1 - Math.abs(distance(nose, leftEye) - distance(nose, rightEye)) / eyeDistance * 1.8, 0, 1);
                const rollScore = clamp(1 - Math.abs(leftEye.y - rightEye.y) / eyeDistance * 2.2, 0, 1);
                const pitchScore = clamp(1 - Math.abs((mouth.y - nose.y) / eyeDistance - 0.55), 0, 1);
                const frontalScore = (yawScore + rollScore + pitchScore) / 3;
                const quality = centerScore * 0.3 + frontalScore * 0.7;
                return {
                    quality,
                    centerScore,
                    frontalScore
                };
            };

            const drawInferenceFrame = (context, maxWidth) => {
                const { video: contextVideo, inferenceCanvas, inferenceContext } = context;
                const scale = Math.min(1, maxWidth / Math.max(1, contextVideo.videoWidth));
                const width = Math.max(1, Math.round(contextVideo.videoWidth * scale));
                const height = Math.max(1, Math.round(contextVideo.videoHeight * scale));
                if (inferenceCanvas.width !== width || inferenceCanvas.height !== height) {
                    inferenceCanvas.width = width;
                    inferenceCanvas.height = height;
                }
                inferenceContext.drawImage(contextVideo, 0, 0, width, height);
                return inferenceCanvas;
            };

            const captureFrame = async (context, time) => {
                const { video: contextVideo, canvas, canvasContext } = context;
                await seek(context, time);
                canvas.width = contextVideo.videoWidth;
                canvas.height = contextVideo.videoHeight;
                canvasContext.clearRect(0, 0, canvas.width, canvas.height);
                canvasContext.drawImage(contextVideo, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL("image/png");
            };

            const shortlistFrames = (analyzedFrames, selectedEmotion, sampleStep) => {
                const candidates = analyzedFrames
                    // 瞬きだけは時間情報が必要なため先に除外する。視線・正面度などの品質は最終判定まで使わない。
                    .filter((frame) => !frame.blinkExcluded)
                    .map((frame) => {
                        const expressionScore = frame.expressionProxy[selectedEmotion] || 0;
                        return { ...frame, proxyScore: expressionScore };
                    })
                    .sort((a, b) => b.proxyScore - a.proxyScore);

                const minGap = Math.max(0.4, sampleStep * 1.5);
                const selected = [];
                for (const frame of candidates) {
                    if (selected.every((item) => Math.abs(item.time - frame.time) >= minGap)) selected.push(frame);
                }
                for (const frame of candidates) {
                    if (!selected.includes(frame)) selected.push(frame);
                }
                return selected;
            };

            const pickFrames = async (context, analyzedFrames, selectedEmotion, targetCount, minEmotionScore, runToken, slotLabel) => {
                const candidates = analyzedFrames
                    .map((frame) => {
                        const expressionScore = frame.expressions[selectedEmotion] || 0;
                        const gazeScore = frame.blinkScore < BLINK_SCORE_THRESHOLD ? frame.gazeScore : null;
                        const totalScore = Number.isFinite(gazeScore)
                            ? (expressionScore * 0.42 + frame.quality.quality * 0.23 + gazeScore * 0.15) / 0.80
                            : (expressionScore * 0.48 + frame.quality.quality * 0.28) / 0.76;
                        return { ...frame, expressionScore, gazeScore, totalScore };
                    })
                    .filter((frame) =>
                        frame.expressionScore >= minEmotionScore &&
                        (!Number.isFinite(frame.gazeScore) || frame.gazeScore >= GAZE_SCORE_THRESHOLD)
                    )
                    .sort((a, b) => b.totalScore - a.totalScore);

                const minGap = Math.max(0.8, Number(interval.value) * 1.8);
                const selected = [];
                for (const frame of candidates) {
                    if (selected.length >= targetCount) break;
                    if (selected.every((item) => Math.abs(item.time - frame.time) >= minGap)) selected.push(frame);
                }
                for (const frame of candidates) {
                    if (selected.length >= targetCount) break;
                    if (!selected.includes(frame)) selected.push(frame);
                }

                const captured = [];
                for (let i = 0; i < selected.length; i++) {
                    if (runToken !== token) return [];
                    setStatus(`${slotLabel}: 画像を書き出しています ${i + 1}/${selected.length}`, i + 1, selected.length);
                    captured.push({
                        ...selected[i],
                        imageUrl: await captureFrame(context, selected[i].time)
                    });
                }
                return captured;
            };

            const downloadDataUrl = (url, name) => {
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = name;
                anchor.click();
            };

            const crc32Table = Array.from({ length: 256 }, (_, index) => {
                let value = index;
                for (let bit = 0; bit < 8; bit++) {
                    value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
                }
                return value >>> 0;
            });
            const crc32 = (bytes) => {
                let value = 0xffffffff;
                for (const byte of bytes) value = crc32Table[(value ^ byte) & 0xff] ^ (value >>> 8);
                return (value ^ 0xffffffff) >>> 0;
            };
            const concatBytes = (parts) => {
                const output = new Uint8Array(parts.reduce((sum, part) => sum + part.length, 0));
                let offset = 0;
                for (const part of parts) {
                    output.set(part, offset);
                    offset += part.length;
                }
                return output;
            };
            const createStoredZip = async (files) => {
                const encoder = new TextEncoder();
                const localParts = [];
                const centralParts = [];
                let localOffset = 0;
                const now = new Date();
                const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
                const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

                for (const file of files) {
                    const nameBytes = encoder.encode(file.name);
                    const response = await fetch(file.url);
                    const data = new Uint8Array(await response.arrayBuffer());
                    const checksum = crc32(data);
                    const localHeader = new Uint8Array(30);
                    const localView = new DataView(localHeader.buffer);
                    localView.setUint32(0, 0x04034b50, true);
                    localView.setUint16(4, 20, true);
                    localView.setUint16(6, 0x0800, true);
                    localView.setUint16(8, 0, true);
                    localView.setUint16(10, dosTime, true);
                    localView.setUint16(12, dosDate, true);
                    localView.setUint32(14, checksum, true);
                    localView.setUint32(18, data.length, true);
                    localView.setUint32(22, data.length, true);
                    localView.setUint16(26, nameBytes.length, true);
                    localParts.push(localHeader, nameBytes, data);

                    const centralHeader = new Uint8Array(46);
                    const centralView = new DataView(centralHeader.buffer);
                    centralView.setUint32(0, 0x02014b50, true);
                    centralView.setUint16(4, 20, true);
                    centralView.setUint16(6, 20, true);
                    centralView.setUint16(8, 0x0800, true);
                    centralView.setUint16(10, 0, true);
                    centralView.setUint16(12, dosTime, true);
                    centralView.setUint16(14, dosDate, true);
                    centralView.setUint32(16, checksum, true);
                    centralView.setUint32(20, data.length, true);
                    centralView.setUint32(24, data.length, true);
                    centralView.setUint16(28, nameBytes.length, true);
                    centralView.setUint32(42, localOffset, true);
                    centralParts.push(centralHeader, nameBytes);
                    localOffset += localHeader.length + nameBytes.length + data.length;
                }

                const centralDirectory = concatBytes(centralParts);
                const end = new Uint8Array(22);
                const endView = new DataView(end.buffer);
                endView.setUint32(0, 0x06054b50, true);
                endView.setUint16(8, files.length, true);
                endView.setUint16(10, files.length, true);
                endView.setUint32(12, centralDirectory.length, true);
                endView.setUint32(16, localOffset, true);
                return new Blob([...localParts, centralDirectory, end], { type: "application/zip" });
            };
            const downloadBlob = (blob, name) => {
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = name;
                anchor.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const rankedPicksByEmotion = () => EMOTIONS.map((emotion) => ({
                emotion,
                entries: slots
                    .filter((slot) => slot.emotion === emotion)
                    .flatMap((slot) => slot.picks.map((pick) => ({ slot, pick })))
                    .sort((a, b) => b.pick.totalScore - a.pick.totalScore)
                    .slice(0, 1)
                    .map((entry) => ({ ...entry, rank: 1 }))
            })).filter((group) => group.entries.length);

            const rankedFilename = ({ emotion, pick }) => {
                const emotionNumber = EMOTIONS.indexOf(emotion) + 1;
                const emotionLabel = emotion === "happy" ? " happy" : emotion;
                return `p${emotionNumber}_${emotionLabel}_${pick.expressionScore.toFixed(3)}.png`;
            };
            const downloadTopPicksZip = async (zipName) => {
                const files = rankedPicksByEmotion().map(({ emotion, entries }) => ({
                    name: rankedFilename({ emotion, pick: entries[0].pick }),
                    url: entries[0].pick.imageUrl
                }));
                if (!files.length) throw new Error("ZIPに保存できる画像がありません");
                downloadBlob(await createStoredZip(files), zipName);
                return files.length;
            };

            const renderResults = () => {
                results.innerHTML = "";
                const rankedGroups = rankedPicksByEmotion();
                const allPicks = rankedGroups.flatMap((group) => group.entries);
                empty.hidden = allPicks.length > 0;
                downloadAll.disabled = analyzing || allPicks.length === 0;

                rankedGroups.forEach(({ emotion, entries }) => {
                    const group = document.createElement("section");
                    group.className = "result-group";
                    group.innerHTML = `
                        <h2>${emotion} · videos 1 / 2 / 3 の1位</h2>
                        <div class="result-grid"></div>
                    `;
                    const grid = group.querySelector(".result-grid");
                    entries.forEach(({ slot, pick, rank }) => {
                        const filename = rankedFilename({ emotion, pick });
                        const card = document.createElement("article");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="rank">${rank}位</div>
                            <img src="${pick.imageUrl}" alt="${emotion} video ${slot.number} rank ${rank}">
                            <div class="meta">
                                <strong>total ${pick.totalScore.toFixed(3)} / ${formatTime(pick.time)}</strong>
                                <span>video ${slot.number} · ${slot.fileName}</span>
                                <span>${emotion} ${pick.expressionScore.toFixed(3)}</span>
                                <span>front ${pick.quality.frontalScore.toFixed(3)} · gaze ${Number.isFinite(pick.gazeScore) ? pick.gazeScore.toFixed(3) : "n/a"}</span>
                                <span>blink ${pick.blinkScore.toFixed(3)}</span>
                                <button type="button">download</button>
                            </div>
                        `;
                        card.querySelector("button").addEventListener("click", () => downloadDataUrl(pick.imageUrl, filename));
                        grid.appendChild(card);
                    });
                    results.appendChild(group);
                });
            };

            const loadSlotVideo = (context, slot) => new Promise((resolve, reject) => {
                const { video: contextVideo } = context;
                const onLoaded = () => {
                    cleanup();
                    resolve();
                };
                const onError = () => {
                    cleanup();
                    reject(new Error(`${slot.fileName}を読み込めませんでした`));
                };
                const cleanup = () => {
                    contextVideo.removeEventListener("loadedmetadata", onLoaded);
                    contextVideo.removeEventListener("error", onError);
                };
                contextVideo.addEventListener("loadedmetadata", onLoaded, { once: true });
                contextVideo.addEventListener("error", onError, { once: true });
                contextVideo.src = slot.objectUrl;
                contextVideo.load();
            });

            const resultStatusFor = (slot) => {
                const base = `${slot.frameCount} frames · ${slot.blinkCount} blinks · ${slot.picks.length} images`;
                if (slot.picks.length || !slot.analysisState?.finalFrames.length) return base;
                const emotionScores = slot.analysisState.finalFrames.map((frame) => frame.expressions[slot.emotion] || 0);
                const gazeEligibleScores = slot.analysisState.finalFrames
                    .filter((frame) => frame.blinkScore >= BLINK_SCORE_THRESHOLD || frame.gazeScore >= GAZE_SCORE_THRESHOLD)
                    .map((frame) => frame.expressions[slot.emotion] || 0);
                const maxEmotion = Math.max(0, ...emotionScores);
                const maxGazeEligible = Math.max(0, ...gazeEligibleScores);
                return `${base} · max ${maxEmotion.toFixed(3)} / gaze-pass ${maxGazeEligible.toFixed(3)}`;
            };

            const analyzeNextCandidateBatch = async (context, slot, slotIndex, slotTotal, runToken, allowEmotionFallback = false) => {
                const state = slot.analysisState;
                if (!state || state.analyzedCandidateCount >= state.shortlistedFrames.length) return false;
                const { faceLandmarker } = context;

                const batchEnd = Math.min(
                    state.shortlistedFrames.length,
                    state.analyzedCandidateCount + state.candidateBatchSize
                );
                const batch = state.shortlistedFrames
                    .slice(state.analyzedCandidateCount, batchEnd)
                    .sort((a, b) => a.time - b.time);
                const slotLabel = `${slot.emotion} ${slot.number}`;
                // VIDEO追跡の平滑化を最終結果へ持ち込まず、候補フレーム自身の視線を独立判定する。
                await faceLandmarker.setOptions({ runningMode: "IMAGE" });

                for (let i = 0; i < batch.length; i++) {
                    if (runToken !== token) return false;
                    const candidate = batch[i];
                    const currentCandidate = state.analyzedCandidateCount + i + 1;
                    slot.status.textContent = `最終判定 ${currentCandidate}/${batchEnd}`;
                    setStatus(`${slotLabel} (${slotIndex + 1}/${slotTotal}) · face-api ${currentCandidate}/${batchEnd}`, currentCandidate, batchEnd);
                    await seek(context, candidate.time);
                    const inferenceSource = drawInferenceFrame(context, FACE_API_INPUT_WIDTH);
                    const refinedMediaPipeResult = faceLandmarker.detect(inferenceSource);
                    const refinedBlendshapes = blendshapeMapFrom(refinedMediaPipeResult);
                    const refinedLandmarks = refinedMediaPipeResult.faceLandmarks[0];
                    const refinedGazeScore = refinedLandmarks && Object.keys(refinedBlendshapes).length
                        ? gazeScoreFrom(refinedLandmarks)
                        : candidate.gazeScore;
                    const detection = await faceapi
                        .detectSingleFace(inferenceSource, detectorOptions)
                        .withFaceLandmarks(true)
                        .withFaceExpressions();
                    if (!detection) continue;
                    state.finalFrames.push({
                        ...candidate,
                        gazeScore: refinedGazeScore,
                        expressions: EMOTIONS.reduce((memo, key) => ({ ...memo, [key]: detection.expressions[key] || 0 }), {}),
                        quality: qualityFrom(detection, inferenceSource)
                    });
                }

                state.analyzedCandidateCount = batchEnd;
                const effectiveMinEmotionScore = allowEmotionFallback && slot.emotion === "fearful"
                    ? Math.min(state.minEmotionScore, FEARFUL_FALLBACK_MIN_SCORE)
                    : state.minEmotionScore;
                slot.picks = await pickFrames(
                    context,
                    state.finalFrames.sort((a, b) => a.time - b.time),
                    slot.emotion,
                    state.targetCount,
                    effectiveMinEmotionScore,
                    runToken,
                    slotLabel
                );
                if (runToken !== token) return false;
                slot.status.textContent = resultStatusFor(slot);
                renderResults();
                return slot.picks.length > 0;
            };

            const analyzeSlot = async (context, slot, slotIndex, slotTotal, runToken) => {
                const { video: contextVideo, faceLandmarker } = context;
                const slotLabel = `${slot.emotion} ${slot.number}`;
                const frames = [];
                const samples = [];
                slot.picks = [];
                slot.status.textContent = "動画を読み込んでいます";
                await loadSlotVideo(context, slot);
                if (runToken !== token) return;

                await faceLandmarker.setOptions({ runningMode: "IMAGE" });
                await faceLandmarker.setOptions({ runningMode: "VIDEO" });
                context.mediaPipeTimestamp = 0;
                contextVideo.pause();
                const step = clamp(Number(interval.value) || 0.5, 0.1, 10);
                const total = Math.max(1, Math.ceil(contextVideo.duration / step));

                const analyzeCurrentFrame = (time) => {
                    const analyzedCount = samples.length + 1;
                    slot.status.textContent = `一次解析 ${analyzedCount}/${total}`;
                    setStatus(`${slotLabel} (${slotIndex + 1}/${slotTotal}) · MediaPipe ${analyzedCount}/${total}`, analyzedCount, total);
                    context.mediaPipeTimestamp += Math.max(1, Math.round(step * 1000));
                    const inferenceSource = drawInferenceFrame(context, MEDIAPIPE_INPUT_WIDTH);
                    const mediaPipeResult = faceLandmarker.detectForVideo(inferenceSource, context.mediaPipeTimestamp);
                    const blendshapes = blendshapeMapFrom(mediaPipeResult);
                    const mediaPipeLandmarks = mediaPipeResult.faceLandmarks[0];
                    const hasMediaPipeFace = Boolean(mediaPipeLandmarks) && Object.keys(blendshapes).length > 0;
                    const blinkLeft = blendshapes.eyeBlinkLeft || 0;
                    const blinkRight = blendshapes.eyeBlinkRight || 0;
                    const mediaPipeSample = {
                        time,
                        missing: !hasMediaPipeFace,
                        blinkLeft,
                        blinkRight,
                        blinkScore: Math.min(blinkLeft, blinkRight),
                        gazeScore: hasMediaPipeFace ? gazeScoreFrom(mediaPipeLandmarks) : null
                    };
                    if (hasMediaPipeFace) {
                        const frame = {
                            ...mediaPipeSample,
                            expressionProxy: expressionProxyFrom(blendshapes),
                            quality: qualityFromMediaPipe(mediaPipeLandmarks)
                        };
                        frames.push(frame);
                        samples.push(frame);
                    } else {
                        samples.push(mediaPipeSample);
                    }
                };

                if (typeof contextVideo.requestVideoFrameCallback === "function") {
                    await seek(context, 0);
                    contextVideo.playbackRate = QUALITY_PLAYBACK_RATE;
                    await new Promise((resolve, reject) => {
                        let nextSampleTime = 0;
                        let callbackId = 0;
                        let settled = false;
                        const cleanup = () => {
                            if (callbackId) contextVideo.cancelVideoFrameCallback(callbackId);
                            contextVideo.removeEventListener("error", onError);
                            contextVideo.removeEventListener("ended", finish);
                        };
                        const finish = () => {
                            if (settled) return;
                            settled = true;
                            cleanup();
                            contextVideo.pause();
                            contextVideo.playbackRate = 1;
                            resolve();
                        };
                        const onError = () => {
                            if (settled) return;
                            settled = true;
                            cleanup();
                            reject(new Error(`${slot.fileName}の再生に失敗しました`));
                        };
                        const onFrame = () => {
                            if (runToken !== token) {
                                finish();
                                return;
                            }
                            const time = Math.min(contextVideo.currentTime, Math.max(0, contextVideo.duration - 0.04));
                            if (time + 0.01 >= nextSampleTime) {
                                analyzeCurrentFrame(time);
                                nextSampleTime = time + step;
                            }
                            if (contextVideo.ended || contextVideo.currentTime >= contextVideo.duration - 0.04) {
                                finish();
                                return;
                            }
                            callbackId = contextVideo.requestVideoFrameCallback(onFrame);
                        };
                        contextVideo.addEventListener("error", onError, { once: true });
                        contextVideo.addEventListener("ended", finish, { once: true });
                        callbackId = contextVideo.requestVideoFrameCallback(onFrame);
                        contextVideo.play().catch(onError);
                    });
                } else {
                    for (let i = 0; i < total; i++) {
                        if (runToken !== token) return;
                        const time = Math.min(i * step, Math.max(0, contextVideo.duration - 0.04));
                        await seek(context, time);
                        analyzeCurrentFrame(time);
                    }
                }

                const blinkCount = markBlinkFrames(samples, frames, step);
                const targetCount = 1;
                const shortlistedFrames = shortlistFrames(frames, slot.emotion, step);
                const candidateBatchSize = Math.max(15, targetCount * 3);
                const minEmotionScore = clamp(Number(minScore.value) || 0, 0, 1);
                slot.frameCount = frames.length;
                slot.blinkCount = blinkCount;
                slot.analysisState = {
                    shortlistedFrames,
                    candidateBatchSize,
                    minEmotionScore,
                    targetCount,
                    finalFrames: [],
                    analyzedCandidateCount: 0
                };
                await analyzeNextCandidateBatch(
                    context,
                    slot,
                    slotIndex,
                    slotTotal,
                    runToken
                );
                if (runToken !== token) return;
                slot.status.textContent = resultStatusFor(slot);
                renderResults();
            };

            const analyzeFallbackSlot = async (context, slot, selectedSlots, runToken) => {
                slot.status.textContent = "追加候補を解析しています";
                await loadSlotVideo(context, slot);
                if (runToken !== token) return;
                await analyzeNextCandidateBatch(
                    context,
                    slot,
                    selectedSlots.indexOf(slot),
                    selectedSlots.length,
                    runToken,
                    true
                );
            };

            // 高負荷時の再生コールバックでは短い表情を飛ばすことがある。
            // 感情全体が0枚の場合だけ固定時刻へseekし、負荷に依存しない候補列を作り直す。
            const analyzeDeterministicRetrySlot = async (context, slot, selectedSlots, runToken) => {
                const { video: contextVideo, faceLandmarker } = context;
                const slotLabel = `${slot.emotion} ${slot.number}`;
                const frames = [];
                const samples = [];
                slot.status.textContent = "固定時刻で再走査しています";
                await loadSlotVideo(context, slot);
                if (runToken !== token) return;

                contextVideo.pause();
                await faceLandmarker.setOptions({ runningMode: "IMAGE" });
                const maxTime = Math.max(0, contextVideo.duration - 0.04);
                const coarseTotal = Math.max(1, Math.ceil(contextVideo.duration / DETERMINISTIC_RETRY_COARSE_STEP));
                const analyzedTimes = new Set();
                const analyzeFixedTime = async (time, phase, index, total) => {
                    if (runToken !== token) return;
                    const fixedTime = Math.round(clamp(time, 0, maxTime) * 1000) / 1000;
                    const timeKey = fixedTime.toFixed(3);
                    if (analyzedTimes.has(timeKey)) return;
                    analyzedTimes.add(timeKey);
                    slot.status.textContent = `固定時刻再走査 ${phase} ${index + 1}/${total}`;
                    setStatus(`${slotLabel} (${selectedSlots.indexOf(slot) + 1}/${selectedSlots.length}) · 固定時刻 ${phase} ${index + 1}/${total}`, index + 1, total);
                    await seek(context, fixedTime);
                    const inferenceSource = drawInferenceFrame(context, MEDIAPIPE_INPUT_WIDTH);
                    const mediaPipeResult = faceLandmarker.detect(inferenceSource);
                    const blendshapes = blendshapeMapFrom(mediaPipeResult);
                    const mediaPipeLandmarks = mediaPipeResult.faceLandmarks[0];
                    const hasMediaPipeFace = Boolean(mediaPipeLandmarks) && Object.keys(blendshapes).length > 0;
                    const sample = {
                        time: fixedTime,
                        missing: !hasMediaPipeFace,
                        blinkLeft: blendshapes.eyeBlinkLeft || 0,
                        blinkRight: blendshapes.eyeBlinkRight || 0,
                        blinkScore: Math.min(blendshapes.eyeBlinkLeft || 0, blendshapes.eyeBlinkRight || 0),
                        gazeScore: hasMediaPipeFace ? gazeScoreFrom(mediaPipeLandmarks) : null
                    };
                    samples.push(sample);
                    if (hasMediaPipeFace) {
                        frames.push({
                            ...sample,
                            expressionProxy: expressionProxyFrom(blendshapes),
                            quality: qualityFromMediaPipe(mediaPipeLandmarks)
                        });
                    }
                };

                for (let i = 0; i < coarseTotal; i++) {
                    await analyzeFixedTime(i * DETERMINISTIC_RETRY_COARSE_STEP, "1/2", i, coarseTotal);
                }

                const rankedCoarseFrames = [...frames]
                    .sort((a, b) =>
                        (b.expressionProxy[slot.emotion] || 0) - (a.expressionProxy[slot.emotion] || 0)
                    );
                const anchors = [
                    ...rankedCoarseFrames.slice(0, DETERMINISTIC_RETRY_ANCHORS),
                    ...rankedCoarseFrames
                        .filter((frame) =>
                            Number.isFinite(frame.gazeScore) && frame.gazeScore >= GAZE_SCORE_THRESHOLD
                        )
                        .slice(0, DETERMINISTIC_RETRY_ANCHORS)
                ].filter((frame, index, items) =>
                    items.findIndex((item) => item.time === frame.time) === index
                );
                const refinementTimes = anchors.flatMap((anchor) => {
                    const times = [];
                    for (
                        let offset = -DETERMINISTIC_RETRY_RADIUS;
                        offset <= DETERMINISTIC_RETRY_RADIUS + 0.001;
                        offset += DETERMINISTIC_RETRY_STEP
                    ) {
                        times.push(anchor.time + offset);
                    }
                    return times;
                });
                for (let i = 0; i < refinementTimes.length; i++) {
                    await analyzeFixedTime(refinementTimes[i], "2/2", i, refinementTimes.length);
                }

                samples.sort((a, b) => a.time - b.time);
                frames.sort((a, b) => a.time - b.time);
                const blinkCount = markBlinkFrames(samples, frames, DETERMINISTIC_RETRY_STEP);
                const targetCount = 1;
                const deterministicShortlist = shortlistFrames(frames, slot.emotion, DETERMINISTIC_RETRY_STEP);
                const gazePrioritizedFrames = [
                    ...deterministicShortlist.filter((frame) =>
                        Number.isFinite(frame.gazeScore) && frame.gazeScore >= GAZE_SCORE_THRESHOLD
                    ),
                    ...deterministicShortlist.filter((frame) =>
                        !Number.isFinite(frame.gazeScore) || frame.gazeScore < GAZE_SCORE_THRESHOLD
                    )
                ];
                slot.frameCount = frames.length;
                slot.blinkCount = blinkCount;
                slot.analysisState = {
                    shortlistedFrames: gazePrioritizedFrames.slice(0, DETERMINISTIC_RETRY_CANDIDATES),
                    candidateBatchSize: Math.max(15, targetCount * 3),
                    minEmotionScore: clamp(Number(minScore.value) || 0, 0, 1),
                    targetCount,
                    finalFrames: [],
                    analyzedCandidateCount: 0
                };

                while (
                    runToken === token &&
                    slot.picks.length === 0 &&
                    slot.analysisState.analyzedCandidateCount < slot.analysisState.shortlistedFrames.length
                ) {
                    await analyzeNextCandidateBatch(
                        context,
                        slot,
                        selectedSlots.indexOf(slot),
                        selectedSlots.length,
                        runToken,
                        true
                    );
                }
                if (runToken === token) {
                    slot.status.textContent = resultStatusFor(slot);
                    renderResults();
                }
            };

            const analyzeAll = async () => {
                if (analyzing) return false;
                const selectedSlots = slots.filter((slot) => slot.objectUrl);
                if (!selectedSlots.length) return false;
                const runToken = ++token;
                let completed = false;
                analyzing = true;
                updateAnalyzeState();
                downloadAll.disabled = true;
                empty.hidden = false;
                empty.textContent = "一括解析中です。";
                selectedSlots.forEach((slot) => {
                    slot.picks = [];
                    slot.frameCount = 0;
                    slot.blinkCount = 0;
                    slot.analysisState = null;
                    slot.status.textContent = "解析待ち";
                });
                renderResults();

                try {
                    await models;
                    let nextSlotIndex = 0;
                    const workers = analysisContexts
                        .slice(0, Math.min(ANALYSIS_CONCURRENCY, selectedSlots.length))
                        .map(async (context) => {
                            while (runToken === token) {
                                const slotIndex = nextSlotIndex++;
                                if (slotIndex >= selectedSlots.length) return;
                                const slot = selectedSlots[slotIndex];
                                try {
                                    await analyzeSlot(context, slot, slotIndex, selectedSlots.length, runToken);
                                } catch (error) {
                                    console.error(error);
                                    slot.status.textContent = "解析に失敗しました";
                                }
                            }
                    });
                    await Promise.all(workers);
                    if (runToken !== token) return;

                    let fallbackGroups = EMOTIONS
                        .map((emotion) => selectedSlots.filter((slot) => slot.emotion === emotion))
                        .filter((emotionSlots) =>
                            emotionSlots.length > 0 &&
                            emotionSlots.every((slot) => slot.picks.length === 0) &&
                            emotionSlots.some((slot) =>
                                slot.analysisState &&
                                slot.analysisState.analyzedCandidateCount < slot.analysisState.shortlistedFrames.length
                            )
                        );
                    while (fallbackGroups.length && runToken === token) {
                        const fallbackSlots = fallbackGroups.flatMap((emotionSlots) =>
                            emotionSlots.filter((slot) =>
                                slot.analysisState &&
                                slot.analysisState.analyzedCandidateCount < slot.analysisState.shortlistedFrames.length
                            )
                        );
                        let nextFallbackSlotIndex = 0;
                        const fallbackWorkers = analysisContexts
                            .slice(0, Math.min(ANALYSIS_CONCURRENCY, fallbackSlots.length))
                            .map(async (context) => {
                                while (runToken === token) {
                                    const fallbackSlotIndex = nextFallbackSlotIndex++;
                                    if (fallbackSlotIndex >= fallbackSlots.length) return;
                                    const slot = fallbackSlots[fallbackSlotIndex];
                                    const emotionSlots = fallbackGroups.find((group) => group.includes(slot));
                                    if (emotionSlots?.some((item) => item.picks.length > 0)) continue;
                                    try {
                                        await analyzeFallbackSlot(context, slot, selectedSlots, runToken);
                                    } catch (error) {
                                        console.error(error);
                                        slot.status.textContent = "追加解析に失敗しました";
                                        slot.analysisState.analyzedCandidateCount = slot.analysisState.shortlistedFrames.length;
                                    }
                                }
                            });
                        await Promise.all(fallbackWorkers);
                        if (runToken !== token) return;
                        fallbackGroups = fallbackGroups.filter((emotionSlots) =>
                            emotionSlots.every((slot) => slot.picks.length === 0) &&
                            emotionSlots.some((slot) =>
                                slot.analysisState &&
                                slot.analysisState.analyzedCandidateCount < slot.analysisState.shortlistedFrames.length
                            )
                        );
                    }

                    // 通常候補をすべて調べても感情全体が0枚なら、動画1→2→3の順に
                    // 固定時刻で再走査する。どれか1本で取得できた時点で残りは省略する。
                    const deterministicRetryGroups = EMOTIONS
                        .map((emotion) => selectedSlots.filter((slot) => slot.emotion === emotion))
                        .filter((emotionSlots) =>
                            emotionSlots.length > 0 && emotionSlots.every((slot) => slot.picks.length === 0)
                        );
                    for (const emotionSlots of deterministicRetryGroups) {
                        for (const slot of emotionSlots) {
                            if (runToken !== token || emotionSlots.some((item) => item.picks.length > 0)) break;
                            try {
                                await analyzeDeterministicRetrySlot(
                                    analysisContexts[0],
                                    slot,
                                    selectedSlots,
                                    runToken
                                );
                            } catch (error) {
                                console.error(error);
                                slot.status.textContent = "固定時刻再走査に失敗しました";
                            }
                        }
                    }

                    const totalFrames = selectedSlots.reduce((sum, slot) => sum + slot.frameCount, 0);
                    const totalBlinks = selectedSlots.reduce((sum, slot) => sum + slot.blinkCount, 0);
                    const totalImages = rankedPicksByEmotion().length;
                    empty.textContent = totalImages
                        ? ""
                        : "条件に合うフレームがありませんでした。min scoreを下げてください。";
                    setStatus(`${selectedSlots.length} videos / ${totalFrames} frames / ${totalBlinks} blinks / ${totalImages} images`, 0, 0);
                    completed = true;
                } finally {
                    analysisContexts.forEach((context) => {
                        context.video.pause();
                        context.video.removeAttribute("src");
                        context.video.load();
                    });
                    analyzing = false;
                    updateAnalyzeState();
                    renderResults();
                }
                return completed;
            };

            const loadAutomaticJob = (job) => {
                token += 1;
                slots.forEach((slot) => {
                    if (slot.objectUrl.startsWith("blob:")) URL.revokeObjectURL(slot.objectUrl);
                    slot.input.value = "";
                    slot.objectUrl = "";
                    slot.fileName = "";
                    slot.picks = [];
                    slot.frameCount = 0;
                    slot.blinkCount = 0;
                    slot.analysisState = null;
                    slot.status.textContent = "未選択";
                });

                let assignedCount = 0;
                for (const file of job.files || []) {
                    const slot = slots.find((item) =>
                        item.emotion === file.emotion && item.number === Number(file.slotNumber)
                    );
                    if (!slot || typeof file.url !== "string") continue;
                    slot.objectUrl = new URL(file.url, window.location.href).href;
                    slot.fileName = file.name || file.url.split("/").pop();
                    slot.status.textContent = slot.fileName;
                    assignedCount += 1;
                }
                renderResults();
                updateAnalyzeState();
                if (!assignedCount) throw new Error(`${job.zipName}に割り当て可能な動画がありません`);
                setStatus(`${job.zipName}を検出しました · ${assignedCount} videos`, 0, 0);
            };

            const acknowledgeAutomaticJob = async (job) => {
                const response = await fetch(AUTO_COMPLETE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: job.id })
                });
                if (!response.ok) throw new Error(`${job.zipName}の完了状態を保存できませんでした`);
            };

            const runAutomaticJobs = async () => {
                if (autoRunnerActive || analyzing || !modelsReady || !autoJobQueue.length) return;
                autoRunnerActive = true;
                try {
                    while (autoJobQueue.length) {
                        const job = autoJobQueue.shift();
                        try {
                            loadAutomaticJob(job);
                            const completed = await analyzeAll();
                            if (!completed) throw new Error(`${job.zipName}の自動解析が中断されました`);
                            const sourceFolderName = job.zipName.replace(/\.zip$/i, "");
                            await downloadTopPicksZip(`ac-${sourceFolderName}.zip`);
                            await acknowledgeAutomaticJob(job);
                        } catch (error) {
                            console.error(error);
                            queuedAutoJobIds.delete(job.id);
                            setStatus(error.message || `${job.zipName}の自動解析に失敗しました`, 0, 0);
                            break;
                        }
                    }
                } finally {
                    autoRunnerActive = false;
                }
            };

            const pollAutomaticJobs = async () => {
                if (autoPollBusy) return;
                autoPollBusy = true;
                try {
                    const response = await fetch(AUTO_JOBS_URL, { cache: "no-store" });
                    if (!response.ok) return;
                    const data = await response.json();
                    for (const job of data.jobs || []) {
                        if (!job?.id || queuedAutoJobIds.has(job.id)) continue;
                        queuedAutoJobIds.add(job.id);
                        autoJobQueue.push(job);
                    }
                    if (data.errors?.length && !analyzing && !autoJobQueue.length) {
                        setStatus(`ZIP読込エラー: ${data.errors[0].zipName} · ${data.errors[0].message}`, 0, 0);
                    }
                    void runAutomaticJobs();
                } catch (error) {
                    // 通常の静的サーバーで開いた場合は手動解析だけを継続する。
                } finally {
                    autoPollBusy = false;
                }
            };

            analyze.addEventListener("click", analyzeAll);
            downloadAll.addEventListener("click", async () => {
                downloadAll.disabled = true;
                try {
                    await downloadTopPicksZip("ac-manual-analysis.zip");
                } catch (error) {
                    console.error(error);
                    setStatus(error.message || "ZIPの作成に失敗しました", 0, 0);
                } finally {
                    downloadAll.disabled = rankedPicksByEmotion().length === 0;
                }
            });

            try {
                await models;
                modelsReady = true;
                setStatus("動画を選択してください（0 / 21）", 0, 0);
                updateAnalyzeState();
                void runAutomaticJobs();
            } catch (error) {
                console.error(error);
                setStatus("モデルの読み込みに失敗しました", 0, 0);
            }
            setInterval(pollAutomaticJobs, 3000);
            void pollAutomaticJobs();
        });
    </script>
</body>

</html>
