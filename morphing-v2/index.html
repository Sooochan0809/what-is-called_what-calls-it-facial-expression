<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自動表情モーフィング</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            background: #101316;
            font-family: system-ui, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100svh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #automationStatus {
            position: fixed;
            z-index: 10;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            max-width: min(760px, calc(100% - 32px));
            padding: 9px 14px;
            border-radius: 999px;
            color: #e8edf2;
            background: rgb(16 19 22 / 88%);
            box-shadow: 0 3px 18px #0008;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
            pointer-events: none;
        }

        #automationStatus[data-error="true"] {
            color: #ffd3d3;
            background: rgb(85 18 18 / 92%);
        }
    </style>
</head>

<body>
    <section class="screen" aria-label="モーフィング画面">
        <iframe id="morphing" src="morphing.html" title="モーフィング"></iframe>
    </section>
    <section class="screen" aria-label="解析・調整画面">
        <iframe id="expressionPicker" src="expression-picker.html" title="表情フレーム・クリップ抽出"></iframe>
    </section>
    <output id="automationStatus">自動処理を準備しています…</output>

    <script>
        const JOBS_URL = "/api/morphing/uploads/jobs";
        const COMPLETE_URL = "/api/morphing/uploads/complete";
        const POLL_INTERVAL = 1000;
        const INCOMPLETE_BATCH_WAIT = 75_000;
        const morphingFrame = document.querySelector("#morphing");
        const pickerFrame = document.querySelector("#expressionPicker");
        const status = document.querySelector("#automationStatus");
        const batches = [];
        const knownIds = new Set();
        const reportedErrors = new Set();
        let extracting = false;
        let playing = false;
        let morphBatch = null;

        const formatParts = (jobs) => jobs.map(({ part }) => `p${part}`).join(", ");
        const makeBatchName = (job) => `${job.modifiedAt}-${job.zipName.replace(/\.[^.]+$/, "")}`;
        function setStatus(message, error = false) {
            status.textContent = message;
            status.dataset.error = String(error);
        }

        function addJob(job) {
            if (!job?.id || knownIds.has(job.id) || !Number.isInteger(job.part)) return;
            knownIds.add(job.id);
            let batch = batches.at(-1);
            if (!batch || batch.sealed || (job.part === 1 && batch.jobs.length) || batch.parts.has(job.part)) {
                batch = {
                    jobs: [], parts: new Set(), lastAddedAt: 0, complete: false, sealed: false,
                    started: false, extractionDone: false, nextJob: 0, saved: [], name: makeBatchName(job),
                };
                batches.push(batch);
            }
            batch.jobs.push(job);
            batch.parts.add(job.part);
            batch.lastAddedAt = Date.now();
            if (job.part === 6) batch.complete = true;
        }
        const batchIsClosed = (batch) => batch.complete || batches.indexOf(batch) < batches.length - 1
            || Date.now() - batch.lastAddedAt >= INCOMPLETE_BATCH_WAIT;
        async function acknowledge(jobs) {
            const response = await fetch(COMPLETE_URL, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ids: jobs.map(({ id }) => id) }),
            });
            if (!response.ok) throw new Error("ZIPの処理済み状態を保存できません");
        }
        async function prepareBatch(batch) {
            if (!morphBatch) {
                morphingFrame.contentWindow.beginAutomaticMorphingBatch();
                morphBatch = batch;
            }
            if (morphBatch !== batch) return;
            for (const item of batch.saved.filter(({ prepared }) => !prepared)) {
                await morphingFrame.contentWindow.prepareAutomaticMorphingClip(item.source, item.part, item.rank);
                item.prepared = true;
            }
        }
        async function processPlayback() {
            if (playing) return;
            const batch = batches[0];
            if (!batch?.extractionDone) return;
            playing = true;
            try {
                if (batch.saved.length) {
                    setStatus(`${batch.saved.length}本の準備完了。最終位置合わせ後に再生します…`);
                    await prepareBatch(batch);
                    await morphingFrame.contentWindow.playPreparedMorphing();
                    setStatus("再生完了。次のセットを準備します…");
                } else setStatus("モーフィング可能な動画を抽出できませんでした。", true);
                await acknowledge(batch.jobs);
            } catch (error) {
                console.error(error); setStatus(`自動再生エラー: ${error.message || error}`, true);
                await acknowledge(batch.jobs).catch(console.error);
            } finally {
                if (morphBatch === batch) {
                    morphingFrame.contentWindow.clearAutomaticMorphing?.();
                    morphBatch = null;
                }
                if (batches[0] === batch) batches.shift();
                playing = false;
                setTimeout(processPlayback, 0);
                setTimeout(processExtraction, 0);
            }
        }
        async function processExtraction() {
            if (extracting) return;
            const batch = batches.find(({ extractionDone }) => !extractionDone);
            if (!batch) return;
            extracting = true;
            try {
                if (!batch.started) {
                    batch.options = await pickerFrame.contentWindow.beginAutomaticExpressionBatch();
                    const { emotion, minScore, analysisFps, mode, limit, padding, targetRatio } = batch.options;
                    batch.name += `-${emotion}-${minScore}-${analysisFps}-${mode}-${limit}-${padding}-${Math.round(targetRatio * 100)}`;
                    batch.started = true;
                }
                while (batch.nextJob < batch.jobs.length) {
                    const job = batch.jobs[batch.nextJob++];
                    setStatus(`${job.zipName} を先行解析中（${batch.nextJob}/${batch.jobs.length}）…`);
                    try {
                        const source = {
                            url: job.videoUrl,
                            name: decodeURIComponent(job.videoUrl.split("/").at(-1)),
                        };
                        const result = await pickerFrame.contentWindow.processAutomaticExpressionSource(
                            source, batch.name, batch.options,
                        );
                        for (let rank = 0; rank < result.sources.length; rank += 1) {
                            const item = { source: result.sources[rank], part: job.part, rank, prepared: false };
                            batch.saved.push(item);
                            if (!playing && (!morphBatch || morphBatch === batch) && batches[0] === batch) {
                                await prepareBatch(batch);
                            }
                        }
                    } catch (error) {
                        console.error(error);
                        setStatus(`${job.zipName} の先行処理に失敗: ${error.message || error}`, true);
                    }
                }
                if (!batchIsClosed(batch)) {
                    setStatus(`${formatParts(batch.jobs)} の先行処理完了・残りのZIPを待機中…`);
                    return;
                }
                batch.sealed = true;
                batch.extractionDone = true;
                pickerFrame.contentWindow.endAutomaticExpressionBatch?.();
                setStatus(`${formatParts(batch.jobs)} の抽出・保存完了。再生順を待っています…`);
                void processPlayback();
            } catch (error) {
                console.error(error); setStatus(`自動抽出エラー: ${error.message || error}`, true);
                pickerFrame.contentWindow.endAutomaticExpressionBatch?.();
                batch.sealed = true;
                batch.extractionDone = true;
                void processPlayback();
            } finally {
                extracting = false;
                if (batch.extractionDone && batches.some(({ extractionDone }) => !extractionDone)) {
                    setTimeout(processExtraction, 0);
                }
            }
        }
        async function poll() {
            try {
                const response = await fetch(JOBS_URL, { cache: "no-store" });
                if (!response.ok) throw new Error("専用サーバーに接続できません");
                const data = await response.json();
                (data.jobs || []).sort((left, right) => left.modifiedAt - right.modifiedAt).forEach(addJob);
                for (const error of data.errors || []) {
                    const key = `${error.zipName}:${error.message}`;
                    if (!reportedErrors.has(key)) { reportedErrors.add(key); console.error("ZIP読込エラー", error); }
                }
                void processExtraction();
                void processPlayback();
            } catch (error) {
                if (!extracting && !playing) setStatus(`${error.message}。morphing-v2/server.py で起動してください。`, true);
            }
        }

        window.addEventListener("load", async () => {
            setStatus("ZIPを待機しています…");
            await poll();
            setInterval(poll, POLL_INTERVAL);
        });
    </script>
</body>

</html>
