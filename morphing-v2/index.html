<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>動画モーフィングシーケンサー</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0b0a11;
            --previewArea: #1e1e29;
            --panel: #14141b;
            --ink: #192027;
            --muted: #747b84;
            --accent: #35c982;
            --line: #2d2d36;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", system-ui, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .42;
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) 224px;
            column-gap: 12px;
        }

        .previewArea {
            min-width: 0;
            min-height: 0;
            grid-row: 1;
            grid-column: 2;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--previewArea);
        }

        .stage {
            position: relative;
            width: auto;
            height: min(100%, calc(100dvh - 272px));
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 4px;
            background: #101316;
            box-shadow: 0 16px 44px rgba(24, 31, 38, .12);
        }

        #morphCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            min-width: 0;
            min-height: 0;
            grid-row: 1 / 3;
            grid-column: 1;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            border-right: 1px solid var(--line);
            background: var(--panel);
        }

        .clipList {
            min-height: 0;
            display: grid;
            align-content: start;
            gap: 10px;
            padding: 12px;
            overflow: auto;
        }

        .clipCard {
            position: relative;
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr);
            gap: 10px;
            padding: 9px;
            border: 1px solid var(--line);
            border-left: 4px solid var(--clip-color);
            border-radius: 9px;
            background: var(--previewArea);
            color: #fff;
            cursor: grab;
        }

        .clipCard.dragging {
            opacity: .45;
        }

        .clipThumb {
            width: 78px;
            height: 58px;
            object-fit: cover;
            border-radius: 5px;
            background: #15191e;
            pointer-events: none;
        }

        .clipBody {
            min-width: 0;
            display: grid;
            gap: 6px;
        }

        .clipTitle {
            overflow: hidden;
            padding-right: 24px;
            font-size: .78rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipMeta {
            color: var(--muted);
            font-size: .7rem;
            font-variant-numeric: tabular-nums;
        }

        .clipAnalysis {
            overflow: hidden;
            color: #8eddb7;
            font-size: .66rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipAnalysis.warning {
            color: #ffb46c;
        }

        .removeButton {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #8a9199;
            font-size: 17px;
            line-height: 1;
        }

        .sidebarFooter {
            display: grid;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .fileButton {
            position: relative;
            min-height: 42px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px dashed #abb2ba;
            border-radius: 9px;
            color: #4e565f;
            font-size: .82rem;
            cursor: pointer;
        }

        .fileButton input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .footerRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .status {
            color: var(--muted);
            font-size: .75rem;
        }

        .smallButton {
            height: 32px;
            padding: 0 11px;
            font-size: .74rem;
            color: var(--muted);
        }

        .alignmentPanel {
            display: grid;
            gap: 9px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--line);
            color: #c9cfd5;
        }

        .alignmentActions,
        .manualGrid {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .alignmentActions button {
            height: 30px;
            padding: 0 9px;
            color: #c9cfd5;
            font-size: .7rem;
        }

        .alignmentLabel {
            color: var(--muted);
            font-size: .68rem;
        }

        .manualGrid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .manualGrid label {
            display: grid;
            gap: 3px;
            color: var(--muted);
            font-size: .62rem;
        }

        .manualGrid input {
            width: 100%;
            min-width: 0;
            height: 27px;
            padding: 0 4px;
            border: 1px solid #454d56;
            border-radius: 5px;
            background: #24242e;
            color: #fff;
            font-size: .68rem;
        }

        .timelinePanel {
            min-width: 0;
            min-height: 0;
            grid-row: 2;
            grid-column: 2;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: var(--previewArea);
            border: 1px solid var(--line);
            color: #fff;
        }

        .transport {
            display: flex;
            min-height: 52px;
            flex-wrap: wrap;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--line);
        }

        .transport button {
            height: 34px;
            padding: 0 12px;
            border-color: #454d56;
            background: #2b323a;
            color: #fff;
            font-size: .78rem;
        }

        .transport .playButton {
            min-width: 48px;
            background: var(--accent);
            border-color: var(--accent);
            color: #10251b;
            font-weight: 700;
        }

        .timecode {
            min-width: 106px;
            font-size: .76rem;
            font-variant-numeric: tabular-nums;
            color: #c9cfd5;
        }

        .transportSpacer {
            flex: 1;
        }

        .operationStatus {
            color: #8eddb7;
            font-size: .68rem;
            white-space: nowrap;
        }

        .operationStatus.warning {
            color: #ffb46c;
        }

        .operationStatus:empty {
            display: none;
        }

        .transportSetting,
        .toggleLabel,
        .zoomLabel {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #bec5cc;
            font-size: .7rem;
            white-space: nowrap;
        }

        .toggleLabel input {
            accent-color: var(--accent);
        }

        .transportSetting input {
            width: 52px;
            height: 28px;
            padding: 0 5px;
            border: 1px solid #454d56;
            border-radius: 5px;
            background: #2b323a;
            color: #fff;
            font-size: .72rem;
        }

        .zoomLabel input {
            width: 90px;
            accent-color: var(--accent);
        }

        .timelineScroller {
            min-width: 0;
            min-height: 0;
            overflow: auto hidden;
            user-select: none;
        }

        .timeline {
            position: relative;
            min-width: 100%;
            height: 170px;
            margin-left: 12px;
            cursor: pointer;
            background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
            background-size: var(--second-width, 100px) 100%;
        }

        .rulerMark {
            position: absolute;
            top: 0;
            height: 24px;
            padding: 5px 0 0 5px;
            border-left: 1px solid #535b64;
            color: #929aa3;
            font-size: .62rem;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .timelineClip {
            position: absolute;
            height: 50px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 6px;
            background: var(--clip-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .2);
            color: #fff;
            cursor: pointer;
        }

        .timelineClip::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, .12), transparent 55%, rgba(0, 0, 0, .13));
        }

        .timelineClip span {
            position: relative;
            z-index: 1;
            display: block;
            padding: 7px 8px;
            overflow: hidden;
            font-size: .72rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timelineClip small {
            position: relative;
            z-index: 1;
            display: block;
            padding: 0 8px;
            font-size: .62rem;
            opacity: .78;
        }

        .morphRegion {
            position: absolute;
            top: 28px;
            height: 110px;
            z-index: 4;
            border: 1px solid rgba(83, 241, 162, .9);
            border-radius: 6px;
            background: repeating-linear-gradient(135deg, rgba(53, 201, 130, .32) 0 8px, rgba(53, 201, 130, .13) 8px 16px);
            cursor: pointer;
            pointer-events: auto;
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 8;
            width: 2px;
            background: #ff5e68;
            pointer-events: none;
        }

        .playhead::before {
            content: "";
            position: absolute;
            top: 0;
            left: -5px;
            border-top: 8px solid #ff5e68;
            border-right: 6px solid transparent;
            border-left: 6px solid transparent;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100dvh;
                grid-template-columns: 1fr;
                grid-template-rows: minmax(560px, 68dvh) auto 220px;
            }

            .previewArea {
                grid-row: 1;
                grid-column: 1;
                padding: 12px;
            }

            .stage {
                width: auto;
                height: min(100%, calc(68dvh - 24px));
            }

            .sidebar {
                grid-row: 2;
                grid-column: 1;
                min-height: 360px;
                border: 0;
                border-top: 1px solid var(--line);
            }

            .timelinePanel {
                grid-row: 3;
                grid-column: 1;
            }

            .clipList {
                max-height: 420px;
            }

            .zoomLabel {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <main class="previewArea">
            <div class="stage" aria-label="動画モーフィングプレビュー">
                <canvas id="morphCanvas" width="1080" height="1920"></canvas>
            </div>
        </main>
        <aside class="sidebar" aria-label="動画クリップ">
            <footer class="sidebarFooter">
                <div class="footerRow"><span class="status" id="status">0クリップ</span><button class="smallButton"
                        id="clearButton" type="button" disabled>すべて削除</button></div>
                <label class="fileButton">＋ 動画を追加<input id="fileInput" type="file" accept="video/*" multiple></label>
            </footer>
            <div class="alignmentPanel">
                <div class="alignmentActions">
                    <button id="autoAlignButton" type="button" disabled>自動位置合わせ</button>
                    <span class="alignmentLabel">全素材共通補正</span>
                </div>
                <div class="manualGrid">
                    <label>X<input class="manualInput" id="manualXInput" type="number" step="1" value="0"></label>
                    <label>Y<input class="manualInput" id="manualYInput" type="number" step="1" value="0"></label>
                    <label>倍率<input class="manualInput" id="manualScaleInput" type="number" min="0.5" max="2"
                            step="0.01" value="1"></label>
                </div>
            </div>
            <div class="clipList" id="clipList"></div>
        </aside>
        <section class="timelinePanel" aria-label="シーケンス">
            <div class="transport">
                <label class="transportSetting">重なり<input id="transitionInput" type="number" min="0" step="0.1"
                        value="1" inputmode="decimal">秒</label>
                <label class="transportSetting">速度<input id="playbackSpeedInput" type="number" min="0.1" max="2"
                        step="0.1" value="0.5" inputmode="decimal">倍</label>
                <label class="transportSetting">ループ<input id="loopCountInput" type="number" min="0" step="1" value="10"
                        inputmode="numeric">回</label>
                <label class="toggleLabel">モノクロ<input id="monoInput" type="checkbox" checked></label>
                <span class="operationStatus" id="operationStatus"></span>
                <div class="transportSpacer"></div>
                <button class="playButton" id="playButton" type="button" disabled>▶</button>
                <button id="rewindButton" type="button" disabled>先頭</button>
                <span class="timecode" id="timecode">00:00.00 / 00:00.00</span>
                <div class="transportSpacer"></div>
                <label class="zoomLabel">表示幅<input id="zoomInput" type="range" min="60" max="220" step="10"
                        value="110"></label>
                <button id="exportButton" type="button" disabled>書き出し</button>
            </div>
            <div class="timelineScroller" id="timelineScroller">
                <div class="timeline" id="timeline">
                    <div class="playhead" id="playhead"></div>
                </div>
            </div>
        </section>
    </div>
    <script type="module">
        import Delaunator from "https://cdn.jsdelivr.net/npm/delaunator@5/+esm";
        import {
            BufferTarget, CanvasSource, Output, Quality, WebMOutputFormat,
            getFirstEncodableVideoCodec,
        } from "https://cdn.jsdelivr.net/npm/mediabunny@1.62.0/+esm";

        const OUTPUT_WIDTH = 1080;
        const OUTPUT_HEIGHT = 1920;
        const OUTPUT_FPS = 60;
        const ANALYSIS_STEP = .2;
        const MAX_INTERPOLATION_GAP = .6;
        const FRAME_TOLERANCE = 1 / OUTPUT_FPS;
        const COLORS = ["#5278d8", "#d85d76", "#8b63d7", "#d98245", "#397f91", "#647c45"];
        const EYE_LEFT = [33, 133];
        const EYE_RIGHT = [362, 263];
        const MEDIAPIPE_VERSION = "1.1.0";
        const TASKS_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}`;
        const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";

        const byId = (id) => document.getElementById(id);
        const canvas = byId("morphCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const fileInput = byId("fileInput");
        const clipList = byId("clipList");
        const status = byId("status");
        const clearButton = byId("clearButton");
        const autoAlignButton = byId("autoAlignButton");
        const manualInputs = {
            x: byId("manualXInput"), y: byId("manualYInput"),
            scale: byId("manualScaleInput"),
        };
        const playButton = byId("playButton");
        const rewindButton = byId("rewindButton");
        const timecode = byId("timecode");
        const transitionInput = byId("transitionInput");
        const playbackSpeedInput = byId("playbackSpeedInput");
        const loopCountInput = byId("loopCountInput");
        const timeline = byId("timeline");
        const timelineScroller = byId("timelineScroller");
        const playhead = byId("playhead");
        const monoInput = byId("monoInput");
        const zoomInput = byId("zoomInput");
        const operationStatus = byId("operationStatus");
        const exportButton = byId("exportButton");
        const warpCanvases = [document.createElement("canvas"), document.createElement("canvas")];
        warpCanvases.forEach((item) => { item.width = OUTPUT_WIDTH; item.height = OUTPUT_HEIGHT; });

        let clips = [];
        let schedule = [];
        let currentTime = 0;
        let completedLoops = 0;
        let playing = false;
        let previousFrameAt = 0;
        let draggedId = null;
        let sharedEyeTarget = null;
        let globalManual = { scale: 1, rotation: 0, x: 0, y: 0 };
        let faceLandmarkerPromise = null;
        let analysisRunning = false;
        let exportProfile = null;
        let exportProbeDone = false;
        let exportJob = null;
        let previewGeneration = 0;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const smoothstep = (value) => value * value * (3 - 2 * value);
        const pxPerSecond = () => Number(zoomInput.value);
        const totalDuration = () => schedule.at(-1)?.end || 0;
        const isExporting = () => Boolean(exportJob);
        const playbackSpeed = () => clamp(Number(playbackSpeedInput.value) || 1, .1, 2);
        const sourceOverlap = () => Math.max(.01, Number(transitionInput.value) || 1);
        const loopCount = () => Math.max(0, Math.floor(Number(loopCountInput.value) || 0));
        const identityTransform = () => ({ scale: 1, rotation: 0, x: 0, y: 0 });
        function formatTime(seconds) {
            const safe = Math.max(0, Number.isFinite(seconds) ? seconds : 0);
            const minutes = Math.floor(safe / 60);
            const rest = safe - minutes * 60;
            return `${String(minutes).padStart(2, "0")}:${rest.toFixed(2).padStart(5, "0")}`;
        }
        function median(values) {
            const sorted = [...values].sort((a, b) => a - b);
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
        }
        function createCanvas() {
            const result = document.createElement("canvas");
            result.width = OUTPUT_WIDTH; result.height = OUTPUT_HEIGHT;
            return result;
        }
        function loadVideo(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const video = document.createElement("video");
                video.src = url; video.preload = "auto"; video.muted = true; video.playsInline = true;
                video.addEventListener("loadedmetadata", () => {
                    if (!Number.isFinite(video.duration) || video.duration <= 0) {
                        URL.revokeObjectURL(url); reject(new Error("動画の長さを取得できません")); return;
                    }
                    resolve({
                        id: crypto.randomUUID(), name: file.name, url, video, duration: video.duration,
                        rawCanvas: createCanvas(), sourceCanvas: createCanvas(),
                        analysis: { status: "pending", progress: 0, samples: [], gaps: [], error: "" },
                        representative: null, auto: identityTransform(),
                    });
                }, { once: true });
                video.addEventListener("error", () => {
                    URL.revokeObjectURL(url); reject(new Error("動画を読み込めません"));
                }, { once: true });
            });
        }
        function waitForVideoFrame(video, time) {
            const target = clamp(time, 0, Math.max(0, video.duration - 1 / OUTPUT_FPS));
            return new Promise((resolve, reject) => {
                let finished = false;
                const timeout = setTimeout(() => done(new Error("動画フレームの取得がタイムアウトしました")), 8000);
                const cleanup = () => {
                    clearTimeout(timeout);
                    video.removeEventListener("seeked", frameReady);
                    video.removeEventListener("error", failed);
                };
                const done = (error) => {
                    if (finished) return;
                    finished = true; cleanup(); error ? reject(error) : resolve();
                };
                const frameReady = () => {
                    if (video.requestVideoFrameCallback) {
                        const fallback = setTimeout(() => done(), 250);
                        video.requestVideoFrameCallback(() => { clearTimeout(fallback); done(); });
                    } else requestAnimationFrame(() => done());
                };
                const failed = () => done(new Error("動画フレームを取得できません"));
                video.addEventListener("error", failed, { once: true });
                if (Math.abs(video.currentTime - target) < .0005 && video.readyState >= 2) frameReady();
                else {
                    video.addEventListener("seeked", frameReady, { once: true });
                    video.currentTime = target;
                }
            });
        }
        function drawBaseFrame(clip) {
            const target = clip.rawCanvas;
            const targetCtx = target.getContext("2d", { alpha: false });
            const { video } = clip;
            if (video.readyState < 2) return target;
            const videoRatio = video.videoWidth / video.videoHeight;
            const outputRatio = OUTPUT_WIDTH / OUTPUT_HEIGHT;
            let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;
            if (videoRatio > outputRatio) { sw = sh * outputRatio; sx = (video.videoWidth - sw) / 2; }
            else { sh = sw / outputRatio; sy = (video.videoHeight - sh) / 2; }
            targetCtx.fillStyle = "#000"; targetCtx.fillRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
            targetCtx.drawImage(video, sx, sy, sw, sh, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
            return target;
        }
        async function getFaceLandmarker() {
            if (!faceLandmarkerPromise) {
                faceLandmarkerPromise = import(TASKS_URL).then(async ({ FaceLandmarker, FilesetResolver }) => {
                    const vision = await FilesetResolver.forVisionTasks(`${TASKS_URL}/wasm`);
                    return FaceLandmarker.createFromOptions(vision, {
                        baseOptions: { modelAssetPath: MODEL_URL }, runningMode: "IMAGE", numFaces: 1,
                    });
                });
            }
            return faceLandmarkerPromise;
        }
        function eyeMetrics(points) {
            const center = (indices) => [
                (points[indices[0]][0] + points[indices[1]][0]) / 2,
                (points[indices[0]][1] + points[indices[1]][1]) / 2,
            ];
            const left = center(EYE_LEFT), right = center(EYE_RIGHT);
            const dx = right[0] - left[0], dy = right[1] - left[1];
            return {
                x: (left[0] + right[0]) / 2, y: (left[1] + right[1]) / 2,
                distance: Math.hypot(dx, dy), angle: Math.atan2(dy, dx),
            };
        }
        function representativeMetrics(samples) {
            const values = samples.filter((sample) => sample.points).map((sample) => eyeMetrics(sample.points));
            if (!values.length) return null;
            return {
                x: median(values.map((item) => item.x)), y: median(values.map((item) => item.y)),
                distance: median(values.map((item) => item.distance)), angle: median(values.map((item) => item.angle)),
            };
        }
        function missingGaps(samples) {
            const gaps = [];
            for (let index = 0; index < samples.length;) {
                if (samples[index].points) { index += 1; continue; }
                const first = index;
                while (index < samples.length && !samples[index].points) index += 1;
                const start = samples[Math.max(0, first - 1)].time;
                const end = samples[Math.min(samples.length - 1, index)].time;
                gaps.push({ start, end, duration: end - start });
            }
            return gaps;
        }
        function updateClipAnalysisUI(clip) {
            const element = clipList.querySelector(`[data-clip-id="${clip.id}"] .clipAnalysis`);
            if (!element) return;
            element.textContent = analysisLabel(clip);
            element.classList.toggle("warning", clip.analysis.status === "failed" || fallbackGaps(clip).length > 0);
        }
        function analysisLabel(clip) {

                    const loopTime = outputTime % loopDuration;
                    const state = getActiveState(loopTime);
                    await Promise.all(state.items.map((item) => waitForVideoFrame(item.clip.video, item.sourceTime)));
                    renderState(state);
                    await source.add(outputTime, 1 / OUTPUT_FPS, { keyFrame: frame % (OUTPUT_FPS * 2) === 0 });
                    currentTime = loopTime; completedLoops = Math.floor(outputTime / loopDuration);
                    if (frame % 6 === 0 || frame === totalFrames - 1) {
                        exportJob.message = `${frame + 1} / ${totalFrames}フレーム (${Math.round((frame + 1) / totalFrames * 100)}%)`;
                        operationStatus.textContent = exportJob.message; updatePlayhead();
                    }
                }
                await output.finalize();
                const blob = new Blob([target.buffer], { type: await output.getMimeType() });
                const url = URL.createObjectURL(blob), anchor = document.createElement("a");
                anchor.href = url; anchor.download = `morph-sequence-${new Date().toISOString().replaceAll(":", "-")}.${exportProfile.extension}`;
                anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (error) {
                if (!exportJob.cancelled) {
                    console.error(error); alert(`書き出しに失敗しました: ${error.message || error}`);
                    if (["pending", "started"].includes(output.state)) await output.cancel();
                }
            } finally {
                exportJob = null; currentTime = resumeTime; completedLoops = 0;
                renderClipList(); updateControls(); setCurrentTime(resumeTime);
            }
        }

        fileInput.addEventListener("change", async (event) => { await addFiles(event.target.files); event.target.value = ""; });
        playButton.addEventListener("click", () => setPlaying(!playing));
        rewindButton.addEventListener("click", () => setCurrentTime(0));
        autoAlignButton.addEventListener("click", autoAlignClips);
        Object.entries(manualInputs).forEach(([key, input]) => input.addEventListener("input", () => {
            globalManual[key] = key === "scale"
                ? clamp(Number(input.value) || 1, .5, 2)
                : Number(input.value) || 0;
            setCurrentTime(currentTime);
        }));
        transitionInput.addEventListener("change", () => {
            transitionInput.value = sourceOverlap().toFixed(2); buildSchedule(); renderTimeline(); updateControls(); setCurrentTime(currentTime);
        });
        playbackSpeedInput.addEventListener("change", () => {
            const progress = currentTime / (totalDuration() || 1);
            playbackSpeedInput.value = playbackSpeed().toFixed(1); buildSchedule(); currentTime = progress * totalDuration();
            renderClipList(); renderTimeline(); updateControls(); setCurrentTime(currentTime);
        });
        loopCountInput.addEventListener("change", () => {
            loopCountInput.value = String(loopCount()); completedLoops = 0; updateControls();
        });
        clearButton.addEventListener("click", clearClips);
        monoInput.addEventListener("change", () => renderFrame());
        zoomInput.addEventListener("input", renderTimeline);
        exportButton.addEventListener("click", startExport);
        const seekFromPointer = (event) => {
            const rect = timeline.getBoundingClientRect(); setCurrentTime((event.clientX - rect.left) / pxPerSecond());
        };
        timeline.addEventListener("pointerdown", (event) => {
            if (!clips.length || event.button !== 0 || analysisRunning || isExporting()) return;
            timeline.setPointerCapture(event.pointerId); seekFromPointer(event);
        });
        timeline.addEventListener("pointermove", (event) => {
            if (timeline.hasPointerCapture(event.pointerId)) seekFromPointer(event);
        });
        window.addEventListener("resize", renderTimeline);
        window.addEventListener("beforeunload", () => clips.forEach((clip) => URL.revokeObjectURL(clip.url)));

        const sixClips = Array.from({ length: 6 }, () => ({ duration: 2 }));
        const scheduleCheck = calculateSchedule(sixClips, 1, .5);
        console.assert(scheduleCheck.at(-1).end === 12, "2秒×6本・0.5倍・接続2秒は1周12秒です");
        console.assert(Math.round(scheduleCheck.at(-1).end * 3 * OUTPUT_FPS) === 2160, "3周は36秒・2160フレームです");
        console.assert(smoothstep(.5) === .5 && smoothstep(0) === 0 && smoothstep(1) === 1, "smoothstepが不正です");
        const fixed = { scale: 1.1, rotation: .1, x: 3, y: 4 };
        console.assert(JSON.stringify(transformPoint([10, 20], fixed)) === JSON.stringify(transformPoint([10, 20], fixed)), "固定位置合わせが変化しています");

        buildSchedule(); renderAll(); void probeExportSupport();
    </script>
