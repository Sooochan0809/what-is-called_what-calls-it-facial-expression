<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>動画モーフィングシーケンサー</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0b0a11;
            --previewArea: #1e1e29;
            --panel: #14141b;
            --ink: #192027;
            --muted: #747b84;
            --accent: #35c982;
            --line: #2d2d36;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: "Yu Gothic Medium", "Yu Gothic", system-ui, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink);
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .42;
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) 224px;
            column-gap: 12px;
        }

        .previewArea {
            min-width: 0;
            min-height: 0;
            grid-row: 1;
            grid-column: 2;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: var(--previewArea);
        }

        .stage {
            position: relative;
            width: auto;
            height: min(100%, calc(100dvh - 272px));
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 4px;
            background: #101316;
            box-shadow: 0 16px 44px rgba(24, 31, 38, .12);
        }

        #morphCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #morphCanvas.monochrome {
            filter: grayscale(1);
        }

        .stageBadge {
            position: absolute;
            top: 12px;
            left: 12px;
            max-width: calc(100% - 24px);
            padding: 6px 9px;
            overflow: hidden;
            border-radius: 6px;
            background: rgba(10, 13, 16, .72);
            color: #fff;
            font-size: .76rem;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: none;
        }

        .stageBadge:empty {
            display: none;
        }

        .sidebar {
            min-width: 0;
            min-height: 0;
            grid-row: 1 / 3;
            grid-column: 1;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            border-right: 1px solid var(--line);
            background: var(--panel);
        }

        .clipList {
            min-height: 0;
            display: grid;
            align-content: start;
            gap: 10px;
            padding: 12px;
            overflow: auto;
        }

        .clipCard {
            position: relative;
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr);
            gap: 10px;
            padding: 9px;
            border: 1px solid var(--line);
            border-left: 4px solid var(--clip-color);
            border-radius: 9px;
            background: #fff;
            cursor: grab;
        }

        .clipCard.dragging {
            opacity: .45;
        }

        .clipThumb {
            width: 78px;
            height: 58px;
            object-fit: cover;
            border-radius: 5px;
            background: #15191e;
            pointer-events: none;
        }

        .clipBody {
            min-width: 0;
            display: grid;
            gap: 6px;
        }

        .clipTitle {
            overflow: hidden;
            padding-right: 24px;
            font-size: .78rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clipMeta {
            color: var(--muted);
            font-size: .7rem;
            font-variant-numeric: tabular-nums;
        }

        .transitionControl {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) 48px;
            gap: 6px;
            align-items: center;
            color: var(--muted);
            font-size: .68rem;
        }

        .transitionControl input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .transitionControl input[type="number"] {
            width: 48px;
            height: 25px;
            padding: 0 4px;
            border: 1px solid var(--line);
            border-radius: 5px;
            color: var(--ink);
            font-size: .72rem;
            font-variant-numeric: tabular-nums;
        }

        .removeButton {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #8a9199;
            font-size: 17px;
            line-height: 1;
        }

        .sidebarFooter {
            display: grid;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .fileButton {
            position: relative;
            min-height: 42px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px dashed #abb2ba;
            border-radius: 9px;
            color: #4e565f;
            font-size: .82rem;
            cursor: pointer;
        }

        .fileButton input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .footerRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .status {
            color: var(--muted);
            font-size: .75rem;
        }

        .smallButton {
            height: 32px;
            padding: 0 11px;
            font-size: .74rem;
            color: var(--muted);
        }

        .timelinePanel {
            min-width: 0;
            min-height: 0;
            grid-row: 2;
            grid-column: 2;
            display: grid;
            grid-template-rows: 52px minmax(0, 1fr);
            background: var(--previewArea);
            border: 1px solid var(--line);
            color: #fff;
        }

        .transport {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--line);
        }

        .transport button {
            height: 34px;
            padding: 0 12px;
            border-color: #454d56;
            background: #2b323a;
            color: #fff;
            font-size: .78rem;
        }

        .transport .playButton {
            min-width: 74px;
            background: var(--accent);
            border-color: var(--accent);
            color: #10251b;
            font-weight: 700;
        }

        .timecode {
            min-width: 106px;
            font-size: .76rem;
            font-variant-numeric: tabular-nums;
            color: #c9cfd5;
        }

        .transportSpacer {
            flex: 1;
        }

        .toggleLabel,
        .zoomLabel {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #bec5cc;
            font-size: .7rem;
            white-space: nowrap;
        }

        .toggleLabel input {
            accent-color: var(--accent);
        }

        .zoomLabel input {
            width: 90px;
            accent-color: var(--accent);
        }

        .timelineScroller {
            min-width: 0;
            min-height: 0;
            overflow: auto hidden;
            user-select: none;
        }

        .timeline {
            position: relative;
            min-width: 100%;
            height: 170px;
            margin-left: 12px;
            cursor: pointer;
            background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
            background-size: var(--second-width, 100px) 100%;
        }

        .rulerMark {
            position: absolute;
            top: 0;
            height: 24px;
            padding: 5px 0 0 5px;
            border-left: 1px solid #535b64;
            color: #929aa3;
            font-size: .62rem;
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        .timelineClip {
            position: absolute;
            height: 50px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 6px;
            background: var(--clip-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .2);
            color: #fff;
            cursor: pointer;
        }

        .timelineClip::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, .12), transparent 55%, rgba(0, 0, 0, .13));
        }

        .timelineClip span {
            position: relative;
            z-index: 1;
            display: block;
            padding: 7px 8px;
            overflow: hidden;
            font-size: .72rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timelineClip small {
            position: relative;
            z-index: 1;
            display: block;
            padding: 0 8px;
            font-size: .62rem;
            opacity: .78;
        }

        .morphRegion {
            position: absolute;
            top: 28px;
            height: 110px;
            z-index: 4;
            display: grid;
            place-items: end center;
            border: 1px solid rgba(83, 241, 162, .9);
            border-radius: 6px;
            background: repeating-linear-gradient(135deg, rgba(53, 201, 130, .32) 0 8px, rgba(53, 201, 130, .13) 8px 16px);
            color: #baffda;
            cursor: pointer;
            pointer-events: auto;
        }

        .morphRegion span {
            max-width: 100%;
            margin-bottom: 5px;
            padding: 2px 5px;
            overflow: hidden;
            border-radius: 4px;
            background: rgba(9, 30, 20, .78);
            font-size: .6rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 8;
            width: 2px;
            background: #ff5e68;
            pointer-events: none;
        }

        .playhead::before {
            content: "";
            position: absolute;
            top: 0;
            left: -5px;
            border-top: 8px solid #ff5e68;
            border-right: 6px solid transparent;
            border-left: 6px solid transparent;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100dvh;
                grid-template-columns: 1fr;
                grid-template-rows: minmax(560px, 68dvh) auto 220px;
            }

            .previewArea {
                grid-row: 1;
                grid-column: 1;
                padding: 12px;
            }

            .stage {
                width: auto;
                height: min(100%, calc(68dvh - 24px));
            }

            .sidebar {
                grid-row: 2;
                grid-column: 1;
                min-height: 360px;
                border: 0;
                border-top: 1px solid var(--line);
            }

            .timelinePanel {
                grid-row: 3;
                grid-column: 1;
            }

            .clipList {
                max-height: 420px;
            }

            .zoomLabel {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <main class="previewArea">
            <div class="stage" aria-label="動画モーフィングプレビュー">
                <canvas id="morphCanvas" width="1080" height="1920"></canvas>
                <div class="stageBadge" id="stageBadge"></div>
            </div>
        </main>
        <aside class="sidebar" aria-label="動画クリップ">
            <footer class="sidebarFooter">
                <div class="footerRow"><span class="status" id="status">0クリップ</span><button class="smallButton"
                        id="clearButton" type="button" disabled>すべて削除</button></div>
                <label class="fileButton">＋ 動画を追加<input id="fileInput" type="file" accept="video/*" multiple></label>
            </footer>
            <div class="clipList" id="clipList"></div>
        </aside>
        <section class="timelinePanel" aria-label="シーケンス">
            <div class="transport">
                <button class="playButton" id="playButton" type="button" disabled>▶ 再生</button>
                <button id="rewindButton" type="button" disabled>先頭へ</button>
                <span class="timecode" id="timecode">00:00.00 / 00:00.00</span>
                <div class="transportSpacer"></div>
                <label class="toggleLabel"><input id="monoInput" type="checkbox">モノクロ</label>
                <label class="zoomLabel">表示幅<input id="zoomInput" type="range" min="60" max="220" step="10"
                        value="110"></label>
                <button id="exportButton" type="button" disabled>WebM書出し</button>
            </div>
            <div class="timelineScroller" id="timelineScroller">
                <div class="timeline" id="timeline">
                    <div class="playhead" id="playhead"></div>
                </div>
            </div>
        </section>
    </div>
    <script type="module">
        import Delaunator from "https://cdn.jsdelivr.net/npm/delaunator@5/+esm";

        const OUTPUT_WIDTH = 1080;
        const OUTPUT_HEIGHT = 1920;
        const WIDTH = 540;
        const HEIGHT = 960;
        const DEFAULT_TRANSITION = 1;
        const DETECTION_INTERVAL = 90;
        const COLORS = ["#5278d8", "#d85d76", "#8b63d7", "#d98245", "#397f91", "#647c45"];
        const MEDIAPIPE_VERSION = "1.1.0";
        const TASKS_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}`;
        const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task";

        const byId = (id) => document.getElementById(id);
        const canvas = byId("morphCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const stageBadge = byId("stageBadge");
        const fileInput = byId("fileInput");
        const clipList = byId("clipList");
        const status = byId("status");
        const clearButton = byId("clearButton");
        const playButton = byId("playButton");
        const rewindButton = byId("rewindButton");
        const timecode = byId("timecode");
        const timeline = byId("timeline");
        const timelineScroller = byId("timelineScroller");
        const playhead = byId("playhead");
        const monoInput = byId("monoInput");
        const zoomInput = byId("zoomInput");
        const exportButton = byId("exportButton");

        let clips = [];
        let schedule = [];
        let currentTime = 0;
        let playing = false;
        let previousFrameAt = 0;
        let draggedId = null;
        let faceLandmarkerPromise = null;
        let recorder = null;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const pxPerSecond = () => Number(zoomInput.value);
        const totalDuration = () => schedule.at(-1)?.end || 0;
        const isExporting = () => recorder?.state === "recording";
        function formatTime(seconds) {
            const safe = Math.max(0, Number.isFinite(seconds) ? seconds : 0);
            const minutes = Math.floor(safe / 60);
            const rest = safe - minutes * 60;
            return `${String(minutes).padStart(2, "0")}:${rest.toFixed(2).padStart(5, "0")}`;
        }
        function loadVideo(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const video = document.createElement("video");
                video.src = url;
                video.preload = "auto";
                video.muted = true;
                video.playsInline = true;
                video.addEventListener("loadedmetadata", () => {
                    if (!Number.isFinite(video.duration) || video.duration <= 0) {
                        URL.revokeObjectURL(url);
                        reject(new Error("動画の長さを取得できません"));
                        return;
                    }
                    resolve({
                        id: crypto.randomUUID(), name: file.name, url, video, duration: video.duration,
                        transition: DEFAULT_TRANSITION, sourceCanvas: document.createElement("canvas"),
                        points: null, lastDetectionAt: -Infinity,
                    });
                }, { once: true });
                video.addEventListener("error", () => { URL.revokeObjectURL(url); reject(new Error("動画を読み込めません")); }, { once: true });
            });
        }
        async function addFiles(fileList) {
            const files = [...fileList].filter((file) => file.type.startsWith("video/"));
            if (!files.length) return;
            const results = await Promise.allSettled(files.map(loadVideo));
            const added = results.filter((result) => result.status === "fulfilled").map((result) => result.value);
            if (added.length !== files.length) alert("読み込めない動画がありました。ブラウザで再生できるMP4、WebMなどを使用してください。");
            clips.push(...added);
            normalizeTransitions();
            currentTime = 0;
            renderAll();
            seekVideos(0, true);
            void getFaceLandmarker();
        }
        function maxTransition(index) {
            if (!index) return 0;
            return Math.max(.1, Math.min(clips[index - 1].duration, clips[index].duration) / 2);
        }
        function normalizeTransitions() {
            clips.forEach((clip, index) => {
                clip.transition = index === 0 ? 0 : clamp(clip.transition || DEFAULT_TRANSITION, .1, maxTransition(index));
            });
            buildSchedule();
        }
        function calculateSchedule(clipList) {
            let previousEnd = 0;
            return clipList.map((clip, index) => {
                const start = index ? previousEnd - clip.transition : 0;
                const end = start + clip.duration;
                previousEnd = end;
                return { clip, start, end };
            });
        }
        function buildSchedule() {
            schedule = calculateSchedule(clips);
            currentTime = clamp(currentTime, 0, totalDuration());
        }
        function getActiveState(time) {
            const active = schedule.filter((item) => time >= item.start && time <= item.end + .001);
            if (!active.length) return { items: [], progress: 0 };
            if (active.length === 1) return { items: active, progress: 0 };
            const from = active[0];
            const to = active[1];
            const duration = Math.max(.001, from.end - to.start);
            return { items: [from, to], progress: clamp((time - to.start) / duration, 0, 1) };
        }
        function seekVideos(time, force = false) {
            const activeIds = new Set(getActiveState(time).items.map((item) => item.clip.id));
            schedule.forEach((item) => {
                const localTime = clamp(time - item.start, 0, Math.max(0, item.clip.duration - .001));
                const video = item.clip.video;
                if (activeIds.has(item.clip.id)) {
                    if (force || Math.abs(video.currentTime - localTime) > .18) video.currentTime = localTime;
                    if (playing && video.paused) video.play().catch(() => { });
                } else if (!video.paused) video.pause();
            });
        }
        async function getFaceLandmarker() {
            if (!faceLandmarkerPromise) {
                faceLandmarkerPromise = import(TASKS_URL).then(async ({ FaceLandmarker, FilesetResolver }) => {
                    const vision = await FilesetResolver.forVisionTasks(`${TASKS_URL}/wasm`);
                    return FaceLandmarker.createFromOptions(vision, {
                        baseOptions: { modelAssetPath: MODEL_URL }, runningMode: "IMAGE", numFaces: 1,
                    });
                }).catch((error) => {
                    console.warn("顔検出を初期化できませんでした。クロスフェードで再生します。", error);
                    faceLandmarkerPromise = null;
                    return null;
                });
            }
            return faceLandmarkerPromise;
        }
        function drawVideoToSource(clip) {
            const source = clip.sourceCanvas;
            if (source.width !== WIDTH) source.width = WIDTH;
            if (source.height !== HEIGHT) source.height = HEIGHT;
            const sourceCtx = source.getContext("2d", { alpha: false });
            sourceCtx.fillStyle = "#000";
            sourceCtx.fillRect(0, 0, WIDTH, HEIGHT);
            if (clip.video.readyState < 2) return source;
            const videoRatio = clip.video.videoWidth / clip.video.videoHeight;
            const outputRatio = WIDTH / HEIGHT;
            let sx = 0, sy = 0, sw = clip.video.videoWidth, sh = clip.video.videoHeight;
            if (videoRatio > outputRatio) { sw = sh * outputRatio; sx = (clip.video.videoWidth - sw) / 2; }
            else { sh = sw / outputRatio; sy = (clip.video.videoHeight - sh) / 2; }
            sourceCtx.drawImage(clip.video, sx, sy, sw, sh, 0, 0, WIDTH, HEIGHT);
            return source;
        }
        async function detectPoints(clip, now) {
            if (now - clip.lastDetectionAt < DETECTION_INTERVAL) return clip.points;
            clip.lastDetectionAt = now;
            const detector = await getFaceLandmarker();
            if (!detector) return null;
            try {
                const landmarks = detector.detect(clip.sourceCanvas).faceLandmarks?.[0];
                if (!landmarks) return clip.points;
                clip.points = landmarks.map((point) => [point.x * WIDTH, point.y * HEIGHT]);
                clip.points.push([0, 0], [WIDTH - 1, 0], [WIDTH - 1, HEIGHT - 1], [0, HEIGHT - 1]);
            } catch (error) { console.warn("顔検出をスキップしました", error); }
            return clip.points;
        }
        function expandTriangle(triangle, amount = .7) {
            const centerX = (triangle[0][0] + triangle[1][0] + triangle[2][0]) / 3;
            const centerY = (triangle[0][1] + triangle[1][1] + triangle[2][1]) / 3;
            return triangle.map(([x, y]) => {
                const dx = x - centerX, dy = y - centerY, length = Math.hypot(dx, dy) || 1;
                return [x + dx / length * amount, y + dy / length * amount];
            });
        }
        function drawTriangle(target, image, sourceTriangle, destinationTriangle) {
            const [s0, s1, s2] = sourceTriangle;
            const [d0, d1, d2] = destinationTriangle;
            const denominator = s0[0] * (s1[1] - s2[1]) + s1[0] * (s2[1] - s0[1]) + s2[0] * (s0[1] - s1[1]);
            if (Math.abs(denominator) < .0001) return;
            const a = (d0[0] * (s1[1] - s2[1]) + d1[0] * (s2[1] - s0[1]) + d2[0] * (s0[1] - s1[1])) / denominator;
            const b = (d0[1] * (s1[1] - s2[1]) + d1[1] * (s2[1] - s0[1]) + d2[1] * (s0[1] - s1[1])) / denominator;
            const c = (d0[0] * (s2[0] - s1[0]) + d1[0] * (s0[0] - s2[0]) + d2[0] * (s1[0] - s0[0])) / denominator;
            const d = (d0[1] * (s2[0] - s1[0]) + d1[1] * (s0[0] - s2[0]) + d2[1] * (s1[0] - s0[0])) / denominator;
            const e = (d0[0] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[0] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[0] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;
            const f = (d0[1] * (s1[0] * s2[1] - s2[0] * s1[1]) + d1[1] * (s2[0] * s0[1] - s0[0] * s2[1]) + d2[1] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator;
            const expanded = expandTriangle(destinationTriangle);
            target.save();
            target.beginPath();
            target.moveTo(...expanded[0]); target.lineTo(...expanded[1]); target.lineTo(...expanded[2]);
            target.closePath(); target.clip(); target.setTransform(a, b, c, d, e, f); target.drawImage(image, 0, 0); target.restore();
        }
        function renderWarp(source, sourcePoints, destinationPoints, triangles) {
            const output = document.createElement("canvas");
            output.width = WIDTH; output.height = HEIGHT;
            const outputCtx = output.getContext("2d");
            for (let index = 0; index < triangles.length; index += 3) {
                const ids = [triangles[index], triangles[index + 1], triangles[index + 2]];
                drawTriangle(outputCtx, source, ids.map((id) => sourcePoints[id]), ids.map((id) => destinationPoints[id]));
            }
            return output;
        }
        function clearOutput() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#101316";
            ctx.fillRect(0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
        }
        function drawOutput(source, alpha = 1) {
            ctx.globalAlpha = alpha;
            ctx.drawImage(source, 0, 0, OUTPUT_WIDTH, OUTPUT_HEIGHT);
        }
        async function renderFrame(now = performance.now()) {
            clearOutput();
            const state = getActiveState(currentTime);
            if (!state.items.length) return;
            const sources = state.items.map((item) => drawVideoToSource(item.clip));
            if (state.items.length === 1) {
                drawOutput(sources[0]);
                stageBadge.textContent = state.items[0].clip.name;
                return;
            }
            const [from, to] = state.items;
            stageBadge.textContent = `${from.clip.name} → ${to.clip.name} · モーフ ${Math.round(state.progress * 100)}%`;
            const [fromPoints, toPoints] = await Promise.all([detectPoints(from.clip, now), detectPoints(to.clip, now)]);
            if (fromPoints && toPoints && fromPoints.length === toPoints.length) {
                const blended = fromPoints.map((point, index) => [
                    point[0] + (toPoints[index][0] - point[0]) * state.progress,
                    point[1] + (toPoints[index][1] - point[1]) * state.progress,
                ]);
                const triangles = Delaunator.from(blended).triangles;
                drawOutput(renderWarp(sources[0], fromPoints, blended, triangles));
                drawOutput(renderWarp(sources[1], toPoints, blended, triangles), state.progress);
            } else {
                drawOutput(sources[0]);
                drawOutput(sources[1], state.progress);
            }
            ctx.globalAlpha = 1;
        }
        function setPlaying(nextPlaying) {
            const next = Boolean(nextPlaying && clips.length);
            if (playing === next) return;
            playing = next;
            previousFrameAt = performance.now();
            playButton.textContent = playing ? "❚❚ 停止" : "▶ 再生";
            if (playing) {
                if (currentTime >= totalDuration()) currentTime = 0;
                seekVideos(currentTime, true);
                requestAnimationFrame(tick);
            } else clips.forEach((clip) => clip.video.pause());
        }
        async function tick(now) {
            if (playing) {
                currentTime += (now - previousFrameAt) / 1000;
                previousFrameAt = now;
                if (currentTime >= totalDuration()) {
                    currentTime = totalDuration();
                    setPlaying(false);
                    if (isExporting()) recorder.stop();
                } else seekVideos(currentTime);
            }
            await renderFrame(now);
            updatePlayhead();
            if (playing) requestAnimationFrame(tick);
        }
        function setCurrentTime(time) {
            currentTime = clamp(time, 0, totalDuration());
            previousFrameAt = performance.now();
            seekVideos(currentTime, true); updatePlayhead(); requestAnimationFrame(() => void renderFrame());
        }
        function updatePlayhead() {
            playhead.style.left = `${currentTime * pxPerSecond()}px`;
            timecode.textContent = `${formatTime(currentTime)} / ${formatTime(totalDuration())}`;
        }
        function createClipCard(clip, index) {
            const card = document.createElement("article");
            card.className = "clipCard"; card.draggable = true; card.style.setProperty("--clip-color", COLORS[index % COLORS.length]);
            card.innerHTML = `
                <video class="clipThumb" src="${clip.url}" muted preload="metadata"></video>
                <div class="clipBody">
                    <div class="clipTitle"></div>
                    <div class="clipMeta">${formatTime(clip.duration)} · クリップ ${index + 1}</div>
                    ${index ? `<label class="transitionControl"><span>前とのモーフ</span><input data-transition-range type="range" min="0.1" max="${maxTransition(index)}" step="0.1" value="${clip.transition}"><input data-transition-number type="number" min="0.1" max="${maxTransition(index)}" step="0.1" value="${clip.transition.toFixed(1)}" aria-label="前の動画とのモーフ秒数"></label>` : ""}
                </div>
                <button class="removeButton" type="button" title="削除">×</button>`;
            card.querySelector(".clipTitle").textContent = clip.name;
            const setTransition = (value) => {
                clip.transition = clamp(Number(value) || .1, .1, maxTransition(index));
                buildSchedule(); renderClipList(); renderTimeline(); updateControls(); setCurrentTime(currentTime);
            };
            card.querySelector("[data-transition-range]")?.addEventListener("change", (event) => setTransition(event.target.value));
            card.querySelector("[data-transition-number]")?.addEventListener("change", (event) => setTransition(event.target.value));
            card.querySelector(".removeButton").addEventListener("click", () => removeClip(clip.id));
            card.querySelectorAll("button,input").forEach((control) => control.addEventListener("pointerdown", (event) => event.stopPropagation()));
            card.addEventListener("dragstart", () => { draggedId = clip.id; card.classList.add("dragging"); });
            card.addEventListener("dragend", () => { draggedId = null; card.classList.remove("dragging"); });
            card.addEventListener("dragover", (event) => event.preventDefault());
            card.addEventListener("drop", (event) => {
                event.preventDefault();
                const from = clips.findIndex((item) => item.id === draggedId), to = clips.findIndex((item) => item.id === clip.id);
                if (from < 0 || to < 0 || from === to) return;
                clips.splice(to, 0, clips.splice(from, 1)[0]); normalizeTransitions(); setCurrentTime(0); renderAll();
            });
            return card;
        }
        function renderClipList() { clipList.replaceChildren(...clips.map(createClipCard)); }
        function renderTimeline() {
            const scale = pxPerSecond();
            const width = Math.max(timelineScroller.clientWidth, totalDuration() * scale + 80);
            timeline.style.width = `${width}px`; timeline.style.setProperty("--second-width", `${scale}px`);
            timeline.querySelectorAll(":scope > :not(.playhead)").forEach((element) => element.remove());
            const marks = Math.ceil(width / scale);
            for (let second = 0; second <= marks; second += 1) {
                const mark = document.createElement("span");
                mark.className = "rulerMark"; mark.style.left = `${second * scale}px`; mark.textContent = `${second}s`; timeline.appendChild(mark);
            }
            schedule.forEach((item, index) => {
                const block = document.createElement("div");
                block.className = "timelineClip"; block.style.setProperty("--clip-color", COLORS[index % COLORS.length]);
                block.style.left = `${item.start * scale}px`; block.style.top = `${30 + index % 2 * 58}px`; block.style.width = `${Math.max(34, item.clip.duration * scale)}px`;
                block.innerHTML = `<span></span><small>${formatTime(item.clip.duration)}</small>`; block.querySelector("span").textContent = item.clip.name;
                block.addEventListener("click", (event) => { event.stopPropagation(); setCurrentTime(item.start); }); timeline.appendChild(block);
                if (index > 0) {
                    const morph = document.createElement("div");
                    morph.className = "morphRegion"; morph.style.left = `${item.start * scale}px`; morph.style.width = `${Math.max(18, item.clip.transition * scale)}px`;
                    morph.innerHTML = `<span>モーフ ${item.clip.transition.toFixed(1)}秒</span>`; morph.title = `${schedule[index - 1].clip.name} → ${item.clip.name}`;
                    morph.addEventListener("click", (event) => { event.stopPropagation(); setCurrentTime(item.start + item.clip.transition / 2); }); timeline.appendChild(morph);
                }
            });
            timeline.appendChild(playhead); updatePlayhead();
        }
        function updateControls() {
            const hasClips = clips.length > 0;
            playButton.disabled = !hasClips; rewindButton.disabled = !hasClips;
            exportButton.disabled = !hasClips || !window.MediaRecorder || isExporting(); clearButton.disabled = !hasClips;
            status.textContent = `${clips.length}クリップ · 全体 ${formatTime(totalDuration())}`;
            if (!hasClips) stageBadge.textContent = "";
            updatePlayhead();
        }
        function renderAll() { renderClipList(); renderTimeline(); updateControls(); void renderFrame(); }
        function removeClip(id) {
            const index = clips.findIndex((clip) => clip.id === id); if (index < 0) return;
            const [removed] = clips.splice(index, 1); removed.video.pause(); URL.revokeObjectURL(removed.url);
            normalizeTransitions(); setPlaying(false); currentTime = 0; renderAll(); seekVideos(0, true);
        }
        function clearClips() {
            setPlaying(false); clips.forEach((clip) => URL.revokeObjectURL(clip.url)); clips = []; schedule = []; currentTime = 0;
            clearOutput(); renderAll();
        }
        function startExport() {
            if (isExporting() || !clips.length || !window.MediaRecorder) return;
            const stream = canvas.captureStream(30);
            const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
            const chunks = [];
            recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
            recorder.addEventListener("dataavailable", (event) => { if (event.data.size) chunks.push(event.data); });
            recorder.addEventListener("stop", () => {
                const blob = new Blob(chunks, { type: recorder.mimeType }); const url = URL.createObjectURL(blob); const anchor = document.createElement("a");
                anchor.href = url; anchor.download = `morph-sequence-${new Date().toISOString().replaceAll(":", "-")}.webm`; anchor.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000); recorder = null; exportButton.textContent = "WebM書出し"; updateControls();
            }, { once: true });
            exportButton.textContent = "書出し中…"; recorder.start(); setCurrentTime(0); setPlaying(true); updateControls();
        }
        fileInput.addEventListener("change", async (event) => { await addFiles(event.target.files); event.target.value = ""; });
        playButton.addEventListener("click", () => setPlaying(!playing));
        rewindButton.addEventListener("click", () => setCurrentTime(0));
        clearButton.addEventListener("click", clearClips);
        monoInput.addEventListener("change", () => canvas.classList.toggle("monochrome", monoInput.checked));
        zoomInput.addEventListener("input", renderTimeline);
        exportButton.addEventListener("click", startExport);
        timeline.addEventListener("pointerdown", (event) => {
            if (event.target.closest(".timelineClip,.morphRegion")) return;
            const rect = timeline.getBoundingClientRect(); setCurrentTime((event.clientX - rect.left) / pxPerSecond());
        });
        window.addEventListener("resize", renderTimeline);
        window.addEventListener("beforeunload", () => clips.forEach((clip) => URL.revokeObjectURL(clip.url)));
        const sequenceCheck = calculateSchedule([
            { duration: 2, transition: 0 }, { duration: 2, transition: 1 }, { duration: 2, transition: 1 },
        ]);
        console.assert(
            sequenceCheck[1].start === 1 && sequenceCheck[2].start === 2 && sequenceCheck[2].end === 4,
            "2秒×3クリップ、1秒モーフのシーケンス計算が正しくありません",
        );
        renderAll();
    </script>
</body>
