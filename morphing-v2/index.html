<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自動表情モーフィング</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            background: #101316;
            font-family: system-ui, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100svh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #automationStatus {
            position: fixed;
            z-index: 10;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            max-width: min(760px, calc(100% - 32px));
            padding: 9px 14px;
            border-radius: 999px;
            color: #e8edf2;
            background: rgb(16 19 22 / 88%);
            box-shadow: 0 3px 18px #0008;
            font-size: 13px;
            line-height: 1.35;
            text-align: center;
            pointer-events: none;
        }

        #automationStatus[data-error="true"] {
            color: #ffd3d3;
            background: rgb(85 18 18 / 92%);
        }
    </style>
</head>

<body>
    <section class="screen" aria-label="モーフィング画面">
        <iframe id="morphing" src="morphing.html" title="モーフィング"></iframe>
    </section>
    <section class="screen" aria-label="解析・調整画面">
        <iframe id="expressionPicker" src="expression-picker.html" title="表情フレーム・クリップ抽出"></iframe>
    </section>
    <output id="automationStatus">自動処理を準備しています…</output>

    <script>
        const JOBS_URL = "/api/morphing/uploads/jobs";
        const COMPLETE_URL = "/api/morphing/uploads/complete";
        const POLL_INTERVAL = 1000;
        const INCOMPLETE_BATCH_WAIT = 75_000;
        const morphingFrame = document.querySelector("#morphing");
        const pickerFrame = document.querySelector("#expressionPicker");
        const status = document.querySelector("#automationStatus");
        const batches = [];
        const knownIds = new Set();
        const reportedErrors = new Set();
        let processing = false;

        const formatParts = (jobs) => jobs.map(({ part }) => `p${part}`).join(", ");
        const batchName = (jobs) => `${new Date(Math.min(...jobs.map(({ modifiedAt }) => modifiedAt)))
            .toISOString().replaceAll(":", "-").replace(".000Z", "Z")}-${crypto.randomUUID().slice(0, 8)}`;
        function setStatus(message, error = false) {
            status.textContent = message;
            status.dataset.error = String(error);
        }

        function addJob(job) {
            if (!job?.id || knownIds.has(job.id) || !Number.isInteger(job.part)) return;
            knownIds.add(job.id);
            let batch = batches.at(-1);
            if (!batch || (job.part === 1 && batch.jobs.length) || batch.parts.has(job.part)) {
                batch = { jobs: [], parts: new Set(), lastAddedAt: 0, complete: false };
                batches.push(batch);
            }
            batch.jobs.push(job);
            batch.parts.add(job.part);
            batch.lastAddedAt = Date.now();
            if (job.part === 6) batch.complete = true;
        }
        function readyBatch() {
            const batch = batches[0];
            if (!batch) return null;
            const followedByAnotherBatch = batches.length > 1;
            return batch.complete || followedByAnotherBatch || Date.now() - batch.lastAddedAt >= INCOMPLETE_BATCH_WAIT
                ? batch : null;
        }
        async function acknowledge(jobs) {
            const response = await fetch(COMPLETE_URL, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ids: jobs.map(({ id }) => id) }),
            });
            if (!response.ok) throw new Error("ZIPの処理済み状態を保存できません");
        }
        async function processNextBatch() {
            if (processing) return;
            const batch = readyBatch();
            if (!batch) {
                if (batches[0]) setStatus(`${formatParts(batches[0].jobs)} を受信済み・残りのZIPを待機中…`);
                return;
            }
            processing = true;
            batches.shift();
            const jobs = [...batch.jobs].sort((left, right) => left.part - right.part);
            try {
                setStatus(`${formatParts(jobs)} の動画を解析・調整画面へ読み込み中…`);
                const sources = jobs.map((job) => ({
                    url: job.videoUrl,
                    name: decodeURIComponent(job.videoUrl.split("/").at(-1)),
                }));
                const result = await pickerFrame.contentWindow.runAutomaticExpressionPicker(sources, batchName(jobs));
                if (result.sources.length) {
                    setStatus(`${result.emotion} の抽出結果 ${result.sources.length}本を保存し、モーフィングを準備中…`);
                    await morphingFrame.contentWindow.runAutomaticMorphing(result.sources);
                    setStatus("再生完了。素材を破棄して次のセットを待機します…");
                } else setStatus("出力形式が画像のため、モーフィング再生は行いません。", true);
                await acknowledge(jobs);
            } catch (error) {
                console.error(error); setStatus(`自動処理エラー: ${error.message || error}`, true);
            } finally {
                morphingFrame.contentWindow.clearAutomaticMorphing?.();
                processing = false;
                setTimeout(processNextBatch, 0);
            }
        }
        async function poll() {
            try {
                const response = await fetch(JOBS_URL, { cache: "no-store" });
                if (!response.ok) throw new Error("専用サーバーに接続できません");
                const data = await response.json();
                (data.jobs || []).sort((left, right) => left.modifiedAt - right.modifiedAt).forEach(addJob);
                for (const error of data.errors || []) {
                    const key = `${error.zipName}:${error.message}`;
                    if (!reportedErrors.has(key)) { reportedErrors.add(key); console.error("ZIP読込エラー", error); }
                }
                await processNextBatch();
            } catch (error) {
                if (!processing) setStatus(`${error.message}。morphing-v2/server.py で起動してください。`, true);
            }
        }

        window.addEventListener("load", async () => {
            setStatus("ZIPを待機しています…");
            await poll();
            setInterval(poll, POLL_INTERVAL);
        });
    </script>
</body>

</html>
